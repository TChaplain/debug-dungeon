    ]},

  { title:'Simulation & Randomness', mon:'Unseeded Chaos', emoji:'\u{1F3B2}',
    taunt:'"Different answer every time. Prove me wrong."',
    lesson:[
      { h:'Drawing random values',
        p:['R has a generator for every distribution you will meet in class. The naming is systematic: <b>r</b> for random, <b>d</b> for density, <b>p</b> for cumulative probability, <b>q</b> for quantile.'],
        code:'sample(1:6, 3)                    # 3 dice faces, no repeats\nsample(1:6, 10, replace = TRUE)   # 10 rolls, repeats allowed\nrnorm(3, mean = 100, sd = 15)     # 3 draws from a normal\nrunif(3, min = 0, max = 1)        # 3 uniform draws',
        note:'<code>replace = TRUE</code> is what you want for dice, coins and bootstrap sampling. Without it you are dealing from a deck without putting cards back.' },
      { h:'set.seed(): reproducibility',
        p:['<b>The single most important habit in this floor.</b> A seed fixes the random sequence, so anyone re-running your script — including your marker, and future you — gets identical numbers.'],
        code:'set.seed(42)\na <- sample(1:6, 3)\n\nset.seed(42)\nb <- sample(1:6, 3)\n\nprint(identical(a, b))', out:'[1] TRUE',
        note:'<b>Put <code>set.seed()</code> at the top of any script that uses randomness.</b> A result that cannot be reproduced is not a result, and unseeded homework is a standard way to lose marks.' },
      { h:'The normal distribution toolkit',
        p:['The four prefixes, all for the same distribution. These answer nearly every "what is the probability that..." question in an intro course.'],
        code:'print(round(dnorm(0), 4))            # height of the curve at 0\nprint(round(pnorm(1.96), 4))         # P(Z < 1.96)\nprint(round(qnorm(0.975), 4))        # the z with 97.5% below it\nprint(round(pnorm(1.96) - pnorm(-1.96), 4))',
        out:'[1] 0.3989\n[1] 0.975\n[1] 1.96\n[1] 0.95',
        note:'<b>That last line is where 1.96 comes from.</b> 95% of a normal distribution lies within 1.96 standard deviations of the mean — the number behind every 95% confidence interval you will ever write.' },
      { h:'Simulating to answer a question',
        p:['Rather than deriving a probability, you can often just simulate it many times and count. <code>replicate()</code> repeats an expression.'],
        code:'set.seed(1)\n\n# P(sum of two dice is 7)?\nrolls <- replicate(10000, sum(sample(1:6, 2, replace = TRUE)))\nprint(round(mean(rolls == 7), 3))',
        out:'[1] 0.166',
        note:'The true answer is 6/36 = 0.1667. This is the <b>Monte Carlo</b> method, and it is genuinely how hard probability questions get answered in practice.' },
      { h:'The law of large numbers, demonstrated',
        p:['More samples, closer to the truth. This is the intuition behind why bigger studies are more trustworthy.'],
        code:'set.seed(7)\nprint(round(mean(rnorm(10)), 2))\nprint(round(mean(rnorm(100)), 2))\nprint(round(mean(rnorm(100000)), 3))',
        out:'[1] 0.11\n[1] -0.11\n[1] 0.002' }
    ],
    encounters:[
      { t:'mcq', q:'Why call <code>set.seed(42)</code> before random code?',
        opts:['It makes results more random','It makes the sequence reproducible for anyone re-running the script','It is required by sample()','It speeds things up'], a:1,
        why:'Same seed, same numbers. Unseeded analysis cannot be checked, which is why markers ask for it.' },
      { t:'mcq', q:'You want 10 dice rolls. Which is right?',
        opts:['sample(1:6, 10)','sample(1:6, 10, replace = TRUE)','rnorm(10, 1, 6)','runif(10, 1, 6)'], a:1,
        why:'Without replace = TRUE you cannot draw more than 6 values, and a real die can repeat.' },
      { t:'mcq', q:'What does <code>pnorm(1.96)</code> give?',
        opts:['The height of the curve at 1.96','The probability a standard normal is below 1.96 (about 0.975)','1.96 standard deviations','A random number'], a:1,
        why:'p = cumulative probability. This is why 1.96 gives the 95% two-tailed interval.' },
      { t:'mcq', q:'<code>rnorm(1000)</code> draws from a normal with what mean and sd by default?',
        opts:['mean 1000, sd 1','mean 0, sd 1','mean 1, sd 0','Random each time'], a:1,
        why:'The defaults are the standard normal: mean 0, sd 1.' },
      { t:'fill', q:'Make this analysis reproducible.',
        code:'___(42)\nrolls <- sample(1:6, 10, replace = TRUE)', answers:['set.seed'],
        why:'set.seed fixes the random sequence so results can be checked.' },
      { t:'code', task:'Write <code>roll(n)</code> returning n dice rolls (values 1 to 6, repeats allowed).',
        starter:'roll <- function(n) {\n  # your code here\n}\n',
        harness:'set.seed(1)\na <- roll(5)\nset.seed(1)\nb <- roll(5)\nprint(identical(a, b))\nprint(length(a))\nprint(all(a >= 1 & a <= 6))',
        expected:'[1] TRUE\n[1] 5\n[1] TRUE',
        hint:'sample(1:6, n, replace = TRUE)',
        solution:'roll <- function(n) {\n  sample(1:6, n, replace = TRUE)\n}' },
      { t:'code', task:'Write <code>prob_seven(trials)</code> estimating P(two dice sum to 7) by simulation, rounded to 1 dp.',
        starter:'prob_seven <- function(trials) {\n  # simulate, then take the proportion\n}\n',
        harness:'set.seed(1)\nprint(round(prob_seven(20000), 1))', expected:'[1] 0.2',
        hint:'rolls <- replicate(trials, sum(sample(1:6, 2, replace = TRUE))), then mean(rolls == 7). True answer 0.167, rounds to 0.2.',
        solution:'prob_seven <- function(trials) {\n  rolls <- replicate(trials, sum(sample(1:6, 2, replace = TRUE)))\n  mean(rolls == 7)\n}' },
      { t:'code', task:'Write <code>within_two_sd()</code> returning the proportion of a standard normal within ±1.96, to 2 dp.',
        starter:'within_two_sd <- function() {\n  # use pnorm - no simulation needed\n}\n',
        harness:'print(within_two_sd())', expected:'[1] 0.95',
        hint:'round(pnorm(1.96) - pnorm(-1.96), 2)',
        solution:'within_two_sd <- function() {\n  round(pnorm(1.96) - pnorm(-1.96), 2)\n}' }
    ]},

  { title:'BOSS: Hypothesis Testing', mon:'The Null Hypothesis', emoji:'\u{1F480}', boss:true,
    taunt:'"There is no effect. Convince me otherwise."',
    lesson:[
      { h:'The logic, in four sentences',
        p:['<b>1.</b> Assume there is no effect — that is the <b>null hypothesis</b>. <b>2.</b> Ask: if the null were true, how surprising would my data be? <b>3.</b> That surprise, as a probability, is the <b>p-value</b>. <b>4.</b> If it is small enough (usually below 0.05), reject the null.',
           'Everything else on this floor is bookkeeping around those four lines.'] },
      { h:'What a p-value is NOT',
        p:['This is the most-tested conceptual point in any statistics course, and the most commonly got wrong — including in published papers.'],
        code:'p = P(data this extreme | null is true)\n\nNOT  P(null is true | data)\nNOT  the probability you are wrong\nNOT  the size or importance of the effect',
        note:'<b>p = 0.03 does NOT mean "3% chance the null is true".</b> It means: if there were genuinely no effect, you would see data this extreme 3% of the time. With a big enough sample, a meaningless effect will produce a tiny p-value — which is why you always report the effect size too.' },
      { h:'The t-test',
        p:['Compares means. <b>One-sample:</b> is this mean different from a specific value? <b>Two-sample:</b> do these two groups differ? <b>Paired:</b> did the same subjects change?'],
        code:'x <- c(5.1, 4.9, 5.0, 5.2, 4.8)\n\nresult <- t.test(x, mu = 5)\nprint(round(result$p.value, 3))\nprint(round(result$statistic[[1]], 3))\n\n# two groups, formula style\n# t.test(score ~ group, data = df)',
        out:'[1] 1\n[1] 0',
        note:'Those values have a mean of exactly 5.0, so t is 0 and p is 1 — as unsurprising as data can possibly be. <b>Pull single numbers out with <code>$p.value</code></b> rather than reading the printed block.' },
      { h:'Reading the output block',
        p:['A real t.test prints something like this. The three things you report:'],
        code:'\tOne Sample t-test\n\ndata:  x\nt = 2.3452, df = 24, p-value = 0.02752\nalternative hypothesis: true mean is not equal to 5\n95 percent confidence interval:\n 5.012  5.188\nsample estimates:\nmean of x \n     5.10',
        note:'<b>Report the statistic, the df, the p-value, AND the confidence interval.</b> The interval tells you the plausible size of the effect — the p-value alone never does.' },
      { h:'Correlation and chi-square',
        p:['<code>cor()</code> for the strength of a linear relationship between two numeric variables; <code>chisq.test()</code> for whether two categorical variables are related.'],
        code:'x <- c(1, 2, 3)\ny <- c(2, 4, 6)\nprint(cor(x, y))\n\n# is the correlation significant?\n# cor.test(x, y)\n\n# are two categories independent?\n# chisq.test(table(df$year, df$passed))',
        out:'[1] 1',
        note:'<b>cor() ranges from −1 to 1.</b> 0 means no <i>linear</i> relationship — it can be 0 for a perfect curve. And correlation is not causation, which your exam will ask about in words.' },
      { h:'Two errors, and the assumptions',
        p:['<b>Type I</b>: rejecting a true null (a false positive) — its rate is your alpha, usually 0.05. <b>Type II</b>: failing to reject a false null (a false negative).',
           'A t-test assumes roughly normal data, independent observations, and (for two-sample) similar variances — R\'s default Welch test relaxes that last one for you. If normality clearly fails, reach for a non-parametric test like <code>wilcox.test()</code>.'] }
    ],
    encounters:[
      { t:'mcq', q:'A p-value of 0.03 means:',
        opts:['There is a 3% chance the null hypothesis is true','If the null were true, data this extreme would occur 3% of the time','The effect is 3% in size','You are 97% correct'], a:1,
        why:'The p-value is a probability about the DATA given the null, never a probability about the null itself. This is the most commonly misstated idea in statistics.' },
      { t:'mcq', q:'What is a Type I error?',
        opts:['Failing to detect a real effect','Rejecting a null hypothesis that was actually true','A coding mistake','A missing value'], a:1,
        why:'A false positive. Its rate is your significance level, alpha.' },
      { t:'mcq', q:'With alpha = 0.05 and p = 0.12, what do you conclude?',
        opts:['Accept the null — there is no effect','Fail to reject the null; there is insufficient evidence of an effect','Reject the null','The test failed'], a:1,
        why:'You never "accept" or "prove" a null. Absence of evidence is not evidence of absence — the wording matters on exams.' },
      { t:'mcq', q:'<code>cor(x, y)</code> returns 0. What does that mean?',
        opts:['x and y are unrelated in every way','No LINEAR relationship — a perfect curve could still give 0','The test failed','x equals y'], a:1,
        why:'Pearson correlation only measures straight-line association. Always plot the data before trusting a correlation.' },
      { t:'mcq', q:'Which R call compares the means of two groups stored in a data frame?',
        opts:['cor(score, group)','t.test(score ~ group, data = df)','table(score, group)','mean(df)'], a:1,
        why:'The formula "score explained by group" — the same syntax as aggregate and lm.' },
      { t:'code', task:'Write <code>p_of(x, mu)</code> returning the one-sample t-test p-value, rounded to 3 dp.',
        starter:'p_of <- function(x, mu) {\n  # your code here\n}\n',
        harness:'print(p_of(c(5.1, 4.9, 5.0, 5.2, 4.8), 5))', expected:'[1] 1',
        hint:'round(t.test(x, mu = mu)$p.value, 3). The sample mean is exactly 5, so p is 1.',
        solution:'p_of <- function(x, mu) {\n  round(t.test(x, mu = mu)$p.value, 3)\n}' },
      { t:'code', task:'Write <code>is_significant(p)</code> returning TRUE when p is below 0.05.',
        starter:'is_significant <- function(p) {\n  # your code here\n}\n',
        harness:'print(is_significant(0.03))\nprint(is_significant(0.12))\nprint(is_significant(0.05))', expected:'[1] TRUE\n[1] FALSE\n[1] FALSE',
        hint:'p < 0.05 — strictly less than, so exactly 0.05 is not significant.',
        solution:'is_significant <- function(p) {\n  p < 0.05\n}' },
      { t:'code', task:'Write <code>strength(x, y)</code> returning the correlation rounded to 2 dp.',
        starter:'strength <- function(x, y) {\n  # your code here\n}\n',
        harness:'print(strength(c(1, 2, 3), c(2, 4, 6)))\nprint(strength(c(1, 2, 3), c(6, 4, 2)))', expected:'[1] 1\n[1] -1',
        hint:'round(cor(x, y), 2)',
        solution:'strength <- function(x, y) {\n  round(cor(x, y), 2)\n}' },
      { t:'code', task:'Write <code>verdict(x, mu)</code> returning "significant" or "not significant" at alpha = 0.05.',
        starter:'verdict <- function(x, mu) {\n  # run the test, then decide\n}\n',
        harness:'print(verdict(c(5.1, 4.9, 5.0, 5.2, 4.8), 5))\nprint(verdict(c(10, 11, 12, 11, 10), 5))',
        expected:'[1] "not significant"\n[1] "significant"',
        hint:'p <- t.test(x, mu = mu)$p.value, then ifelse(p < 0.05, "significant", "not significant").',
        solution:'verdict <- function(x, mu) {\n  p <- t.test(x, mu = mu)$p.value\n  ifelse(p < 0.05, "significant", "not significant")\n}' }
    ]},

  { title:'Linear Regression', mon:'Line of Best Fit', emoji:'\u{1F4C8}',
    taunt:'"Draw a line through my noise. I dare you."',
    lesson:[
      { h:'What regression is doing',
        p:['Fitting the straight line that minimises the total squared vertical distance to your points. That line lets you (a) describe the relationship, and (b) predict.'],
        code:'y = intercept + slope * x + error\n\nintercept = predicted y when x is 0\nslope     = how much y changes per 1-unit rise in x',
        note:'<b>The slope is the number you interpret in a sentence.</b> "Each additional hour of study is associated with 4.2 more points." Note "associated with", not "causes" — regression on observational data cannot establish causation.' },
      { h:'lm(): the workhorse',
        p:['Same formula syntax as t.test and aggregate: <b>outcome ~ predictor</b>.'],
        code:'x <- c(1, 2, 3)\ny <- c(3, 5, 7)\n\nmodel <- lm(y ~ x)\nprint(coef(model))\nprint(round(coef(model)[[2]], 2))',
        out:'(Intercept)           x \n          1           2 \n[1] 2',
        note:'Slope 2, intercept 1 — because y really is 2x + 1 with no noise. <code>coef(model)[[1]]</code> is the intercept, <code>[[2]]</code> the slope.' },
      { h:'Reading summary(model)',
        p:['This block is what your assignment asks you to interpret. Four things matter:'],
        code:'Coefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   1.2000     0.8544   1.404  0.19400\nx             4.2000     0.9165   4.583  0.00131 **\n\nResidual standard error: 2.16 on 8 degrees of freedom\nMultiple R-squared:  0.724,\tAdjusted R-squared: 0.689\nF-statistic: 21.0 on 1 and 8 DF,  p-value: 0.00131',
        note:'<b>Estimate</b> = the slope. <b>Pr(&gt;|t|)</b> = is that slope significantly different from zero. <b>R-squared</b> = the share of variance in y explained by x (0.724 = 72.4%). <b>F-statistic p-value</b> = is the model as a whole any use.' },
      { h:'Predicting',
        p:['<code>predict()</code> needs a data frame whose column names match your predictors exactly.'],
        code:'x <- c(1, 2, 3)\ny <- c(3, 5, 7)\nmodel <- lm(y ~ x)\n\nprint(as.numeric(predict(model, data.frame(x = 4))))\nprint(round(summary(model)$r.squared, 2))', out:'[1] 9\n[1] 1',
        note:'R-squared of 1 means a perfect fit — real data never does this. <b>Do not predict far outside your observed range</b>; the line has no idea what happens out there.' },
      { h:'Residuals: checking the model is allowed',
        p:['A residual is actual minus predicted. Regression assumes they are roughly normal, evenly spread, and independent. <code>plot(model)</code> gives four diagnostic charts.'],
        code:'print(round(residuals(model), 2))\n\n# plot(model)         # four diagnostic plots\n# plot(x, y)          # always look at the raw data first\n# abline(model)       # then add the fitted line',
        out:'  1   2   3 \n  0   0   0 ',
        note:'<b>Anscombe\'s quartet</b> — four datasets with identical regression output and wildly different shapes. It is the reason "always plot your data first" is drilled into every stats course.' },
      { h:'Multiple regression',
        p:['Add predictors with <code>+</code>. Each slope is then "the effect of this variable, holding the others constant" — which is the entire point.'],
        code:'# model <- lm(score ~ hours + attendance, data = df)\n# summary(model)',
        note:'Watch for <b>multicollinearity</b>: when predictors are strongly correlated with each other, their individual slopes become unstable and hard to interpret.' }
    ],
    encounters:[
      { t:'mcq', q:'In <code>lm(y ~ x)</code>, which is the outcome being predicted?',
        opts:['x','y','Both','Neither'], a:1,
        why:'The left of the tilde is the outcome; the right holds the predictors.' },
      { t:'mcq', q:'What does an R-squared of 0.72 mean?',
        opts:['The correlation is 0.72','72% of the variation in y is explained by the model','The slope is 0.72','The p-value is 0.72'], a:1,
        why:'R-squared is the proportion of variance explained. For simple regression it equals the correlation squared.' },
      { t:'mcq', q:'The slope is 4.2. How do you state it?',
        opts:['x causes a 4.2 increase in y','Each 1-unit increase in x is associated with a 4.2 increase in y','y is 4.2 times x','4.2% of the data fits'], a:1,
        why:'"Associated with", per one unit. Observational regression cannot establish causation, and exams check that wording.' },
      { t:'mcq', q:'Which part of <code>summary(model)</code> tells you if a predictor matters?',
        opts:['Residual standard error','The Pr(>|t|) column for that predictor','The intercept','Degrees of freedom'], a:1,
        why:'That is the p-value for the null "this slope is zero".' },
      { t:'mcq', q:'Why is "always plot your data first" repeated so often?',
        opts:['Plots look good in reports','Very different datasets can produce identical regression summaries (Anscombe\'s quartet)','It is faster','R requires it'], a:1,
        why:'Summary statistics can hide curves, clusters and outliers entirely. The picture shows what the numbers cannot.' },
      { t:'code', task:'Write <code>slope_of(x, y)</code> returning the fitted slope, rounded to 2 dp.',
        starter:'slope_of <- function(x, y) {\n  # fit a model, then pull the slope\n}\n',
        harness:'print(slope_of(c(1, 2, 3), c(3, 5, 7)))\nprint(slope_of(c(1, 2, 3), c(2, 4, 6)))', expected:'[1] 2\n[1] 2',
        hint:'m <- lm(y ~ x), then round(coef(m)[[2]], 2). Index 2 is the slope; 1 is the intercept.',
        solution:'slope_of <- function(x, y) {\n  m <- lm(y ~ x)\n  round(coef(m)[[2]], 2)\n}' },
      { t:'code', task:'Write <code>intercept_of(x, y)</code> returning the intercept, rounded to 2 dp.',
        starter:'intercept_of <- function(x, y) {\n  # your code here\n}\n',
        harness:'print(intercept_of(c(1, 2, 3), c(3, 5, 7)))', expected:'[1] 1',
        hint:'round(coef(lm(y ~ x))[[1]], 2)',
        solution:'intercept_of <- function(x, y) {\n  round(coef(lm(y ~ x))[[1]], 2)\n}' },
      { t:'code', task:'Write <code>predict_at(x, y, new_x)</code> predicting y for a new x value.',
        starter:'predict_at <- function(x, y, new_x) {\n  # your code here\n}\n',
        harness:'print(predict_at(c(1, 2, 3), c(3, 5, 7), 4))', expected:'[1] 9',
        hint:'m <- lm(y ~ x), then as.numeric(predict(m, data.frame(x = new_x))). The column must be named x to match.',
        solution:'predict_at <- function(x, y, new_x) {\n  m <- lm(y ~ x)\n  as.numeric(predict(m, data.frame(x = new_x)))\n}' },
      { t:'code', task:'Write <code>fit_quality(x, y)</code> returning R-squared rounded to 2 dp.',
        starter:'fit_quality <- function(x, y) {\n  # your code here\n}\n',
        harness:'print(fit_quality(c(1, 2, 3), c(3, 5, 7)))', expected:'[1] 1',
        hint:'round(summary(lm(y ~ x))$r.squared, 2)',
        solution:'fit_quality <- function(x, y) {\n  round(summary(lm(y ~ x))$r.squared, 2)\n}' }
    ]},

  { title:'FINAL BOSS: The Data Exam', mon:'The Examiner', emoji:'\u{1F3DB}️', boss:true,
    taunt:'"Here is a dataset. You have one hour. Show your working."',
    lesson:[
      { h:'The standard analysis, start to finish',
        p:['Every dataset you are handed gets the same opening. Doing it in this order catches the problems before they poison the analysis:'],
        code:'# 1. LOOK\nstr(df)                    # types of every column\nsummary(df)                # ranges, medians, NA counts\ncolSums(is.na(df))         # missing data, per column\n\n# 2. CLEAN\ndf$group <- factor(df$group)\ndf <- df[!is.na(df$score), ]\n\n# 3. DESCRIBE\ntapply(df$score, df$group, mean)\ntable(df$group)\n\n# 4. PLOT\nhist(df$score)\nboxplot(score ~ group, data = df)\nplot(df$hours, df$score)\n\n# 5. TEST\nt.test(score ~ group, data = df)\n\n# 6. MODEL\nsummary(lm(score ~ hours, data = df))' },
      { h:'Writing up a result',
        p:['A complete sentence contains four things: the test, the statistic with df, the p-value, and the effect with its interval.',
           '<i>"An independent-samples t-test found a significant difference in scores between groups (t(38) = 2.35, p = .028). Group A scored 4.1 points higher on average, 95% CI [0.5, 7.7]."</i>',
           'Reporting only "p < .05" loses marks in every course that grades write-ups.'] },
      { h:'The five things markers deduct for',
        p:['<b>1.</b> No <code>set.seed()</code> on anything random. <b>2.</b> Saying "accept the null" or "proves". <b>3.</b> Reporting p without an effect size or interval. <b>4.</b> Never plotting the raw data. <b>5.</b> Silently dropping NAs without saying how many.'] }
    ],
    encounters:[
      { t:'mcq', q:'First thing you do with a dataset you have just been handed?',
        opts:['Run a t-test','str() and summary() to see types, ranges and missing values','Plot everything','Fit a regression'], a:1,
        why:'Type and missingness surprises invalidate everything downstream. Look before you analyse.' },
      { t:'mcq', q:'Which sentence would a marker accept?',
        opts:['"The test proves group A is better."','"We accept the null hypothesis."','"There was a significant difference (t(38) = 2.35, p = .028), with group A scoring 4.1 points higher."','"p < .05, so it worked."'], a:2,
        why:'Statistic with df, exact p, direction and size of the effect. You never "prove" or "accept the null".' },
      { t:'code', task:'Write <code>clean_mean(v)</code> returning the mean with NAs removed, rounded to 2 dp.',
        starter:'clean_mean <- function(v) {\n  # your code here\n}\n',
        harness:'print(clean_mean(c(2, 4, NA, 6)))\nprint(clean_mean(c(1, 2, 2)))', expected:'[1] 4\n[1] 1.67',
        hint:'round(mean(v, na.rm = TRUE), 2)',
        solution:'clean_mean <- function(v) {\n  round(mean(v, na.rm = TRUE), 2)\n}' },
      { t:'code', task:'Write <code>summarise_group(df)</code> returning the mean score for group "A".',
        starter:'summarise_group <- function(df) {\n  # your code here\n}\n',
        harness:'d <- data.frame(score = c(90, 70, 80, 60), group = c("A","B","A","B"))\nprint(summarise_group(d))',
        expected:'[1] 85',
        hint:'mean(df$score[df$group == "A"]) — or tapply then [["A"]].',
        solution:'summarise_group <- function(df) {\n  mean(df$score[df$group == "A"])\n}' },
      { t:'code', task:'Write <code>full_report(df)</code> returning a vector: rows, mean score (2 dp), and highest score.',
        starter:'full_report <- function(df) {\n  # return c(n, mean, max)\n}\n',
        harness:'d <- data.frame(score = c(80, 90, 100))\nprint(full_report(d))', expected:'[1]   3  90 100',
        hint:'c(nrow(df), round(mean(df$score), 2), max(df$score)). R right-aligns to the widest number, hence the padding.',
        solution:'full_report <- function(df) {\n  c(nrow(df), round(mean(df$score), 2), max(df$score))\n}' },
      { t:'code', task:'<b>Final strike.</b> Write <code>analyse(df)</code> returning "significant" or "not significant" for whether group means differ.',
        starter:'analyse <- function(df) {\n  # t-test score by group, then decide at alpha = 0.05\n}\n',
        harness:'d <- data.frame(score = c(90, 91, 89, 60, 61, 59), group = c("A","A","A","B","B","B"))\nprint(analyse(d))\nd2 <- data.frame(score = c(70, 71, 69, 70, 71, 69), group = c("A","A","A","B","B","B"))\nprint(analyse(d2))',
        expected:'[1] "significant"\n[1] "not significant"',
        hint:'p <- t.test(score ~ group, data = df)$p.value, then ifelse(p < 0.05, "significant", "not significant").',
        solution:'analyse <- function(df) {\n  p <- t.test(score ~ group, data = df)$p.value\n  ifelse(p < 0.05, "significant", "not significant")\n}' }
    ]}
  ]};
CONTENT.javascript = {
  name:'JavaScript', indent:'  ',
  tag:'#1 by usage · every web job · works offline',
  tagline:'Used by 66% of developers in the Stack Overflow survey — the most-used language every year since 2011 bar two. If you want frontend or full-stack, this is non-negotiable. Runs instantly here with no download.',
  zones:[

  { title:'Variables & Types', mon:'Coercion Imp', emoji:'\u{1F479}',
    taunt:'"I will turn your numbers into words when you least expect it."',
    lesson:[
      { h:'let and const',
        p:['<code>const</code> for values that never get reassigned — which is most of them. <code>let</code> when it will change. Never use <code>var</code> in new code; it has scoping rules that surprise people.'],
        code:'const name = "Taj";\nlet score = 0;\nscore = score + 10;\nconsole.log(score);', out:'10',
        note:'<b>const does not mean frozen.</b> <code>const arr = [1]</code> then <code>arr.push(2)</code> is legal — you cannot reassign the name, but the contents can change.' },
      { h:'The types',
        p:['<code>number</code> (no separate int/float — all numbers are doubles), <code>string</code>, <code>boolean</code>, plus <code>null</code> and <code>undefined</code>.'],
        code:'console.log(typeof 5);\nconsole.log(typeof "hi");\nconsole.log(typeof true);\nconsole.log(typeof undefined);\nconsole.log(0.1 + 0.2);',
        out:'number\nstring\nboolean\nundefined\n0.30000000000000004',
        note:'<b>That last line is not a JS bug</b> — it is how binary floating point works in every language, Python included. Never compare decimals with ===; compare the difference against a tiny tolerance.' },
      { h:'Coercion: the monster',
        p:['Unlike Python, JS will silently convert types rather than erroring:'],
        code:'console.log("5" + 5);\nconsole.log("5" - 5);\nconsole.log(Number("5") + 5);\nconsole.log([] + {});',
        out:'55\n0\n10\n[object Object]',
        note:'<b>+ means "join text" if either side is a string; − has no text meaning so it forces numbers.</b> That inconsistency is the source of a thousand jokes and a few real bugs.' },
      { h:'=== always, == never',
        p:['<code>==</code> converts types before comparing. <code>===</code> does not. There is no good reason to use the loose one.'],
        code:'console.log(5 == "5");\nconsole.log(5 === "5");\nconsole.log(null == undefined);\nconsole.log(null === undefined);', out:'true\nfalse\ntrue\nfalse' },
      { h:'null vs undefined',
        p:['<code>undefined</code> means "never given a value" — JS produces it. <code>null</code> means "deliberately empty" — you produce it.'],
        code:'let a;\nconsole.log(a);\nlet b = null;\nconsole.log(b);\nconsole.log(typeof null);', out:'undefined\nnull\nobject',
        note:'<code>typeof null === "object"</code> is a famous bug from 1995 that can never be fixed without breaking the web.' }
    ],
    encounters:[
      { t:'mcq', q:'What does this log?', code:'let x = 7;\nx = x + 3;\nconsole.log(x);',
        opts:['7','10','73','Error'], a:1, why:'Right side first, then stored back into x.' },
      { t:'mcq', q:'What does <code>console.log("5" + 5)</code> print?',
        opts:['10','"10"','55','Error'], a:2,
        why:'With a string on either side, + joins text. Use Number("5") + 5 to get 10.' },
      { t:'mcq', q:'What does <code>console.log("5" - 5)</code> print?',
        opts:['55','0','"0"','NaN'], a:1,
        why:'Minus has no string meaning, so JS converts both to numbers. The inconsistency with + is the joke.' },
      { t:'mcq', q:'Why use <code>===</code> instead of <code>==</code>?',
        opts:['It is faster','== converts types first, so "5" == 5 is true','== is deprecated','No difference'], a:1,
        why:'Loose equality hides type bugs. Always use strict.' },
      { t:'mcq', q:'What does <code>console.log(0.1 + 0.2)</code> print?',
        opts:['0.3','0.30000000000000004','Error','0'], a:1,
        why:'Binary floating point cannot represent 0.1 exactly. True in Python and every other language too.' },
      { t:'code', task:'Create a constant <code>total</code> holding the sum of 17 and 25.',
        starter:'// store the sum in a constant named total\nconst total = \n', harness:'console.log(total);', expected:'42',
        hint:'const total = 17 + 25;', solution:'const total = 17 + 25;' },
      { t:'code', task:'<b>Complete it.</b> <code>age</code> is a string. Set <code>result</code> to age plus 5 <i>as a number</i>.',
        starter:'const age = "20";\n// convert age to a number, then add 5\nconst result = \n', harness:'console.log(result);', expected:'25',
        hint:'Number("20") converts a string into a number.',
        solution:'const age = "20";\nconst result = Number(age) + 5;' }
    ]},

  { title:'Making Decisions', mon:'Truthy Shade', emoji:'\u{1F47B}',
    taunt:'"Is an empty array true? Are you sure?"',
    lesson:[
      { h:'if / else if / else',
        p:['Braces mark the block, not indentation. Once a branch matches, the rest are skipped.'],
        code:'const score = 85;\nif (score >= 90) {\n  console.log("A");\n} else if (score >= 80) {\n  console.log("B");\n} else {\n  console.log("F");\n}', out:'B' },
      { h:'Truthy and falsy — memorise the falsy list',
        p:['Only six values are falsy. <b>Everything else is truthy</b>, including empty arrays and the string "0".'],
        code:'// falsy: false, 0, "", null, undefined, NaN\n\nconsole.log(Boolean([]));\nconsole.log(Boolean({}));\nconsole.log(Boolean("0"));\nconsole.log(Boolean(""));', out:'true\ntrue\ntrue\nfalse',
        note:'<b>An empty array is truthy.</b> <code>if (arr)</code> is true even when it is empty — check <code>arr.length</code> instead. This trips up people coming from Python, where empty containers are falsy.' },
      { h:'Ternary, && and ||',
        p:['A one-line if/else, plus two operators that return values rather than just booleans.'],
        code:'const age = 20;\nconsole.log(age >= 18 ? "adult" : "minor");\n\nconsole.log(0 || "fallback");\nconsole.log("" || "fallback");\nconsole.log(0 ?? "fallback");',
        out:'adult\nfallback\nfallback\n0',
        note:'<b><code>||</code> falls back on ANY falsy value, so a legitimate 0 gets replaced.</b> <code>??</code> only falls back on null/undefined — nearly always what you actually wanted.' },
      { h:'switch',
        p:['Cleaner than a long else-if chain when matching one value against many. <b>Do not forget <code>break</code></b> — without it execution falls through to the next case.'],
        code:'const cmd = "go";\nswitch (cmd) {\n  case "go":\n    console.log("moving");\n    break;\n  case "stop":\n    console.log("halted");\n    break;\n  default:\n    console.log("unknown");\n}', out:'moving' }
    ],
    encounters:[
      { t:'mcq', q:'What does this log?',
        code:'const x = 10;\nif (x > 5) {\n  console.log("big");\n} else if (x > 8) {\n  console.log("huge");\n} else {\n  console.log("small");\n}',
        opts:['big','huge','big then huge','small'], a:0,
        why:'The first matching branch wins; "huge" is never tested.' },
      { t:'mcq', q:'Is an empty array <code>[]</code> truthy or falsy in JavaScript?',
        opts:['Falsy, like in Python','Truthy','Depends','It errors'], a:1,
        why:'Only false, 0, "", null, undefined and NaN are falsy. Check arr.length to test for empty.' },
      { t:'mcq', q:'What does <code>0 || "fallback"</code> give?',
        opts:['0','"fallback"','true','undefined'], a:1,
        why:'|| falls back on any falsy value, including a legitimate 0. Use ?? when 0 is a valid value.' },
      { t:'mcq', q:'What does <code>0 ?? "fallback"</code> give?',
        opts:['0','"fallback"','true','null'], a:0,
        why:'?? only falls back on null or undefined, so 0 survives.' },
      { t:'mcq', q:'What is <code>!(true &amp;&amp; false)</code>?', opts:['true','false','undefined','Error'], a:0,
        why:'true && false is false; ! flips it.' },
      { t:'code', task:'<code>n</code> is already set. Log <code>positive</code>, <code>negative</code> or <code>zero</code>.',
        spec:'Write the whole if / else if / else yourself — the same code should work for any value of <code>n</code>.',
        starter:'const n = -3;\n\n// log "positive" if n is above 0\n// log "negative" if n is below 0\n// log "zero" if it is neither\n',
        harness:'', expected:'negative',
        hint:'if (n > 0) { ... } else if (n < 0) { ... } else { ... } — parentheses round the condition, braces round the block.',
        solution:'const n = -3;\n\nif (n > 0) {\n  console.log("positive");\n} else if (n < 0) {\n  console.log("negative");\n} else {\n  console.log("zero");\n}' },
      { t:'code', task:'Log <code>even</code> or <code>odd</code> for <code>n</code>.',
        starter:'const n = 7;\n\n// log "even" if n is even, otherwise "odd"\n',
        harness:'', expected:'odd',
        hint:'n % 2 is the remainder. if (n % 2 === 0) { ... } else { ... } — three equals signs, always.',
        solution:'const n = 7;\n\nif (n % 2 === 0) {\n  console.log("even");\n} else {\n  console.log("odd");\n}' },
      { t:'code', task:'Log the letter grade for <code>score</code>.',
        spec:'90+ is <b>A</b> · 80+ is <b>B</b> · 70+ is <b>C</b> · anything else is <b>F</b>. Order matters — put 70 first and everything above it becomes a C.',
        starter:'const score = 83;\n\n// log the letter grade\n',
        harness:'', expected:'B',
        hint:'Highest threshold first: if (score >= 90) ... else if (score >= 80) ... and so on down to else.',
        solution:'const score = 83;\n\nif (score >= 90) {\n  console.log("A");\n} else if (score >= 80) {\n  console.log("B");\n} else if (score >= 70) {\n  console.log("C");\n} else {\n  console.log("F");\n}' },
      { t:'code', task:'Use a <b>ternary</b> to log "big" when <code>n</code> is above 100, otherwise "small".',
        spec:'A ternary is a one-line if/else: <code>condition ? valueIfTrue : valueIfFalse</code>.',
        starter:'const n = 5;\n\n// use a ternary, not a full if/else\n',
        harness:'', expected:'small',
        hint:'console.log(n > 100 ? "big" : "small");',
        solution:'const n = 5;\n\nconsole.log(n > 100 ? "big" : "small");' }
    ]},

  { title:'Loops', mon:'Iteration Wyrm', emoji:'\u{1F41B}',
    taunt:'"Round and round. Forever, if you slip."',
    lesson:[
      { h:'The classic for loop',
        p:['Three parts separated by semicolons: where to start, how long to keep going, what to do each pass.'],
        code:'for (let i = 0; i < 3; i++) {\n  console.log(i);\n}', out:'0\n1\n2',
        note:'<code>i++</code> means i = i + 1. Indexes start at 0, so <code>i &lt; 3</code> runs three times ending at 2.' },
      { h:'for...of and for...in',
        p:['<b>of</b> gives you values, <b>in</b> gives you keys. Mixing them up is a common bug.'],
        code:'const arr = ["a", "b"];\nfor (const v of arr) console.log(v);\nfor (const k in arr) console.log(k);\n\nconst obj = { x: 1, y: 2 };\nfor (const k in obj) console.log(k, obj[k]);',
        out:'a\nb\n0\n1\nx 1\ny 2',
        note:'<b>for...in on an array gives you index strings</b>, not values — and it is generally discouraged for arrays. Use for...of, or .forEach().' },
      { h:'while and the accumulator pattern',
        p:['Set up before, update inside, use after — the same shape as every other language.'],
        code:'let total = 0;\nfor (const n of [1, 2, 3]) {\n  total += n;\n}\nconsole.log(total);\n\nlet lives = 3;\nwhile (lives > 0) {\n  lives--;\n}\nconsole.log(lives);', out:'6\n0' },
      { h:'break, continue, and labels',
        p:['<code>break</code> leaves the loop; <code>continue</code> skips to the next pass. A label lets you break out of nested loops at once.'],
        code:'outer:\nfor (let i = 0; i < 3; i++) {\n  for (let j = 0; j < 3; j++) {\n    if (j === 1) continue outer;\n    console.log(i, j);\n  }\n}', out:'0 0\n1 0\n2 0' }
    ],
    encounters:[
      { t:'mcq', q:'How many times does the body run?', code:'for (let i = 0; i < 3; i++) { }',
        opts:['2','3','4','Forever'], a:1, why:'i takes 0, 1, 2 and stops when i < 3 becomes false.' },
      { t:'mcq', q:'What does this log?', code:'let total = 0;\nfor (let i = 1; i <= 3; i++) {\n  total += i;\n}\nconsole.log(total);',
        opts:['3','6','10','0'], a:1, why:'1 + 2 + 3 = 6.' },
      { t:'mcq', q:'What does <code>for (const k in ["a","b"])</code> give you as k?',
        opts:['"a" then "b"','0 then 1 (as strings)','undefined','An error'], a:1,
        why:'for...in yields KEYS, which for an array are index strings. Use for...of for values.' },
      { t:'code', task:'Log the numbers from <code>n</code> down to 1, one per line.',
        spec:'Counting backwards means starting at n, continuing while it is above 0, and stepping <i>down</i> each time.',
        starter:'const n = 3;\n\n// log 3, then 2, then 1\n',
        harness:'', expected:'3\n2\n1',
        hint:'for (let i = n; i > 0; i--) { console.log(i); } — note i-- instead of i++.',
        solution:'const n = 3;\n\nfor (let i = n; i > 0; i--) {\n  console.log(i);\n}' },
      { t:'code', task:'<b>The accumulator pattern.</b> Add up every number in <code>nums</code>.',
        spec:'<code>total</code> is started at 0 for you. Add each number to it in the loop — the test logs it afterwards.',
        starter:'const nums = [1, 2, 3, 4];\nlet total = 0;\n\n// loop through nums, adding each to total\n',
        harness:'console.log(total);', expected:'10',
        hint:'for (const n of nums) { total += n; } — note total is declared with let, because it changes.',
        solution:'const nums = [1, 2, 3, 4];\nlet total = 0;\n\nfor (const n of nums) {\n  total += n;\n}' },
      { t:'code', task:'Log 1 to 6, but log <code>Fizz</code> instead for any multiple of 3.',
        starter:'// log 1, 2, Fizz, 4, 5, Fizz\n',
        harness:'', expected:'1\n2\nFizz\n4\n5\nFizz',
        hint:'Loop i from 1 to 6. Inside: if (i % 3 === 0) log "Fizz", else log i.',
        solution:'for (let i = 1; i <= 6; i++) {\n  if (i % 3 === 0) {\n    console.log("Fizz");\n  } else {\n    console.log(i);\n  }\n}' }
    ]},

  { title:'Functions', mon:'Undefined Revenant', emoji:'\u{1F573}',
    taunt:'"I return undefined. Always."',
    lesson:[
      { h:'return vs console.log',
        p:['<code>console.log</code> shows a value to you. <code>return</code> hands it back to the calling code so it can be stored. A function with no return gives <code>undefined</code>.'],
        code:'function addBad(a, b) { console.log(a + b); }\nfunction addGood(a, b) { return a + b; }\n\nconst x = addBad(2, 3);\nconsole.log(x);\nconsole.log(addGood(2, 3) * 10);', out:'5\nundefined\n50' },
      { h:'Three ways to write one',
        p:['They are near-interchangeable for now. The one real difference: declarations are <b>hoisted</b> — usable before the line that defines them — and the others are not.'],
        code:'function a(x) { return x * 2; }        // declaration\nconst b = function (x) { return x * 2; }; // expression\nconst c = (x) => x * 2;                   // arrow\n\nconsole.log(a(2), b(2), c(2));', out:'4 4 4',
        note:'<b>Arrow shorthand:</b> one expression and no braces means it returns automatically. <code>x => x * 2</code> returns; <code>x => { x * 2 }</code> returns undefined. That missing return catches everyone once.' },
      { h:'Defaults and rest parameters',
        p:[''],
        code:'function greet(name, greeting = "Hi") {\n  return `${greeting}, ${name}`;\n}\nconsole.log(greet("Sam"));\n\nfunction total(...nums) {\n  return nums.length;\n}\nconsole.log(total(1, 2, 3));', out:'Hi, Sam\n3',
        note:'Those backticks are a <b>template literal</b> — the JS equivalent of a Python f-string. <code>${ }</code> drops values in.' },
      { h:'Functions are values',
        p:['You can pass a function to another function, and return one. This is the foundation of everything on the array-methods floor.'],
        code:'function applyTwice(fn, x) {\n  return fn(fn(x));\n}\nconsole.log(applyTwice(n => n * 2, 5));', out:'20' }
    ],
    encounters:[
      { t:'mcq', q:'What does a function with no <code>return</code> give back?',
        opts:['0','null','undefined','It throws'], a:2, why:'JS returns undefined implicitly.' },
      { t:'mcq', q:'What does <code>const f = x => { x * 2 }; console.log(f(5));</code> log?',
        opts:['10','undefined','5','Error'], a:1,
        why:'Braces make it a normal function body, so you need an explicit return. Without braces the value is returned automatically.' },
      { t:'mcq', q:'What does this log?', code:'function greet(name, greeting = "Hi") {\n  return greeting + ", " + name;\n}\nconsole.log(greet("Sam"));',
        opts:['Hi, Sam','greeting, Sam','Sam','Error'], a:0, why:'The default fills in when the argument is omitted.' },
      { t:'code', task:'Write <code>maxOfThree(a, b, c)</code> returning the largest. No Math.max().',
        starter:'function maxOfThree(a, b, c) {\n  // your code here\n}\n',
        harness:'console.log(maxOfThree(1, 9, 4));\nconsole.log(maxOfThree(-5, -2, -9));\nconsole.log(maxOfThree(3, 3, 3));', expected:'9\n-2\n3',
        hint:'let biggest = a; then compare against b and c.',
        solution:'function maxOfThree(a, b, c) {\n  let biggest = a;\n  if (b > biggest) biggest = b;\n  if (c > biggest) biggest = c;\n  return biggest;\n}' },
      { t:'code', task:'Write <code>celsiusToF(c)</code> using c × 9 / 5 + 32.',
        starter:'function celsiusToF(c) {\n  // your code here\n}\n',
        harness:'console.log(celsiusToF(0));\nconsole.log(celsiusToF(100));\nconsole.log(celsiusToF(37));', expected:'32\n212\n98.6',
        hint:'return c * 9 / 5 + 32;', solution:'function celsiusToF(c) {\n  return c * 9 / 5 + 32;\n}' },
      { t:'code', task:'Write <code>describe(name, score)</code> returning <code>"Ada scored 88"</code> using a template literal.',
        starter:'function describe(name, score) {\n  // use backticks and ${ }\n}\n',
        harness:'console.log(describe("Ada", 88));', expected:'Ada scored 88',
        hint:'return `${name} scored ${score}`; — backticks, not quotes.',
        solution:'function describe(name, score) {\n  return `${name} scored ${score}`;\n}' }
    ]},

  { title:'Arrays', mon:'Off-By-One', emoji:'\u{1F41E}',
    taunt:'"Index three of three. Go on."',
    lesson:[
      { h:'Indexed from zero',
        p:['First item is index 0, last is <code>arr.length - 1</code>. Reading past the end gives <code>undefined</code> rather than an error — so the bug surfaces later, somewhere else.'],
        code:'const nums = [10, 20, 30];\nconsole.log(nums[0]);\nconsole.log(nums[nums.length - 1]);\nconsole.log(nums.at(-1));\nconsole.log(nums[5]);', out:'10\n30\n30\nundefined' },
      { h:'Adding and removing',
        p:[''],
        code:'const a = [1, 2];\na.push(3);      // add to end\na.unshift(0);   // add to start\nconsole.log(a);\nconsole.log(a.pop());     // remove from end\nconsole.log(a.shift());   // remove from start\nconsole.log(a);', out:'[0,1,2,3]\n3\n0\n[1,2]' },
      { h:'Copying vs referencing — the trap',
        p:['Arrays are objects, so assigning one copies the reference, not the contents.'],
        code:'const a = [1, 2];\nconst b = a;\nb.push(3);\nconsole.log(a);\n\nconst c = [...a];\nc.push(9);\nconsole.log(a);', out:'[1,2,3]\n[1,2,3]',
        note:'<code>[...a]</code> (spread) or <code>a.slice()</code> makes a real copy. Note it is a <b>shallow</b> copy — nested arrays inside are still shared.' },
      { h:'slice vs splice',
        p:['<code>slice</code> returns a piece and leaves the original alone. <code>splice</code> <b>modifies</b> the original. The names are almost identical and the behaviours are opposite.'],

        opts:['{hp:10, name:"T"}','{hp:5, name:"T"}','{hp:5}','An error'], a:1,
        why:'Spread copies everything, then the later hp key overrides. The standard immutable update.' },
      { t:'mcq', q:'What does <code>const [head, ...tail] = [1,2,3]</code> give tail?',
        opts:['1','[2,3]','3','[1,2,3]'], a:1, why:'Rest collects everything remaining into a new array.' },
      { t:'mcq', q:'Is spread a deep copy?',
        opts:['Yes, fully independent','No — nested objects are still shared','Only for arrays','Only for objects'], a:1,
        why:'It is shallow. One level down, references are shared, which produces confusing mutation bugs.' },
      { t:'code', task:'Write <code>fullName(user)</code> destructuring <code>first</code> and <code>last</code> in the parameter list.',
        starter:'function fullName({ }) {\n  // destructure in the signature\n}\n',
        harness:'console.log(fullName({ first: "Taj", last: "Chaplain" }));', expected:'Taj Chaplain',
        hint:'function fullName({ first, last }) { return `${first} ${last}`; }',
        solution:'function fullName({ first, last }) {\n  return `${first} ${last}`;\n}' },
      { t:'code', task:'Write <code>damage(state, amount)</code> returning a NEW state with hp reduced, leaving the original alone.',
        starter:'function damage(state, amount) {\n  // return a new object\n}\n',
        harness:'const s = { hp: 10, name: "Taj" };\nconsole.log(damage(s, 3));\nconsole.log(s.hp);',
        expected:'{"hp":7,"name":"Taj"}\n10',
        hint:'return { ...state, hp: state.hp - amount };',
        solution:'function damage(state, amount) {\n  return { ...state, hp: state.hp - amount };\n}' },
      { t:'code', task:'Write <code>sum(...nums)</code> accepting any number of arguments.',
        starter:'function sum() {\n  // use a rest parameter\n}\n',
        harness:'console.log(sum(1, 2, 3));\nconsole.log(sum());', expected:'6\n0',
        hint:'function sum(...nums) { return nums.reduce((a, n) => a + n, 0); }',

  { title:'Scope, Closures & this', mon:'The Context Thief', emoji:'\u{1F573}️',
    taunt:'"You know what this means. Are you certain?"',
    lesson:[
      { h:'Block scope',
        p:['<code>let</code> and <code>const</code> exist only inside the nearest <code>{ }</code>. <code>var</code> ignores blocks and leaks to the whole function — which is why nobody uses it any more.'],
        code:'function f() {\n  if (true) {\n    let a = 1;\n    var b = 2;\n  }\n  console.log(b);\n  console.log(a);\n}\nf();', out:'2\nReferenceError: a is not defined' },
      { h:'Closures: functions remember where they were born',
        p:['An inner function keeps access to the variables of the function that created it, even after that outer function has finished. This is not a curiosity — it is how you get private state.'],
        code:'function makeCounter() {\n  let count = 0;\n  return function () {\n    count++;\n    return count;\n  };\n}\n\nconst next = makeCounter();\nconsole.log(next());\nconsole.log(next());\n\nconst other = makeCounter();\nconsole.log(other());',
        out:'1\n2\n1',
        note:'<b>Each call to makeCounter creates a fresh, private count.</b> Nothing outside can touch it. Closures are behind every "make a configured function" pattern and every module in JS.' },
      { h:'The classic closure-in-a-loop bug',
        p:['This is a genuine interview question, and the fix is one keyword.'],
        code:'for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}\n// logs 3, 3, 3\n\nfor (let i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}\n// logs 0, 1, 2',
        note:'<b>var</b> has one shared binding for the whole loop, so by the time the timers run it is 3. <b>let</b> creates a fresh binding each iteration.' },
      { h:'this: decided by how a function is CALLED',
        p:['In most languages <code>this</code> is fixed. In JavaScript it depends on the call site, which is why it goes wrong so often.'],
        code:'const user = {\n  name: "Taj",\n  hello() { return `Hi ${this.name}`; }\n};\nconsole.log(user.hello());\n\nconst fn = user.hello;\nconsole.log(fn());',
        out:'Hi Taj\nHi undefined',
        note:'<b>Detach the method and this is lost.</b> That is why callbacks break: <code>setTimeout(user.hello, 0)</code> loses the object entirely.' },
      { h:'Arrow functions fix it',
        p:['Arrows have no <code>this</code> of their own — they use the one from where they were <i>written</i>. That is why callbacks are almost always arrows in modern code.'],
        code:'const timer = {\n  name: "clock",\n  start() {\n    setTimeout(() => console.log(this.name), 0);\n  }\n};\ntimer.start();', out:'clock',
        note:'<b>Rule of thumb:</b> arrow functions for callbacks, regular functions for object methods. That covers nearly every case you will hit.' }
    ],
    encounters:[
      { t:'mcq', q:'What is logged?', code:'function f() {\n  if (true) { let a = 1; }\n  console.log(a);\n}\nf();',
        opts:['1','undefined','ReferenceError','null'], a:2,
        why:'let is block-scoped, so a stops existing at the closing brace of the if. Had it been declared with var it would have leaked out to the whole function and logged 1 — which is exactly why var was retired.' },
      { t:'mcq', q:'What does the second call log?', code:'function makeCounter() {\n  let c = 0;\n  return () => ++c;\n}\nconst next = makeCounter();\nnext();\nconsole.log(next());',
        opts:['1','2','0','undefined'], a:1,
        why:'The closure keeps c alive between calls. That private, persistent variable is the whole point.' },
      { t:'mcq', q:'What does <code>for (var i=0;i<3;i++) setTimeout(()=>console.log(i),0)</code> log?',
        opts:['0 1 2','3 3 3','0 0 0','Nothing'], a:1,
        why:'var has one shared binding for the whole loop. Swap to let for a fresh binding each iteration.' },
      { t:'mcq', q:'Why does <code>const fn = user.hello; fn();</code> lose <code>this</code>?',
        opts:['hello was deleted','this depends on HOW a function is called, not where it was defined','const breaks it','It does not'], a:1,
        why:'Detached from the object, there is no receiver at the call site.' },
      { t:'mcq', q:'When should you use an arrow function?',
        opts:['Always','Never','For callbacks, so this comes from the surrounding scope','Only at the top level'], a:2,
        why:'Arrows inherit this lexically, which is exactly what a callback needs. Use regular functions for object methods.' },
      { t:'code', task:'Write <code>makeCounter()</code> returning a function that counts up from 1 each call.',
        starter:'function makeCounter() {\n  // use a closure\n}\n',
        harness:'const a = makeCounter();\nconsole.log(a());\nconsole.log(a());\nconst b = makeCounter();\nconsole.log(b());',
        expected:'1\n2\n1',
        hint:'let count = 0 inside, then return a function that increments and returns it.',
        solution:'function makeCounter() {\n  let count = 0;\n  return function () {\n    count++;\n    return count;\n  };\n}' },
      { t:'code', task:'Write <code>makeAdder(n)</code> returning a function that adds n to whatever it is given.',
        starter:'function makeAdder(n) {\n  // your code here\n}\n',
        harness:'const add5 = makeAdder(5);\nconsole.log(add5(10));\nconsole.log(makeAdder(2)(3));', expected:'15\n5',
        hint:'return x => x + n; — the returned function remembers n.',
        solution:'function makeAdder(n) {\n  return x => x + n;\n}' },
      { t:'code', task:'Write <code>makeBank(start)</code> returning an object with <code>deposit(n)</code> and <code>balance()</code>, where the balance is private.',
        starter:'function makeBank(start) {\n  // keep the total in a closure\n}\n',
        harness:'const acc = makeBank(100);\nacc.deposit(50);\nconsole.log(acc.balance());\nconsole.log(acc.total);',
        expected:'150\nundefined',
        hint:'let total = start; return { deposit(n) { total += n; }, balance() { return total; } };',
        solution:'function makeBank(start) {\n  let total = start;\n  return {\n    deposit(n) { total += n; },\n    balance() { return total; }\n  };\n}' }
    ]},

  { title:'Classes', mon:'The Prototype', emoji:'\u{1F9EC}',
    taunt:'"I am not a real class. I never was."',
    lesson:[
      { h:'Classes, JS-style',
        p:['<code>constructor</code> is the setup method. <code>this</code> is the object being built. Methods go straight in the body with no <code>function</code> keyword.'],
        code:'class Player {\n  constructor(name, hp) {\n    this.name = name;\n    this.hp = hp;\n  }\n\n  takeDamage(amount) {\n    this.hp -= amount;\n  }\n\n  isAlive() {\n    return this.hp > 0;\n  }\n}\n\nconst p = new Player("Taj", 10);\np.takeDamage(4);\nconsole.log(p.hp);\nconsole.log(p.isAlive());', out:'6\ntrue',
        note:'<b>Forget <code>new</code> and it throws.</b> "Class constructor cannot be invoked without new" is a common early error.' },
      { h:'It is syntax sugar over prototypes',
        p:['Under the hood JS has no classes — it has objects that delegate to other objects. <code>class</code> is a friendlier way to write the same thing, and interviewers like to check you know that.'],
        code:'class A { hi() { return "hi"; } }\nconsole.log(typeof A);\nconsole.log(Object.getPrototypeOf(new A()) === A.prototype);', out:'function\ntrue' },
      { h:'Inheritance with extends and super',
        p:['<code>super(...)</code> calls the parent constructor and must run before you touch <code>this</code>.'],
        code:'class Player {\n  constructor(name, hp) { this.name = name; this.hp = hp; }\n  takeDamage(n) { this.hp -= n; }\n}\n\nclass Boss extends Player {\n  constructor(name, hp) {\n    super(name, hp);\n    this.armour = 2;\n  }\n  takeDamage(n) {\n    super.takeDamage(Math.floor(n / this.armour));\n  }\n}\n\nconst b = new Boss("Recruiter", 20);\nb.takeDamage(8);\nconsole.log(b.hp);\nconsole.log(b.name);', out:'16\nRecruiter' },
      { h:'Getters, statics and private fields',
        p:['<code>get</code> makes a method read like a property. <code>static</code> belongs to the class rather than instances. <code>#</code> makes a field genuinely private.'],
        code:'class Player {\n  #secret = "hidden";\n  constructor(hp) { this.hp = hp; }\n\n  get status() { return this.hp > 0 ? "alive" : "dead"; }\n\n  static fromLevel(lvl) { return new Player(lvl * 10); }\n\n  reveal() { return this.#secret; }\n}\n\nconst p = Player.fromLevel(3);\nconsole.log(p.hp);\nconsole.log(p.status);\nconsole.log(p.reveal());', out:'30\nalive\nhidden' },
      { h:'When to use one',
        p:['Classes shine when you have many similar things with state and behaviour — enemies, UI components, model records. For a bag of pure functions operating on plain data, plain objects and functions are usually clearer.',
           'Modern React moved away from classes entirely for exactly this reason. Know them, do not reach for them reflexively.'] }
    ],
    encounters:[
      { t:'mcq', q:'What happens if you call a class without <code>new</code>?',
        opts:['It works','TypeError: cannot be invoked without new','It returns undefined','It returns the class'], a:1,
        why:'Class constructors require new — a common early error message.' },
      { t:'mcq', q:'What must <code>super(...)</code> be called before?',
        opts:['The closing brace','Any use of this in the constructor','Any method','Nothing'], a:1,
        why:'The parent constructor creates this. Touching it first throws a ReferenceError.' },
      { t:'mcq', q:'JavaScript classes are...',
        opts:['A completely separate system from objects','Syntax sugar over prototype-based inheritance','Compiled to C','The same as Java classes'], a:1,
        why:'typeof MyClass is "function". It is prototypes underneath — a favourite interview check.' },
      { t:'mcq', q:'What does <code>static</code> mean on a method?',
        opts:['It cannot change','It belongs to the class, not to instances','It is private','It runs once'], a:1,
        why:'Called as ClassName.method(), typically for factories and helpers.' },
      { t:'code', task:'Build a <code>Monster</code> class with <code>name</code>, <code>hp</code>, and <code>describe()</code> returning <code>"Bug (30 HP)"</code>.',
        starter:'class Monster {\n  constructor(name, hp) {\n  }\n\n  describe() {\n  }\n}\n',
        harness:'const m = new Monster("Bug", 30);\nconsole.log(m.describe());', expected:'Bug (30 HP)',
        hint:'this.name = name; this.hp = hp; then return `${this.name} (${this.hp} HP)`;',
        solution:'class Monster {\n  constructor(name, hp) {\n    this.name = name;\n    this.hp = hp;\n  }\n\n  describe() {\n    return `${this.name} (${this.hp} HP)`;\n  }\n}' },
      { t:'code', task:'Build a <code>Player</code> class with <code>takeDamage(n)</code> and a <code>status</code> getter returning "alive" or "dead".',
        starter:'class Player {\n  constructor(hp) {\n  }\n\n  takeDamage(n) {\n  }\n\n  get status() {\n  }\n}\n',
        harness:'const p = new Player(10);\np.takeDamage(4);\nconsole.log(p.hp);\nconsole.log(p.status);\np.takeDamage(10);\nconsole.log(p.status);',
        expected:'6\nalive\ndead',
        hint:'A getter is used without parentheses: p.status, not p.status().',
        solution:'class Player {\n  constructor(hp) {\n    this.hp = hp;\n  }\n\n  takeDamage(n) {\n    this.hp -= n;\n  }\n\n  get status() {\n    return this.hp > 0 ? "alive" : "dead";\n  }\n}' },
      { t:'code', task:'Add a <code>Boss</code> class extending Player that halves incoming damage (rounded down).',
        starter:'class Player {\n  constructor(hp) { this.hp = hp; }\n  takeDamage(n) { this.hp -= n; }\n}\n\nclass Boss extends Player {\n  // override takeDamage\n}\n',
        harness:'const b = new Boss(20);\nb.takeDamage(9);\nconsole.log(b.hp);', expected:'16',
        hint:'takeDamage(n) { super.takeDamage(Math.floor(n / 2)); } — 9 halves to 4.',
        solution:'class Player {\n  constructor(hp) { this.hp = hp; }\n  takeDamage(n) { this.hp -= n; }\n}\n\nclass Boss extends Player {\n  takeDamage(n) {\n    super.takeDamage(Math.floor(n / 2));\n  }\n}' }
    ]},

  { title:'Async JavaScript', mon:'The Race Condition', emoji:'\u{23F1}️',
    taunt:'"Your data will arrive. Eventually. Probably after you use it."',
    lesson:[
      { h:'Why async exists',
        p:['JavaScript runs on <b>one thread</b>. If it waited for a network request, the entire page would freeze — no clicks, no scrolling, nothing.',
           'So slow work is handed off, and your code gets told when it is done. Everything on this floor is a way of expressing "when it is done".'],
        code:'console.log("first");\nsetTimeout(() => console.log("third"), 0);\nconsole.log("second");', out:'first\nsecond\nthird',
        note:'<b>Even with a 0ms delay, the callback runs last.</b> It waits until the current code finishes — that is the event loop. This exact snippet is an interview staple.' },
      { h:'Promises',
        p:['A Promise is an object representing a value that is not here yet. It is <i>pending</i>, then either <i>fulfilled</i> or <i>rejected</i>.'],
        code:'const p = new Promise((resolve) => {\n  setTimeout(() => resolve("done"), 10);\n});\n\np.then(v => console.log(v));',
        note:'Before promises, everything was nested callbacks — the "callback hell" pyramid. Promises flattened it into a chain.' },
      { h:'async / await — how you will actually write it',
        p:['<code>await</code> pauses inside an <code>async</code> function until the promise settles. The code reads top to bottom like ordinary code, but does not block the page.'],
        code:'function wait(ms) {\n  return new Promise(r => setTimeout(r, ms));\n}\n\nasync function run() {\n  console.log("start");\n  await wait(10);\n  console.log("after waiting");\n}\nrun();', out:'start\nafter waiting',
        note:'<b><code>await</code> only works inside <code>async</code></b> (or at the top level of a module). Forgetting async is the most common error here.' },
      { h:'The number one async bug',
        p:['Forget <code>await</code> and you get the Promise object itself rather than the value. It does not throw — it just quietly gives you something useless.'],
        code:'async function getValue() { return 42; }\n\nasync function main() {\n  const wrong = getValue();\n  const right = await getValue();\n  console.log(typeof wrong);\n  console.log(right);\n}\nmain();', out:'object\n42',
        note:'<b>If you ever log <code>[object Promise]</code> or <code>Promise { &lt;pending&gt; }</code>, you forgot an await.</b> That one sentence will save you hours.' },
      { h:'Errors, and doing things in parallel',
        p:['<code>try/catch</code> works normally around await. And when requests do not depend on each other, <code>Promise.all</code> runs them at once instead of one after another.'],
        code:'async function main() {\n  try {\n    const res = await fetch("/api/data");\n    const data = await res.json();\n  } catch (err) {\n    console.log("failed:", err.message);\n  }\n\n  // slow: 3 seconds total\n  // const a = await getA(); const b = await getB(); const c = await getC();\n\n  // fast: as long as the slowest one\n  // const [a, b, c] = await Promise.all([getA(), getB(), getC()]);\n}',
        note:'<b>Sequential awaits in a loop is the classic performance mistake</b> in real code. If the calls are independent, Promise.all them.' }
    ],
    encounters:[
      { t:'mcq', q:'What order does this log?', code:'console.log("a");\nsetTimeout(() => console.log("b"), 0);\nconsole.log("c");',
        opts:['a b c','a c b','b a c','c a b'], a:1,
        why:'Even at 0ms the callback waits for the current code to finish. That is the event loop, and it is a classic interview question.' },
      { t:'mcq', q:'You log a value and see <code>Promise { &lt;pending&gt; }</code>. What went wrong?',
        opts:['The request failed','You forgot await','The function is broken','The server is down'], a:1,
        why:'You logged the promise instead of its value. Add await — and make sure the enclosing function is async.' },
      { t:'mcq', q:'Where can you use <code>await</code>?',
        opts:['Anywhere','Only inside an async function (or a module top level)','Only in loops','Only with fetch'], a:1,
        why:'Otherwise it is a syntax error. Forgetting async is the most common mistake here.' },
      { t:'mcq', q:'Three independent API calls. Which is faster?',
        opts:['Three sequential awaits','await Promise.all([a(), b(), c()])','A for loop with await','They are identical'], a:1,
        why:'Promise.all starts them all at once, so it takes as long as the slowest rather than the sum.' },
      { t:'mcq', q:'How do you handle an error from an awaited call?',
        opts:['if (err)','try / catch around the await','.error()','You cannot'], a:1,
        why:'await turns a rejection into a thrown error, so normal try/catch works.' },
      { t:'code', task:'Write <code>wait(ms)</code> returning a Promise that resolves after ms milliseconds.',
        starter:'function wait(ms) {\n  // return a Promise\n}\n',
        harness:'await wait(10);\nconsole.log("done");', expected:'done',
        hint:'return new Promise(resolve => setTimeout(resolve, ms));',
        solution:'function wait(ms) {\n  return new Promise(resolve => setTimeout(resolve, ms));\n}' },
      { t:'code', task:'Write an async <code>getScore()</code> that waits 10ms then returns 42.',
        starter:'function wait(ms) {\n  return new Promise(r => setTimeout(r, ms));\n}\n\nasync function getScore() {\n  // your code here\n}\n',
        harness:'const v = await getScore();\nconsole.log(v);', expected:'42',
        hint:'await wait(10); then return 42;',
        solution:'function wait(ms) {\n  return new Promise(r => setTimeout(r, ms));\n}\n\nasync function getScore() {\n  await wait(10);\n  return 42;\n}' },
      { t:'code', task:'Write <code>safeGet(fn)</code> awaiting fn() and returning "error" if it rejects.',
        starter:'async function safeGet(fn) {\n  // try / catch around the await\n}\n',
        harness:'console.log(await safeGet(async () => "ok"));\nconsole.log(await safeGet(async () => { throw new Error("boom"); }));',
        expected:'ok\nerror',
        hint:'try { return await fn(); } catch (e) { return "error"; }',
        solution:'async function safeGet(fn) {\n  try {\n    return await fn();\n  } catch (e) {\n    return "error";\n  }\n}' },
      { t:'code', task:'Write <code>bothAtOnce(a, b)</code> awaiting two promise-returning functions in parallel, returning their sum.',
        starter:'async function bothAtOnce(a, b) {\n  // use Promise.all\n}\n',
        harness:'const one = async () => 1;\nconst two = async () => 2;\nconsole.log(await bothAtOnce(one, two));', expected:'3',
        hint:'const [x, y] = await Promise.all([a(), b()]); return x + y;',
        solution:'async function bothAtOnce(a, b) {\n  const [x, y] = await Promise.all([a(), b()]);\n  return x + y;\n}' }
    ]},

  { title:'The DOM', mon:'Static Page', emoji:'\u{1F5A5}️',
    taunt:'"Nothing here moves. Nothing here ever will."',
    lesson:[
      { h:'The page as an object',
        p:['The browser parses your HTML into a tree of objects called the <b>DOM</b>. JavaScript reads and rewrites that tree, and the screen updates. That is all a frontend does.',
           '<b>The challenges on this floor run against a real, sandboxed document</b> — the same API you would use on a live page.'],
        code:'document.body.innerHTML = "<h1>Hello</h1>";\nconsole.log(document.body.innerHTML);', out:'<h1>Hello</h1>' },
      { h:'Finding elements',
        p:['<code>querySelector</code> takes any CSS selector and returns the first match, or <code>null</code>. <code>querySelectorAll</code> returns all of them.'],
        code:'document.body.innerHTML = \'<p class="msg">one</p><p class="msg">two</p>\';\n\nconsole.log(document.querySelector(".msg").textContent);\nconsole.log(document.querySelectorAll(".msg").length);\nconsole.log(document.querySelector("#nope"));',
        out:'one\n2\nnull',
        note:'<b>A null return is where "Cannot read properties of null" comes from</b> — you selected something that is not there, usually because the script ran before the element existed.' },
      { h:'Creating and inserting',
        p:['Build an element, set its content, attach it. <code>textContent</code> is safe; <code>innerHTML</code> parses HTML and will execute injected markup, so never feed it untrusted input.'],
        code:'document.body.innerHTML = "";\nconst div = document.createElement("div");\ndiv.textContent = "hello";\ndiv.className = "card";\ndocument.body.appendChild(div);\n\nconsole.log(document.body.innerHTML);', out:'<div class="card">hello</div>' },
      { h:'Changing things',
        p:[''],
        code:'document.body.innerHTML = \'<div id="box">old</div>\';\nconst box = document.querySelector("#box");\n\nbox.textContent = "new";\nbox.style.color = "red";\nbox.classList.add("active");\nbox.setAttribute("data-hp", "10");\n\nconsole.log(document.body.innerHTML);',
        out:'<div id="box" style="color: red;" class="active" data-hp="10">new</div>' },
      { h:'Events',
        p:['<code>addEventListener</code> runs your function when something happens. This is the entire interactivity model.'],
        code:'const btn = document.createElement("button");\nbtn.textContent = "Click";\nbtn.addEventListener("click", (event) => {\n  console.log("clicked");\n});\n\n// simulate it\nbtn.click();', out:'clicked',
        note:'<b>Event delegation:</b> for a list of 500 items, put ONE listener on the parent and check <code>event.target</code>, rather than 500 listeners. Standard practice, and a common interview question.' },
      { h:'The render pattern — this is how this game works',
        p:['Rather than surgically patching the page, keep your data in one place, and write a function that rebuilds the view from it. Change data, call render.'],
        code:'let state = { hp: 10, name: "Taj" };\n\nfunction render() {\n  document.body.innerHTML = `\n    <h1>${state.name}</h1>\n    <p>HP: ${state.hp}</p>`;\n}\n\nstate.hp -= 3;\nrender();\nconsole.log(document.body.querySelector("p").textContent);',
        out:'HP: 7',
        note:'<b>This is the core idea behind React</b>, minus the optimisations. State plus a render function. The capstone project builds exactly this.' }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>document.querySelector("#missing")</code> return when nothing matches?',
        opts:['undefined','null','An empty array','It throws'], a:1,
        why:'null — and then reading a property of it gives "Cannot read properties of null", one of the most common frontend errors.' },
      { t:'mcq', q:'Why prefer <code>textContent</code> over <code>innerHTML</code> for user-supplied text?',
        opts:['It is shorter','innerHTML parses HTML, so injected markup can execute (XSS)','textContent is faster to type','No difference'], a:1,
        why:'Putting untrusted input into innerHTML is a cross-site scripting hole. textContent treats it as plain text.' },
      { t:'mcq', q:'You have 500 list items needing click handlers. Best approach?',
        opts:['500 addEventListener calls','One listener on the parent, checking event.target','Inline onclick attributes','A loop with setInterval'], a:1,

      { t:'mcq', q:'In the state-plus-render pattern, what triggers the screen updating?',

  { title:'NULL and CASE', mon:'The Unknown', emoji:'\u{2753}',
    taunt:'"Am I equal to myself? Not even I know."',
    lesson:[
      { h:'NULL is not a value — it is "unknown"',
        p:['This is the single most misunderstood thing in SQL. NULL is not zero, not an empty string, not false. It means <i>we do not know what goes here</i>.',
           'And an unknown compared to anything is still unknown — so any comparison with NULL is neither true nor false.'],
        code:"SELECT NULL = NULL;      -- NULL, not true!\nSELECT NULL = 0;         -- NULL\nSELECT NULL <> 5;        -- NULL\n\nSELECT name FROM employees WHERE manager_id = NULL;   -- returns NOTHING\nSELECT name FROM employees WHERE manager_id IS NULL;  -- correct",
        note:'<b><code>= NULL</code> silently returns zero rows.</b> No error, no warning. You must use <code>IS NULL</code> and <code>IS NOT NULL</code>. This catches every beginner exactly once.' },
      { h:'NULL contaminates arithmetic',
        p:['Anything plus unknown is unknown. But aggregates <i>skip</i> NULLs rather than returning NULL — an inconsistency worth remembering.'],
        code:'SELECT 100 + NULL;                -- NULL\nSELECT SUM(bonus) FROM sales;     -- 1700, NULLs skipped\nSELECT AVG(bonus) FROM sales;     -- averages over 3 rows, not 5',

      { h:'COALESCE and NULLIF',
        p:['<code>COALESCE</code> returns the first non-NULL argument. <code>NULLIF(a, b)</code> gives NULL when a equals b — handy for avoiding divide-by-zero.'],
        code:'SELECT COALESCE(bonus, 0) FROM sales;\nSELECT COALESCE(NULL, NULL, \'fallback\');\nSELECT amount / NULLIF(bonus, 0) FROM sales;' },
      { h:'CASE: if/else inside a query',
        p:['<code>CASE</code> lets you produce a computed label per row. It works in SELECT, in ORDER BY, and even inside an aggregate.'],
        code:"SELECT name,\n       CASE\n         WHEN salary >= 100000 THEN 'senior'\n         WHEN salary >= 85000  THEN 'mid'\n         ELSE 'junior'\n       END AS band\nFROM employees;",
        note:'<b>The first matching WHEN wins</b> — same ordering rule as an if/elif chain. Without an ELSE, unmatched rows get NULL.' },
      { h:'The conditional-aggregate trick',
        p:['<code>SUM(CASE WHEN ... THEN 1 ELSE 0 END)</code> counts rows matching a condition <i>within</i> a group. This is a genuinely useful move that separates people who know SQL from people who have seen SQL.'],
        code:"SELECT dept,\n       COUNT(*) AS total,\n       SUM(CASE WHEN salary >= 100000 THEN 1 ELSE 0 END) AS seniors\nFROM employees\nGROUP BY dept;" }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>SELECT NULL = NULL</code> return?',
        opts:['true','false','NULL','An error'], a:2,
        why:'An unknown compared to an unknown is still unknown. Use IS NULL.' },
      { t:'mcq', q:'<code>WHERE manager_id = NULL</code> returns how many rows?',
        opts:['All rows with no manager','Zero rows','All rows','An error'], a:1,
        why:'The comparison is never true, so nothing matches. Silent and wrong — you need IS NULL.' },
      { t:'mcq', q:'<code>SUM(bonus)</code> where 2 of 5 rows are NULL:',
        opts:['Returns NULL','Skips the NULLs and sums the other 3','Treats NULLs as 0 and sums all 5','Errors'], a:1,
        why:'Aggregates ignore NULLs. But AVG then divides by 3, not 5 — which is often not what you meant.' },
      { t:'mcq', q:'What does <code>COALESCE(NULL, NULL, 5)</code> return?',
        opts:['NULL','0','5','An error'], a:2, why:'It returns the first non-NULL argument.' },
      { t:'sql', task:'Return the <code>name</code> of every employee who has no manager.',
        starter:'SELECT ', ordered:false, expected:[['Grace'],['Alan'],['Tim']],
        hint:'WHERE manager_id IS NULL — not = NULL.',
        solution:'SELECT name FROM employees WHERE manager_id IS NULL;' },
      { t:'sql', task:'Return the total bonus paid, counting a missing bonus as 0.',
        starter:'SELECT ', ordered:false, expected:[['1700']],
        hint:'SUM(COALESCE(bonus, 0))',
        solution:'SELECT SUM(COALESCE(bonus, 0)) FROM sales;' },
      { t:'sql', task:'Return <code>name</code> and a band: "senior" when salary is 100000 or more, otherwise "junior".',
        starter:'SELECT ', ordered:false,
        expected:[['Ada','senior'],['Grace','senior'],['Linus','junior'],['Marie','junior'],['Alan','junior'],['Katherine','junior'],['Tim','senior']],
        hint:"CASE WHEN salary >= 100000 THEN 'senior' ELSE 'junior' END",
        solution:"SELECT name, CASE WHEN salary >= 100000 THEN 'senior' ELSE 'junior' END FROM employees;" },
