<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debug Dungeon">
<title>Debug Dungeon — Learn to Code</title>
<style>
  :root{
    --bg:#080b11; --panel:#111823; --panel2:#18212f; --line:#26334a;
    --txt:#dde6f2; --dim:#8598b3; --acc:#4ade80; --acc2:#38bdf8;
    --warn:#fbbf24; --bad:#f87171; --gold:#fcd34d; --pur:#a78bfa;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(900px 500px at 50% -5%, #1b2b45aa, #0000),
      radial-gradient(700px 400px at 100% 100%, #14243aaa, #0000), var(--bg);
    color:var(--txt);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
  h1{font-size:20px;margin:0}
  h2{font-size:18px;margin:0 0 8px}
  h3{font-size:15px;margin:18px 0 4px;color:var(--acc2)}
  .sub{color:var(--dim);font-size:13.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:9px 15px;transition:.12s}
  button:hover:not(:disabled){border-color:var(--acc);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--acc);color:#07120a;border-color:var(--acc);font-weight:650}
  button.primary:hover{filter:brightness(1.12);color:#07120a}
  button.ghost{background:transparent}
  button.gold{border-color:var(--gold);color:var(--gold)}
  button.pur{border-color:var(--pur);color:var(--pur)}
  code{font-family:var(--mono);background:#0a0f18;padding:1px 5px;border-radius:5px;font-size:.92em;border:1px solid #1c2739}
  pre{font-family:var(--mono);background:#070b12;border:1px solid var(--line);border-radius:10px;
      padding:13px 14px;overflow:auto;margin:8px 0;font-size:13.5px;line-height:1.55}
  pre code{background:none;border:none;padding:0}
  .outlbl{font-size:11px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;margin-top:10px}
  pre.out{background:#0a1410;border-color:#1d3a2a;color:#b8f0cc}

  .hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#111823ee;border:1px solid var(--line);border-radius:14px;padding:10px 14px;
    position:sticky;top:8px;z-index:20;backdrop-filter:blur(8px);box-shadow:0 6px 24px #0006}
  .lvl{font-weight:700;color:var(--acc2);font-size:14px}
  .bar{height:9px;background:#060a10;border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:100px;flex:1;max-width:180px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s cubic-bezier(.2,.9,.3,1)}
  .hearts{letter-spacing:1px;font-size:14px}
  .chip{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
  .grow{flex:1}

  .arena{background:linear-gradient(180deg,#16233a,#101724);border:1px solid #2c3d5c;border-radius:14px;
    padding:18px;margin:12px 0;position:relative;overflow:hidden}
  .arena.hit{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  .mon{display:flex;align-items:center;gap:14px}
  .mon .face{font-size:46px;line-height:1;filter:drop-shadow(0 0 14px #4ade8055)}
  .mon .info{flex:1}
  .mon .nm{font-weight:650;font-size:16px}
  .hpbar{height:12px;background:#060a10;border-radius:99px;overflow:hidden;border:1px solid #3a2a2a;margin-top:6px}
  .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fbbf24);transition:width .6s cubic-bezier(.2,.9,.3,1)}
  .taunt{font-style:italic;color:#a9bcd6;font-size:13px;margin-top:8px}
  .dmg{position:absolute;right:26px;top:14px;font-weight:800;font-size:26px;color:var(--gold);
    text-shadow:0 2px 10px #000;animation:fly 1s forwards;pointer-events:none}
  @keyframes fly{0%{opacity:0;transform:translateY(10px) scale(.7)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
  .flashred{position:fixed;inset:0;background:#f8717155;pointer-events:none;z-index:99;animation:fade .45s forwards}
  @keyframes fade{to{opacity:0}}

  .zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
  .zone{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;transition:.14s;position:relative}
  .zone:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 10px 26px #0007}
  .zone.locked{opacity:.35;cursor:not-allowed;transform:none;border-color:var(--line)}
  .zone.locked:hover{border-color:var(--line);box-shadow:none;transform:none}
  .zone.done{border-color:#2c6b47;background:linear-gradient(180deg,#122419,#111823)}
  .zone.boss{border-color:#6b2c2c;background:linear-gradient(180deg,#241212,#111823)}
  .zone.boss.done{border-color:#2c6b47}
  .zone .n{font-size:10.5px;color:var(--dim);letter-spacing:1.6px;text-transform:uppercase}
  .zone .t{font-weight:640;margin:4px 0 8px;line-height:1.3}
  .zone .p{font-size:12px;color:var(--dim)}
  .zone .em{position:absolute;right:11px;top:10px;font-size:19px;opacity:.75}
  .actlbl{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin:22px 0 8px}

  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;line-height:1.45}
  .opt.correct{border-color:var(--acc);background:#0f2418}
  .opt.wrong{border-color:var(--bad);background:#2a1414}
  .opt.gone{opacity:.2;text-decoration:line-through}

  textarea{width:100%;min-height:180px;background:#070b12;color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:12px;font-family:var(--mono);font-size:13.5px;line-height:1.55;resize:vertical;tab-size:4}
  textarea:focus{outline:none;border-color:var(--acc2)}
  input.blank{background:#070b12;border:1px solid var(--acc2);color:var(--acc);border-radius:6px;
    padding:2px 6px;font-family:var(--mono);font-size:13.5px;width:120px}
  input.blank:focus{outline:none;box-shadow:0 0 0 2px #38bdf844}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:700px){.split{grid-template-columns:1fr}}
  .ok{color:var(--acc)} .no{color:var(--bad)} .wa{color:var(--warn)}
  .lang{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin-top:13px}
  .lang .card{cursor:pointer;margin:0}
  .lang .card:hover{border-color:var(--acc);transform:translateY(-3px)}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#0f2418;color:var(--acc);border:1px solid #1d4030}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#18212fee;
    border:1px solid var(--acc);padding:10px 20px;border-radius:99px;z-index:60;box-shadow:0 10px 34px #000a;animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translate(-50%,12px)}}
  .note{border-left:3px solid var(--warn);background:#1d180b;padding:10px 13px;border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px}
  .note b{color:var(--warn)}
  .keybox{border:1px solid var(--acc);background:linear-gradient(180deg,#0f2418,#0c1c13);
    border-radius:11px;padding:12px 15px;margin:10px 0 16px;font-size:14.5px;line-height:1.55}
  .keybox .lbl{font-size:10.5px;letter-spacing:2px;color:var(--acc);text-transform:uppercase;display:block;margin-bottom:5px}
  .keybox b{color:#fff}
  .dots{display:flex;gap:5px;margin:14px 0 0;flex-wrap:wrap}
  .dots i{width:20px;height:4px;border-radius:9px;background:#26334a}
  .dots i.on{background:var(--acc2)}
  .shopitem{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px;margin:9px 0}
  .shopitem .ic{font-size:26px}
  .shopitem .d{flex:1}
  .chk{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;margin:8px 0;cursor:pointer;transition:.12s;background:#0d1420}
  .chk:hover{border-color:var(--acc2)}
  .chk input{margin-top:3px;accent-color:var(--acc);width:17px;height:17px;flex:none;cursor:pointer}
  .chk.on{border-color:var(--acc);background:#0f2418}
  .chk .n{color:var(--acc2);font-weight:650;flex:none;font-family:var(--mono);font-size:13px;margin-top:1px}
  .chk div{flex:1}
  .cmds{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
  .cmds td{padding:6px 12px 6px 0;border-bottom:1px solid #1c2739;vertical-align:top}
  .cmds td:first-child{font-family:var(--mono);color:var(--acc);white-space:nowrap}
  .warn{border-left:3px solid var(--bad);background:#1d0e0e;padding:10px 13px;border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px}
  .warn b{color:var(--bad)}
  .gl{border-bottom:1px dotted var(--acc2);cursor:help;color:#c8dcf2}
  .gl:hover{border-bottom-style:solid;color:#fff}
  .glpop{position:fixed;z-index:120;max-width:340px;background:#18212f;border:1px solid var(--acc2);
    border-radius:11px;padding:12px 14px;box-shadow:0 12px 40px #000b;font-size:13.5px;line-height:1.55}
  .glpop b{color:var(--acc2);display:block;margin-bottom:4px;font-size:14px}
  .glpop .x{position:absolute;top:6px;right:10px;color:var(--dim);cursor:pointer;font-size:15px}
  .glitem{border-bottom:1px solid #1c2739;padding:9px 0}
  .glitem b{color:var(--acc2)}
  .primer .card{border-color:#2c4a6b}
  .ovl{position:fixed;inset:0;background:#050810f5;z-index:80;overflow:auto;padding:24px 16px}
  .ovl .inner{max-width:820px;margin:0 auto}
  .steps{margin:14px 0}
  .step{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:9px;border:1px solid transparent;cursor:pointer}
  .step:hover{background:#18212f}
  .step.cur{border-color:var(--acc2);background:#101c2b}
  .step.dn{color:var(--dim)}
  .step .mk{font-size:15px;width:20px;flex:none;text-align:center}
  .proj{border:1px solid var(--line);border-radius:13px;padding:15px;margin:11px 0;cursor:pointer;transition:.14s;position:relative;background:var(--panel)}
  .proj:hover{border-color:var(--pur);transform:translateY(-2px)}
  .proj.locked{opacity:.36;cursor:not-allowed;transform:none}
  .proj.locked:hover{border-color:var(--line);transform:none}
  .proj.capstone{border-color:#4c3a7a;background:linear-gradient(180deg,#1a1430,#111823)}
  details summary{cursor:pointer}
  a{color:var(--acc2)}
  .kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--dim)}

  /* ===================== SYMBOL TOOLBAR (phone code entry) ===================== */
  .symbar{display:none;gap:6px;overflow-x:auto;padding:8px 2px 4px;margin-top:8px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .symbar::-webkit-scrollbar{display:none}
  .symbar button{flex:none;min-width:42px;height:42px;padding:0 10px;font-family:var(--mono);
    font-size:16px;border-radius:9px;background:#1b2740;border-color:#2e4160;min-height:0}
  .symbar button:active{background:var(--acc2);color:#05121c}
  .symbar .wide{min-width:58px;font-size:13px}
  body.touch .symbar{display:flex}

  /* ===================== MOBILE ===================== */
  @media (max-width:760px){
    body{font-size:16px}
    .wrap{padding:10px 11px calc(90px + env(safe-area-inset-bottom))}
    h1{font-size:17px}
    h2{font-size:17px}
    .card{padding:14px;border-radius:12px;margin:10px 0}
    .arena{padding:14px}

    /* HUD: compact, wraps cleanly, does not eat the screen */
    .hud{gap:7px 9px;padding:8px 10px;border-radius:11px;top:4px}
    .hud .lvl{font-size:13px}
    .hud .sub{font-size:12px;min-width:0!important}
    .hud .bar{min-width:56px;max-width:90px;height:7px}
    .hud .chip{font-size:11px;padding:2px 7px}
    .hud .hearts{font-size:12px;letter-spacing:0}
    .hud button{padding:6px 10px;font-size:13px;min-height:34px}
    .hud .grow{flex-basis:100%;height:0}

    /* touch targets */
    button{padding:11px 14px;min-height:44px;font-size:15px}
    .row{gap:8px}
    .row button{flex:1 1 auto}
    .opt{padding:13px 14px;min-height:48px}

    /* code blocks: readable, scrollable, not cramped */
    pre{font-size:12.5px;padding:11px 12px;line-height:1.5;border-radius:9px;
        overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
    code{font-size:.88em;word-break:break-word}
    .cmds td{font-size:12.5px;padding:6px 8px 6px 0}
    .cmds{display:block;overflow-x:auto}

    /* editors: 16px stops iOS zooming in on focus */
    textarea{font-size:16px;min-height:200px;padding:11px;line-height:1.5}
    input.blank{font-size:16px;padding:6px 8px;min-height:36px}

    /* grids collapse */
    .zones{grid-template-columns:1fr;gap:9px}
    .lang{grid-template-columns:1fr;gap:10px}
    .split{grid-template-columns:1fr}

    /* checklists and steps get room */
    .chk{padding:13px 12px}
    .chk input{width:22px;height:22px}
    .step{padding:11px 10px}
    .shopitem{flex-wrap:wrap}
    .shopitem .d{flex:1 1 60%}

    /* glossary popover: full width sheet at the bottom */
    .glpop{left:8px!important;right:8px!important;max-width:none;width:auto;
      top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom));
      font-size:15px;padding:14px 16px}

    .note,.warn,.keybox{font-size:14.5px;padding:11px 12px}
    .dmg{font-size:22px;right:14px}
    .mon .face{font-size:38px}
    .ovl{padding:14px 10px}
  }

  /* very narrow phones */
  @media (max-width:420px){
    .hud .sub{display:none}
    .hud .bar{max-width:64px}
    button{font-size:14.5px;padding:10px 12px}
    pre{font-size:12px}
  }

  /* touch devices generally: no hover weirdness, no tap flash, no accidental zoom */
  @media (hover:none){
    button:hover:not(:disabled){border-color:var(--line);color:var(--txt)}
    button.primary:hover{color:#07120a}
    .zone:hover,.proj:hover{transform:none;box-shadow:none}
    .zone:active{border-color:var(--acc)}
    *{-webkit-tap-highlight-color:transparent}
    .gl{border-bottom-style:solid}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud" id="hud"></div>
  <div id="view"></div>
</div>
<div id="ovl"></div>
<script>
/* ==========================================================================
   DEBUG DUNGEON v3
   Python / R / JavaScript / SQL  —  real code, real engines, in your browser.
   Floors teach. The Workshop builds. The capstone rebuilds this game.
   ========================================================================== */

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function toast(m){ const t=el('div','toast',m); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ==========================================================================
   MOBILE: phone keyboards fight you when typing code. These stop that.
   ========================================================================== */
const IS_TOUCH = (window.matchMedia && matchMedia('(hover:none)').matches) || ('ontouchstart' in window);

/* autocapitalise turns  int  into  Int  and autocorrect "fixes" your variable
   names. Both must be off or code entry on a phone is unusable. */
function noAutoFix(node){
  node.spellcheck=false;
  node.setAttribute('autocapitalize','none');
  node.setAttribute('autocorrect','off');
  node.setAttribute('autocomplete','off');
  node.setAttribute('data-gramm','false');
  return node;
}

const SYMSETS={
  python:    ['TAB','(',')','[',']','{','}',':','"',"'",'=','==','_','#','.',',','+','-','*','/','%','<','>','!'],
  cpp:       ['TAB','(',')','{','}','[',']',';','<<','"',"'",'=','==','&','*','<','>','#',':','.',',','+','-','/','%'],
  javascript:['TAB','(',')','{','}','[',']',';','=>','"',"'",'`','=','===','.',',','+','-','*','/','%','<','>','!','&&'],
  r:         ['TAB','<-','(',')','[',']','{','}','$','"',"'",'=','==','~',',','.','+','-','*','/','%'],
  sql:       ['TAB','(',')',',',"'",'*','=','>','<','>=','<=','%','_',';','.'],
  career:    ['TAB','(',')','[',']','{','}',':','"',"'",'=','==','_','#','.',',','+','-','*','/','%','<','>','!']
};

function insertInto(ta, text){
  const s=ta.selectionStart, e=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  ta.selectionStart=ta.selectionEnd=s+text.length;
  ta.focus();
}

/* A scrollable strip of the characters phone keyboards bury three taps deep. */
function symbolBar(ta, lang){
  const bar=el('div','symbar');
  const indent=(lang==='cpp'||lang==='python'||lang==='career')?'    ':'  ';
  (SYMSETS[lang]||SYMSETS.python).forEach(sym=>{
    const isTab = sym==='TAB';
    const b=el('button', (isTab||sym.length>1)?'wide':'', isTab?'⇥ indent':esc(sym));
    b.type='button';
    b.addEventListener('mousedown',ev=>ev.preventDefault());   // do not steal focus
    b.addEventListener('touchstart',ev=>ev.preventDefault(),{passive:false});
    b.onclick=()=>insertInto(ta, isTab?indent:sym);
    bar.appendChild(b);
  });
  return bar;
}

/* one call to make any textarea a usable code editor on a phone */
function attachCodeBar(ta, lang, parent){
  noAutoFix(ta);
  parent.appendChild(symbolBar(ta, lang));
}

/* ---------- sound ---------- */
let AC=null;
function beep(f,d,type,vol){ if(!S.sfx) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=f; g.gain.value=vol||0.045;
    o.connect(g); g.connect(AC.destination); o.start();
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f*0.55), AC.currentTime+d);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+d);
    o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfx = {
  hit:()=>beep(700,.12), crit:()=>{beep(900,.09);setTimeout(()=>beep(1400,.16),80);},
  hurt:()=>beep(150,.28,'sawtooth',.06),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.05),i*95)),
  lvl:()=>[440,554,659,880,1109].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.05),i*110)),
  ship:()=>[392,523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.05),i*100)),
  coin:()=>beep(1300,.07,'square',.03), page:()=>beep(420,.05,'sine',.02),
  buy:()=>{beep(880,.08);setTimeout(()=>beep(1200,.1),80);}
};

/* ==========================================================================
   CONTENT  (filled in below)
   zone   = { title, mon, emoji, taunt, boss?, lesson:[pages], encounters:[...] }
   page   = { h, p:[html], code, out, note }
   enc    = mcq | fill | code | sql
   ========================================================================== */
const CONTENT = {};
const PROJECTS = {};
CONTENT.python = {
  name:'Python', indent:'    ',
  tag:'#1 most in-demand · best first language',
  tagline:'Ranked #1 on TIOBE by a record margin and the biggest single-year gain in the Stack Overflow survey. Cleanest syntax of the four, and almost every technical interview lets you use it.',
  zones:[

  { title:'Talking to the Machine', mon:'Silent Void', emoji:'\u{1F573}️',
    taunt:'"You cannot make me say anything."',
    lesson:[
      { h:'What code actually is',
        p:['A program is a list of instructions. Python reads them <b>top to bottom, one line at a time</b>, and does exactly what each says — nothing more, nothing less.',
           'That is the whole game. Most beginner confusion comes from expecting the computer to guess what you meant. It never does.'] },
      { h:'Your first instruction: print()',
        p:['<code>print()</code> displays something on the screen. Here is the anatomy:'],
        code:'print("Hello")', out:'Hello',
        note:'<b>Read it piece by piece:</b> <code>print</code> is the name of the tool. The <code>( )</code> say "run it". The thing inside — <code>"Hello"</code> — is what you are handing it. That handed-in thing is called an <b>argument</b>.' },
      { h:'Quotes make text',
        p:['Anything wrapped in quotes is a <b>string</b> — raw text Python does not try to understand.',

  { title:'Functions', mon:'Null Returner', emoji:'\u{1F573}',

  { title:'Writing It Like a Python Dev', mon:'Code Reviewer', emoji:'\u{1F9D0}',

  { title:'Recursion', mon:'The Mirror', emoji:'\u{1FA9E}',
    taunt:'"To defeat me, first defeat me."',
    lesson:[
      { h:'A function that calls itself',
        p:['Recursion is for problems that contain a smaller copy of themselves. Every recursive function needs exactly two things:',
           '<b>1. A base case</b> — the smallest version, answered directly with no further calls. <b>2. A recursive case</b> — do a bit of work, then call yourself on something <i>smaller</i>.'],
        code:'def count_down(n):\n    if n == 0:          # 1. base case: stop\n        return\n    print(n)            # 2. do the work\n    count_down(n - 1)   #    then a smaller version\n\ncount_down(3)', out:'3\n2\n1',
        note:'<b>Miss the base case and you get RecursionError</b> — the recursive equivalent of an infinite loop. It is always the first thing to check.' },
      { h:'Tracing one by hand',
        p:['Follow factorial(3). Each call waits on the one below it, then they resolve back upward:'],
        code:'def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\n# factorial(3)\n#   = 3 * factorial(2)\n#   = 3 * (2 * factorial(1))\n#   = 3 * (2 * 1)\n#   = 6\nprint(factorial(3))', out:'6',
        note:'<b>Trust the recursion.</b> The hardest habit is trying to trace every level in your head. Assume the inner call returns the right answer, and just handle your one step correctly.' },
      { h:'Where it earns its keep',
        p:['Anything tree-shaped or nested: folders inside folders, comment threads, JSON, menus, the DOM. A loop struggles because you do not know how deep it goes.'],
        code:'def total(items):\n    sum_so_far = 0\n    for item in items:\n        if isinstance(item, list):\n            sum_so_far += total(item)   # a nest inside a nest\n        else:\n            sum_so_far += item\n    return sum_so_far\n\nprint(total([1, [2, [3, 4]], 5]))', out:'15' },
      { h:'The honest tradeoff',
        p:['Recursion can be slower and can blow the stack (Python stops around 1000 deep). Naive Fibonacci recomputes the same values exponentially many times.',
           'Rule: use it when the <i>problem shape</i> is recursive. For plain counting, a loop is clearer and cheaper. Interviewers ask about it because it reveals whether you can reason about a process you cannot see all of at once.'] }
    ],
    encounters:[
      { t:'mcq', q:'What must every recursive function have to avoid running forever?',
        opts:['A loop','A base case that returns without recursing','A global variable','A try block'], a:1,
        why:'Without a base case the calls never stop and Python raises RecursionError.' },
      { t:'mcq', q:'What does <code>factorial(4)</code> return?', code:'def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)',
        opts:['4','10','24','12'], a:2, why:'4 × 3 × 2 × 1 = 24.' },
      { t:'mcq', q:'Which problem is most naturally recursive?',
        opts:['Summing a flat list of numbers','Printing 1 to 100','Walking folders inside folders inside folders','Checking if a number is even'], a:2,
        why:'Nested structures of unknown depth are exactly what recursion is for. The others are cleaner as loops.' },
      { t:'code', task:'Write <code>factorial(n)</code> recursively.',
        starter:'def factorial(n):\n    # base case, then recursive case\n    pass\n',
        harness:'print(factorial(5))\nprint(factorial(1))\nprint(factorial(0))', expected:'120\n1\n1',
        hint:'if n <= 1: return 1  — otherwise return n * factorial(n - 1)',
        solution:'def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)' },
      { t:'code', task:'Write <code>fib(n)</code> recursively, where fib(0)=0, fib(1)=1.',
        starter:'def fib(n):\n    # your code here\n    pass\n',
        harness:'print(fib(10))\nprint(fib(1))\nprint(fib(0))', expected:'55\n1\n0',
        hint:'Two base cases (n == 0 and n == 1), then return fib(n-1) + fib(n-2).',
        solution:'def fib(n):\n    if n == 0:\n        return 0\n    if n == 1:\n        return 1\n    return fib(n - 1) + fib(n - 2)' },
      { t:'code', task:'Write <code>deep_sum(items)</code> totalling a list that may contain lists inside it, any depth.',
        starter:'def deep_sum(items):\n    # your code here\n    pass\n',
        harness:'print(deep_sum([1, [2, [3, 4]], 5]))\nprint(deep_sum([]))', expected:'15\n0',
        hint:'Loop the items. If isinstance(item, list), add deep_sum(item); otherwise add the item.',
        solution:'def deep_sum(items):\n    total = 0\n    for item in items:\n        if isinstance(item, list):\n            total += deep_sum(item)\n        else:\n            total += item\n    return total' }
    ]},

        harness:'print(is_anagram("listen", "silent"))\nprint(is_anagram("cat", "dog"))\nprint(is_anagram("ab", "abb"))', expected:'True\nFalse\nFalse',
        hint:'sorted(a) == sorted(b) is the clean one-liner. Be ready to explain that it is O(n log n), and that a Counter comparison would be O(n).',

        harness:'print(most_frequent([1, 2, 2, 3, 2]))\nprint(most_frequent([7]))', expected:'2\n7',

      { t:'code', task:'Write <code>group_by_first_letter(words)</code> returning a dictionary of first letter → list of words.',
        starter:'def group_by_first_letter(words):\n    # your code here\n    pass\n',
        harness:'print(group_by_first_letter(["ant", "ape", "bee"]))\nprint(group_by_first_letter([]))',
        expected:"{'a': ['ant', 'ape'], 'b': ['bee']}\n{}",
        hint:'groups.setdefault(word[0], []).append(word)',
        solution:'def group_by_first_letter(words):\n    groups = {}\n    for word in words:\n        groups.setdefault(word[0], []).append(word)\n    return groups' },
      { t:'code', task:'Write <code>flatten(nested)</code> turning a list of lists into one flat list (one level deep).',
        starter:'def flatten(nested):\n    # your code here\n    pass\n',
        harness:'print(flatten([[1, 2], [3], []]))\nprint(flatten([]))', expected:'[1, 2, 3]\n[]',
        hint:'Nested loop, or the comprehension [x for inner in nested for x in inner].',
        solution:'def flatten(nested):\n    out = []\n    for inner in nested:\n        for x in inner:\n            out.append(x)\n    return out' },
      { t:'code', task:'<b>Final strike.</b> Write <code>running_total(nums)</code> returning the cumulative sums: [1,2,3] → [1,3,6].',
        starter:'def running_total(nums):\n    # your code here\n    pass\n',
        harness:'print(running_total([1, 2, 3]))\nprint(running_total([5]))\nprint(running_total([]))', expected:'[1, 3, 6]\n[5]\n[]',
        hint:'The accumulator pattern from floor 6, but append the total each pass instead of only at the end.',
        solution:'def running_total(nums):\n    out = []\n    total = 0\n    for n in nums:\n        total += n\n        out.append(total)\n    return out' }
    ]}

        code:'print("Hello")\ncat("Hello\\n")\ncat("Score:", 42, "\\n")', out:'[1] "Hello"\nHello\nScore: 42' },
      { h:'Getting help, which you will do constantly',
        p:['R\'s built-in help is unusually good, and using it is normal professional behaviour, not cheating.'],
        code:'?mean          # open the help page\nhelp(mean)     # the same thing\nexample(mean)  # run its examples\nls()           # what variables exist right now',
        note:'In this game, <code>#</code> starts a comment — same as Python. R has no multi-line comment syntax; people just use several #.' }
    ],
    encounters:[
      { t:'fill', q:'Use the conventional R assignment operator to store 42 in x.',
        code:'x ___ 42', answers:['<-'], why:'The arrow is R\'s standard assignment. = works but breaks convention.' },
      { t:'mcq', q:'What does <code>print(1:3)</code> show?',
        opts:['1 2 3','[1] 1 2 3','[1] [2] [3]','c(1,2,3)'], a:1,
        why:'The [1] is the index of the first element on that line. Every R result carries one.' },
      { t:'mcq', q:'What does <code>print("hi")</code> show?',
        opts:['hi','[1] hi','[1] "hi"','"hi"'], a:2,
        why:'print shows the R representation, so text keeps its quotes. Use cat("hi\\n") for clean output.' },
      { t:'mcq', q:'What does <code>7 %% 2</code> give?', opts:['3.5','3','1','14'], a:2,
        why:'%% is the remainder (modulo). %/% would give 3, the integer division.' },
      { t:'code', task:'Store the number 42 in a variable called <code>x</code>.',
        starter:'# use the arrow\nx <- \n', harness:'print(x)', expected:'[1] 42',
        hint:'x <- 42', solution:'x <- 42' },
      { t:'code', task:'Print <code>Hello, world!</code> with no quotes and no index marker.',
        starter:'# use cat, and remember the newline\n', harness:'', expected:'Hello, world!',
        hint:'cat("Hello, world!\\n") — the \\n is what ends the line.',
        solution:'cat("Hello, world!\\n")' },
      { t:'code', task:'Store 10 in <code>a</code> and 4 in <code>b</code>, then print their product.',
        starter:'a <- \nb <- \n', harness:'print(a * b)', expected:'[1] 40',
        hint:'a <- 10 then b <- 4.', solution:'a <- 10\nb <- 4' }
    ]},

  { title:'Vectors: the Heart of R', mon:'Recycler', emoji:'\u{267B}️',
    taunt:'"Your lengths do not match? I will improvise."',
    lesson:[
      { h:'Everything is a vector',
        p:['A vector is an ordered set of values <b>of the same type</b>. Build one with <code>c()</code> — for "combine". This is the single most important function in R.'],
        code:'scores <- c(88, 92, 79, 95)\nprint(scores)\nprint(length(scores))\n\nprint(1:5)\nprint(seq(0, 10, by = 5))\nprint(rep("a", 3))',
        out:'[1] 88 92 79 95\n[1] 4\n[1] 1 2 3 4 5\n[1]  0  5 10\n[1] "a" "a" "a"',
        note:'<b>Notice the extra space</b> in <code>[1]  0  5 10</code>. R pads numbers so columns line up — it is right-aligning to the width of the widest one.' },
      { h:'Operations apply to the WHOLE vector',
        p:['This is the big idea, and where R differs from Python or JavaScript most sharply. You almost never write a loop to transform data.'],
        code:'scores <- c(80, 90, 100)\n\nprint(scores + 5)\nprint(scores * 2)\nprint(scores > 85)\nprint(mean(scores))',
        out:'[1]  85  95 105\n[1] 160 180 200\n[1] FALSE  TRUE  TRUE\n[1] 90',
        note:'<b>In Python you would loop.</b> In R, looping over a vector to do arithmetic is a beginner smell. Vectorised operations are shorter, faster, and what your marker expects.' },
      { h:'Indexing starts at 1',
        p:['<b>Unlike almost every other language, R counts from 1.</b> If you are also learning Python, this is the number one source of cross-wiring.'],
        code:'v <- c(10, 20, 30)\nprint(v[1])\nprint(v[3])\nprint(v[c(1, 3)])\nprint(v[-1])',
        out:'[1] 10\n[1] 30\n[1] 10 30\n[1] 20 30',
        note:'<b>A negative index does not count from the end</b> — it <i>removes</i> that element. <code>v[-1]</code> means "everything except the first". Use <code>tail(v, 1)</code> for the last one.' },
      { h:'Logical indexing — the workhorse',
        p:['Put a TRUE/FALSE vector in the brackets and you keep only the TRUE positions. Almost all filtering in R is this one move.'],
        code:'scores <- c(88, 92, 79, 95)\n\nprint(scores > 85)\nprint(scores[scores > 85])\nprint(sum(scores > 85))',
        out:'[1]  TRUE  TRUE FALSE  TRUE\n[1] 88 92 95\n[1] 3',
        note:'<code>sum()</code> on a logical vector counts the TRUEs, because TRUE is 1 and FALSE is 0. That trick appears everywhere in real R code.' },
      { h:'Recycling: the floor\'s monster',
        p:['When two vectors are different lengths, R silently repeats the shorter one to match. Sometimes that is exactly what you wanted. Sometimes it quietly corrupts your analysis.'],
        code:'print(c(1, 2, 3, 4) + c(10, 20))\nprint(c(1, 2, 3) + c(10, 20))',
        out:'[1] 11 22 13 24\nWarning: longer object length is not a multiple of shorter object length\n[1] 11 22 13',
        note:'<b>You only get a warning when it does not divide evenly.</b> The first line ran silently. If your numbers ever look inexplicable, check your vector lengths first.' },
      { h:'Naming elements',
        p:['Vectors can carry names, which makes output far more readable.'],
        code:'ages <- c(sam = 30, ava = 25)\nprint(ages["sam"])\nprint(names(ages))', out:'sam \n 30 \n[1] "sam" "ava"' }
    ],
    encounters:[
      { t:'fill', q:'Combine three numbers into one vector.',
        code:'scores <- ___(88, 92, 79)', answers:['c'], why:'c() combines values into a vector. It is the most-used function in R.' },
      { t:'mcq', q:'What does this print?', code:'v <- c(10, 20, 30)\nprint(v[1])',
        opts:['[1] 20','[1] 10','[1] 30','Error'], a:1,
        why:'R indexes from 1, not 0. v[1] is the FIRST element — the opposite of Python.' },
      { t:'mcq', q:'What does <code>v[-1]</code> give for <code>v <- c(10, 20, 30)</code>?',
        opts:['[1] 30','[1] 10','[1] 20 30','Error'], a:2,
        why:'A negative index REMOVES that position in R. It does not count from the end.' },
      { t:'mcq', q:'What does this print?', code:'print(c(10, 20, 30) * 2)',
        opts:['[1] 60','[1] 10 20 30 10 20 30','[1] 20 40 60','Error'], a:2,
        why:'Operations are vectorised — applied to every element at once. No loop needed.' },
      { t:'mcq', q:'What does <code>sum(c(88, 92, 79) > 85)</code> give?',
        opts:['[1] 180','[1] 2','[1] TRUE','[1] 3'], a:1,
        why:'The comparison gives TRUE TRUE FALSE; sum counts the TRUEs as 1s. Two scores are above 85.' },
      { t:'mcq', q:'What happens with <code>c(1, 2, 3, 4) + c(10, 20)</code>?',
        opts:['Error','The short vector is recycled: 11 22 13 24','It gives 11 22','It gives NA'], a:1,
        why:'R silently recycles the shorter vector. No warning here because 4 divides evenly by 2 — which is exactly what makes it dangerous.' },
      { t:'code', task:'Create <code>scores</code> holding 80, 90 and 100, then nothing else.',
        starter:'scores <- \n', harness:'print(mean(scores))', expected:'[1] 90',
        hint:'scores <- c(80, 90, 100)', solution:'scores <- c(80, 90, 100)' },
      { t:'code', task:'Print every element of <code>v</code> doubled — with no loop.',
        spec:'This is the whole point of R. One operation, applied to the entire vector at once.',
        starter:'v <- c(1, 2, 3)\n\n# print every element doubled\n',
        harness:'', expected:'[1] 2 4 6',
        hint:'print(v * 2) — that is genuinely all of it. R does the rest.',
        solution:'v <- c(1, 2, 3)\n\nprint(v * 2)' },
      { t:'code', task:'Print only the scores above 85.',
        spec:'Put a condition inside the square brackets and R keeps only the positions where it is TRUE.',
        starter:'scores <- c(88, 92, 79, 95)\n\n# print only the scores above 85\n',
        harness:'', expected:'[1] 88 92 95',
        hint:'print(scores[scores > 85]) — read it as "scores, where scores is greater than 85".',
        solution:'scores <- c(88, 92, 79, 95)\n\nprint(scores[scores > 85])' }
    ]},

  { title:'Types & Coercion', mon:'The Flattener', emoji:'\u{1F9F2}',
    taunt:'"One type per vector. I do not negotiate."',
    lesson:[
      { h:'The four types you meet in a stats class',
        p:['<code>class()</code> tells you what you are holding. Getting this wrong is behind a huge share of "why is my analysis broken" moments.'],
        code:'print(class(5))\nprint(class(5L))\nprint(class("hi"))\nprint(class(TRUE))',
        out:'[1] "numeric"\n[1] "integer"\n[1] "character"\n[1] "logical"',
        note:'Plain <code>5</code> is numeric (a decimal), not integer. The <code>L</code> suffix forces an integer. In practice you rarely need to care, but <code>class()</code> tells you the truth when something misbehaves.' },
      { h:'A vector holds ONE type — so R flattens',
        p:['Mix types in <code>c()</code> and R silently converts everything to the most accommodating type. No error. This is the monster.'],
        code:'print(c(1, 2, 3))\nprint(c(1, 2, "three"))\nprint(c(1, TRUE, FALSE))',
        out:'[1] 1 2 3\n[1] "1"     "2"     "three"\n[1] 1 1 0',
        note:'<b>The hierarchy is: logical → numeric → character.</b> One stray piece of text in a column of numbers turns the whole column into text, and then <code>mean()</code> fails with a confusing message. This is the single most common data-import bug in R.' },
      { h:'Converting on purpose',
        p:[''],
        code:'print(as.numeric("42") + 8)\nprint(as.character(42))\nprint(as.numeric(TRUE))\nprint(as.numeric("abc"))',
        out:'[1] 50\n[1] "42"\n[1] 1\nWarning: NAs introduced by coercion\n[1] NA',
        note:'A failed conversion gives <b>NA</b>, not an error. Your script keeps running with a hole in the data — always check with <code>sum(is.na(x))</code> after importing.' },
      { h:'NA, NULL, NaN and Inf',
        p:['Four different kinds of nothing, and stats work touches all of them.'],
        code:'print(NA)          # missing value - "we do not know"\nprint(NULL)        # nothing at all - no value exists\nprint(0 / 0)       # NaN - not a number\nprint(1 / 0)       # Inf\n\nprint(is.na(c(1, NA, 3)))\nprint(sum(is.na(c(1, NA, 3))))',
        out:'[1] NA\nNULL\n[1] NaN\n[1] Inf\n[1] FALSE  TRUE FALSE\n[1] 1',
        note:'<b>Never test with <code>x == NA</code></b> — it returns NA, not TRUE. Always use <code>is.na(x)</code>.' },
      { h:'Checking types',
        p:[''],
        code:'x <- c(1, 2, 3)\nprint(is.numeric(x))\nprint(is.character(x))\nprint(str(x))', out:'[1] TRUE\n[1] FALSE\n num [1:3] 1 2 3\nNULL',
        note:'<code>str()</code> — "structure" — is the function you will use most for inspecting anything. It prints a compact summary and returns NULL, which is why NULL appears when you wrap it in print().' }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>class(5)</code> return in R?',
        opts:['"integer"','"numeric"','"double"','"number"'], a:1,
        why:'Plain numbers are numeric. You would need 5L to get an integer.' },
      { t:'mcq', q:'What does <code>c(1, 2, "three")</code> produce?',
        opts:['An error','A vector of 1, 2 and "three" with mixed types','A character vector: "1" "2" "three"','A list'], a:2,
        why:'A vector holds one type, so R coerces everything up to character. Silently. This breaks mean() later with a confusing message.' },
      { t:'mcq', q:'What does <code>as.numeric("abc")</code> give?',
        opts:['0','An error','NA plus a warning','"abc"'], a:2,
        why:'Failed conversion produces NA and a warning — your script keeps running with missing data.' },
      { t:'mcq', q:'How do you test whether a value is missing?',
        opts:['x == NA','is.na(x)','x = NA','missing(x)'], a:1,
        why:'x == NA returns NA, not TRUE — comparing to an unknown gives an unknown. is.na() is the only correct test.' },
      { t:'fill', q:'Convert the text "42" into a number.',
        code:'n <- ___("42")', answers:['as.numeric','as.integer'],
        why:'as.numeric() converts text to a number, giving NA if it cannot.' },
      { t:'code', task:'<code>s</code> is text. Convert it to a number, add 8, and print the result.',
        spec:'Adding 8 to the text "42" directly is an error. You have to convert first.',
        starter:'s <- "42"\n\n# convert s to a number, add 8, print it\n',
        harness:'', expected:'[1] 50',
        hint:'print(as.numeric(s) + 8)',
        solution:'s <- "42"\n\nprint(as.numeric(s) + 8)' },
      { t:'code', task:'Print how many values in <code>v</code> are missing.',
        spec:'Remember: you can never test for NA with <code>==</code>. And summing TRUE/FALSE counts the TRUEs, because TRUE is 1.',
        starter:'v <- c(1, NA, 3, NA)\n\n# print how many values are NA\n',
        harness:'', expected:'[1] 2',
        hint:'print(sum(is.na(v))) — is.na(v) gives FALSE TRUE FALSE TRUE, and sum adds them up.',
        solution:'v <- c(1, NA, 3, NA)\n\nprint(sum(is.na(v)))' }
    ]},

  { title:'Factors: Categorical Data', mon:'Level Shifter', emoji:'\u{1F3F7}️',
    taunt:'"Your categories look like text. They are not."',
    lesson:[
      { h:'Why factors exist',
        p:['Statistics distinguishes between text that is <i>a label</i> and text that is <i>a category with a fixed set of possible values</i>. "Taj Chaplain" is a label. "Freshman / Sophomore / Junior / Senior" is a category.',
           'A <b>factor</b> is R\'s type for categorical data. Models, plots and tables all treat factors differently from plain text — which is exactly what you want in a stats class.'],
        code:'year <- factor(c("Fresh", "Senior", "Fresh", "Junior"))\nprint(year)\nprint(levels(year))\nprint(nlevels(year))',
        out:'[1] Fresh  Senior Fresh  Junior\nLevels: Fresh Junior Senior\n[1] "Fresh"  "Junior" "Senior"\n[1] 3',
        note:'<b>No quotes in the printed values, and a Levels line at the bottom.</b> That is how you spot a factor in output. Levels come out alphabetical by default, which is often not the order you want.' },
      { h:'Under the hood it is numbers',
        p:['R stores a factor as integer codes plus a lookup table of levels. That is why it is efficient, and why one specific mistake is so nasty.'],
        code:'f <- factor(c("10", "20", "30"))\nprint(as.numeric(f))\nprint(as.numeric(as.character(f)))',
        out:'[1] 1 2 3\n[1] 10 20 30',
        note:'<b>This is the classic R trap.</b> <code>as.numeric()</code> on a factor gives you the internal <i>codes</i>, not your values. Always go through <code>as.character()</code> first. People have published wrong results because of this.' },
      { h:'Ordering levels deliberately',
        p:['For anything with a natural order — sizes, grades, years, Likert scales — set the order yourself, or every table and plot comes out alphabetical.'],
        code:'size <- factor(c("small", "large", "medium"),\n               levels = c("small", "medium", "large"))\nprint(size)\nprint(as.numeric(size))',
        out:'[1] small  large  medium\nLevels: small medium large\n[1] 1 3 2' },
      { h:'Ordered factors',
        p:['Add <code>ordered = TRUE</code> and comparisons start working, which matters for ordinal data.'],
        code:'size <- factor(c("small", "large"),\n               levels = c("small", "medium", "large"),\n               ordered = TRUE)\nprint(size[1] < size[2])', out:'[1] TRUE' },
      { h:'Counting categories',
        p:['<code>table()</code> on a factor gives you the frequency of each level — including levels with zero observations, which plain text would silently drop.'],
        code:'year <- factor(c("Fresh", "Senior", "Fresh"))\nprint(table(year))', out:'year\n Fresh Senior \n     2      1 ' }
    ],
    encounters:[
      { t:'mcq', q:'What are <code>levels()</code> of a factor?',
        opts:['The number of observations','The distinct categories it can take','The row numbers','The numeric values'], a:1,
        why:'Levels are the complete set of possible categories, in a defined order.' },
      { t:'mcq', q:'What does <code>as.numeric(factor(c("10","20","30")))</code> give?',
        opts:['[1] 10 20 30','[1] 1 2 3','An error','[1] NA NA NA'], a:1,
        why:'You get the internal level CODES, not your values. Go through as.character() first — this trap has produced published errors.' },
      { t:'mcq', q:'Why set <code>levels =</code> explicitly for sizes small/medium/large?',
        opts:['It is required','Otherwise R orders them alphabetically: large, medium, small','It makes it faster','It converts to numbers'], a:1,
        why:'Default level order is alphabetical, so every table and plot comes out in a nonsense order.' },
      { t:'fill', q:'Turn a character vector into categorical data.',
        code:'year <- ___(c("Fresh", "Senior"))', answers:['factor','as.factor'],
        why:'factor() creates categorical data with a fixed set of levels.' },
      { t:'code', task:'Print how many <b>distinct categories</b> are in <code>v</code>.',
        starter:'v <- c("low", "high", "low")\n\n# print the number of distinct categories\n',
        harness:'', expected:'[1] 2',
        hint:'Turn it into a factor first, then count the levels: print(nlevels(factor(v)))',
        solution:'v <- c("low", "high", "low")\n\nprint(nlevels(factor(v)))' },
      { t:'code', task:'<b>Avoid the trap.</b> <code>f</code> is a factor of number-text. Print the real numbers, not the level codes.',
        spec:'<code>as.numeric(f)</code> on its own gives you 1 2 3 — the internal codes. This is the mistake that has produced published errors.',
        starter:'f <- factor(c("10", "20", "30"))\n\n# print 10 20 30, not 1 2 3\n',
        harness:'', expected:'[1] 10 20 30',
        hint:'print(as.numeric(as.character(f))) — the as.character step is the whole fix.',
        solution:'f <- factor(c("10", "20", "30"))\n\nprint(as.numeric(as.character(f)))' },
      { t:'code', task:'Make <code>v</code> a factor whose levels are ordered small, medium, large — then print the levels.',
        spec:'Left alone, R sorts levels alphabetically: large, medium, small. You have to state the order you want.',
        starter:'v <- c("large", "small")\n\n# build the factor with the levels in the right order,\n# then print its levels\n',
        harness:'', expected:'[1] "small"  "medium" "large" ',
        hint:'size <- factor(v, levels = c("small", "medium", "large")) then print(levels(size)). R pads the printed strings to equal width, which is why there are extra spaces.',
        solution:'v <- c("large", "small")\n\nsize <- factor(v, levels = c("small", "medium", "large"))\nprint(levels(size))' }
    ]},

  { title:'Data Frames', mon:'Ragged Table', emoji:'\u{1F5C3}️',
    taunt:'"Three names. Two scores. Good luck."',
    lesson:[
      { h:'The spreadsheet, as a variable',
        p:['A data frame is R\'s table: rows are observations, columns are variables. Every column is a vector, and every column must be the <b>same length</b>.',
           'This is the object you will spend a statistics class living inside.'],
        code:'students <- data.frame(\n  name = c("Ada", "Taj", "Grace"),\n  score = c(88, 92, 79),\n  year = c("Fresh", "Senior", "Fresh")\n)\nprint(students)',
        out:'   name score   year\n1   Ada    88  Fresh\n2   Taj    92 Senior\n3 Grace    79  Fresh',
        note:'The leftmost column with 1, 2, 3 is not data — those are <b>row names</b>, printed automatically.' },
      { h:'Inspecting one — do this before anything else',
        p:['Four functions, used constantly, in this order:'],
        code:'print(nrow(students))\nprint(ncol(students))\nprint(names(students))\nprint(head(students, 2))',
        out:'[1] 3\n[1] 3\n[1] "name"  "score" "year" \n  name score   year\n1  Ada    88  Fresh\n2  Taj    92 Senior',
        note:'<code>str(students)</code> and <code>summary(students)</code> are the other two. Run <code>str()</code> on every dataset you are handed — it tells you the type of every column, which is where the bugs hide.' },
      { h:'$ pulls out a column as a vector',
        p:['Once you have the column, everything you learned about vectors applies.'],
        code:'print(students$score)\nprint(mean(students$score))\nprint(students$score > 85)',
        out:'[1] 88 92 79\n[1] 86.33333\n[1]  TRUE  TRUE FALSE' },
      { h:'Adding and changing columns',
        p:['Assign to a column that does not exist and it is created. Vectorised operations make this a one-liner.'],
        code:'students$passed <- students$score >= 85\nstudents$curved <- students$score + 5\nprint(names(students))\nprint(students$curved)',
        out:'[1] "name"   "score"  "year"   "passed" "curved"\n[1] 93 97 84' },
      { h:'stringsAsFactors, and reading real data',
        p:['Modern R (4.0+) keeps text as character by default. Older code and older tutorials assume it became a factor automatically — if you find a tutorial fighting with <code>stringsAsFactors</code>, it predates 2020.'],
        code:'# reading a real file in your stats class:\ndf <- read.csv("data.csv")\nstr(df)               # ALWAYS do this first\nsummary(df)           # then this\ncolSums(is.na(df))    # how much is missing, per column',
        note:'Those three lines are the standard opening move on any new dataset. Doing them before you analyse anything is the difference between a good grade and a confusing one.' }
    ],
    encounters:[
      { t:'mcq', q:'What must be true of every column in a data frame?',
        opts:['They must all be numeric','They must all be the same length','They must be sorted','They must have no NAs'], a:1,
        why:'It is a rectangle. Unequal lengths either error or get recycled into something wrong.' },
      { t:'mcq', q:'What does <code>students$score</code> give you?',
        opts:['A one-column data frame','A vector of that column','The column name','A factor'], a:1,
        why:'$ extracts the column as a plain vector, so all vector operations work on it.' },
      { t:'mcq', q:'Which function should you run FIRST on a dataset you have just been handed?',
        opts:['mean()','str()','plot()','sort()'], a:1,
        why:'str() shows the type of every column. Type surprises are where most analysis bugs come from.' },
      { t:'fill', q:'Pull the score column out of the data frame.',
        code:'scores <- students___score', answers:['$'],
        why:'$ is the column accessor for data frames and lists.' },
      { t:'code', task:'Build a data frame <code>students</code> with columns <code>name</code> ("Ada","Taj","Grace") and <code>score</code> (80, 90, 100).',
        starter:'students <- data.frame(\n  name = ,\n  score = \n)\n',
        harness:'print(nrow(students))\nprint(mean(students$score))', expected:'[1] 3\n[1] 90',
        hint:'Each column is a c(...) vector, and they must be the same length.',
        solution:'students <- data.frame(\n  name = c("Ada", "Taj", "Grace"),\n  score = c(80, 90, 100)\n)' },
      { t:'code', task:'Add 5 to every score in the data frame, then print the score column.',
        spec:'Assigning to a column replaces it. Because the operation is vectorised, one line updates every row.',
        starter:'students <- data.frame(score = c(80, 90))\n\n# add 5 to every score, then print students$score\n',
        harness:'', expected:'[1] 85 95',
        hint:'students$score <- students$score + 5   then   print(students$score)',
        solution:'students <- data.frame(score = c(80, 90))\n\nstudents$score <- students$score + 5\nprint(students$score)' },
      { t:'code', task:'Print how many rows the data frame has.',
        starter:'students <- data.frame(a = c(1, 2, 3, 4))\n\n# print the number of rows\n',
        harness:'', expected:'[1] 4',
        hint:'print(nrow(students)) — nrow for rows, ncol for columns.',
        solution:'students <- data.frame(a = c(1, 2, 3, 4))\n\nprint(nrow(students))' }
    ]},

  { title:'Subsetting & Filtering', mon:'Comma Eater', emoji:'\u{1F52A}',
    taunt:'"Rows before columns. Forget the comma and see what happens."',
    lesson:[
      { h:'The two-argument bracket',
        p:['For a data frame, <code>df[rows, columns]</code>. <b>The comma is mandatory.</b> Leave a side blank to mean "all of them".'],
        code:'students <- data.frame(name = c("Ada","Taj","Grace"),\n                       score = c(88, 92, 79))\n\nprint(students[1, ])        # row 1, all columns\nprint(students[, "score"])  # all rows, one column\nprint(students[2, "name"])  # one cell',
        out:'  name score\n1  Ada    88\n[1] 88 92 79\n[1] "Taj"',
        note:'<b>Forget the comma</b> and <code>students[1]</code> means "the first COLUMN", because a data frame is really a list of columns. Silent, wrong, and a genuine time-waster.' },
      { h:'Filtering rows with a condition',
        p:['Put a logical vector in the row slot. This is the move you will make hundreds of times.'],
        code:'print(students[students$score > 85, ])\nprint(students[students$score > 85, "name"])',
        out:'  name score\n1  Ada    88\n2  Taj    92\n[1] "Ada" "Taj"',
        note:'<b>Say it in English as you write it:</b> "students, where students$score is greater than 85, all columns." The comma is the "all columns" part.' },
      { h:'Combining conditions',
        p:['Use <code>&</code> and <code>|</code> — the single-character versions. The doubled <code>&&</code> and <code>||</code> only look at the first element and will quietly give you one row instead of many.'],
        code:'df <- data.frame(score = c(88, 92, 79), year = c("F","S","F"))\n\nprint(df[df$score > 80 & df$year == "F", ])\nprint(df[df$score > 90 | df$year == "F", ])',
        out:'  score year\n1    88    F\n  score year\n1    88    F\n2    92    S\n3    79    F',
        note:'<b>& for vectors, && for single conditions in an if().</b> Mixing them up is one of the most common R bugs, and R 4.3+ now errors on && with a vector — a mercy.' },
      { h:'subset() and which()',
        p:['<code>subset()</code> reads more nicely and lets you drop the <code>df$</code> prefix. <code>which()</code> turns TRUE/FALSE into positions.'],
        code:'print(subset(df, score > 85))\nprint(which(df$score > 85))\nprint(which.max(df$score))',
        out:'  score year\n1    88    F\n2    92    S\n[1] 1 2\n[1] 2',
        note:'<code>subset()</code> is convenient at the console but fragile inside functions. Use bracket filtering in code you keep.' },
      { h:'Sorting with order()',
        p:['<code>sort()</code> sorts a vector. To sort a whole data frame you need <code>order()</code>, which gives the row positions in the new order.'],
        code:'print(df[order(df$score), ])\nprint(df[order(-df$score), ])',
        out:'  score year\n3    79    F\n1    88    F\n2    92    S\n  score year\n2    92    S\n1    88    F\n3    79    F',
        note:'Note the row names travel with the rows — that is how you can tell it was reordered rather than rebuilt.' }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>df[2, ]</code> give?',
        opts:['The second column','The second row, all columns','The second cell','An error'], a:1,
        why:'Rows come first, then the comma, then columns. Blank means "all".' },
      { t:'mcq', q:'What does <code>df[1]</code> (no comma) give for a data frame?',
        opts:['The first row','The first COLUMN','An error','The first cell'], a:1,
        why:'Without the comma a data frame behaves like a list of columns. Silent and wrong — always include the comma.' },
      { t:'mcq', q:'Which operator combines conditions across a whole vector?',
        opts:['&&','&','AND','+'], a:1,
        why:'Single & is elementwise. Double && only checks the first element — a classic source of "why did I only get one row".' },
      { t:'mcq', q:'What does <code>which(c(FALSE, TRUE, TRUE))</code> return?',
        opts:['[1] TRUE TRUE','[1] 2 3','[1] 2','[1] 1 2 3'], a:1,
        why:'which() converts TRUE/FALSE into the POSITIONS of the TRUEs.' },
      { t:'code', task:'Print the <code>name</code> of every student scoring above 85.',
        spec:'<b>The comma is not optional.</b> <code>df[rows, columns]</code> — leave a side blank to mean "all of them".',
        starter:'students <- data.frame(name = c("Ada", "Taj", "Grace"),\n                       score = c(88, 92, 79))\n\n# print the names of students scoring above 85\n',
        harness:'', expected:'[1] "Ada" "Taj"',
        hint:'print(students[students$score > 85, "name"]) — say it out loud: "students, where score is above 85, the name column".',
        solution:'students <- data.frame(name = c("Ada", "Taj", "Grace"),\n                       score = c(88, 92, 79))\n\nprint(students[students$score > 85, "name"])' },
      { t:'code', task:'Print how many students scored 85 or above.',
        spec:'You do not need to filter first. Summing a TRUE/FALSE vector counts the TRUEs.',
        starter:'students <- data.frame(score = c(88, 92, 79))\n\n# print how many scored 85 or above\n',
        harness:'', expected:'[1] 2',
        hint:'print(sum(students$score >= 85))',
        solution:'students <- data.frame(score = c(88, 92, 79))\n\nprint(sum(students$score >= 85))' },
      { t:'code', task:'Print the single highest score.',
        starter:'students <- data.frame(score = c(88, 92, 79))\n\n# print the highest score\n',
        harness:'', expected:'[1] 92',
        hint:'print(max(students$score))',
        solution:'students <- data.frame(score = c(88, 92, 79))\n\nprint(max(students$score))' },
      { t:'code', task:'Print all the scores, sorted highest first.',
        starter:'students <- data.frame(score = c(88, 92, 79))\n\n# print the scores, highest first\n',
        harness:'', expected:'[1] 92 88 79',
        hint:'print(sort(students$score, decreasing = TRUE)) — without that argument you get lowest first.',
        solution:'students <- data.frame(score = c(88, 92, 79))\n\nprint(sort(students$score, decreasing = TRUE))' }
    ]},

  { title:'Functions & Control Flow', mon:'Loop Tempter', emoji:'\u{1F300}',
    taunt:'"Write a for loop. Go on. It feels so natural."',
    lesson:[
      { h:'Writing a function',
        p:['<code>function()</code> makes one, and you store it in a name like anything else. R <b>returns the last expression automatically</b> — an explicit <code>return()</code> is optional and mostly used for early exits.'],
        code:'add <- function(a, b) {\n  a + b\n}\n\nprint(add(2, 3))\n\ngreet <- function(name, greeting = "Hi") {\n  paste0(greeting, ", ", name)\n}\nprint(greet("Taj"))', out:'[1] 5\n[1] "Hi, Taj"',
        note:'<code>paste0()</code> glues text with no separator; <code>paste()</code> adds a space. There is no f-string in base R — <code>sprintf("%s scored %d", name, n)</code> is the closest thing.' },
      { h:'if / else',
        p:['Same idea as any language, but the brace placement matters: <code>else</code> must sit on the same line as the closing brace, or R thinks the statement already ended.'],
        code:'grade <- function(score) {\n  if (score >= 90) {\n    "A"\n  } else if (score >= 80) {\n    "B"\n  } else {\n    "F"\n  }\n}\nprint(grade(95))\nprint(grade(72))', out:'[1] "A"\n[1] "F"' },
      { h:'ifelse(): the vectorised version',
        p:['<b>This is the one that matters.</b> Plain <code>if</code> handles a single value. <code>ifelse()</code> works across an entire vector or column at once — which is what data work needs.'],
        code:'scores <- c(95, 72, 88)\n\nprint(ifelse(scores >= 80, "pass", "fail"))\n\ndf <- data.frame(score = scores)\ndf$result <- ifelse(df$score >= 80, "pass", "fail")\nprint(df$result)',
        out:'[1] "pass" "fail" "pass"\n[1] "pass" "fail" "pass"',
        note:'<b>Using <code>if</code> where you needed <code>ifelse</code></b> silently uses only the first element. R 4.2+ warns about this; older versions did not.' },
      { h:'Loops exist, but reach for them last',
        p:['<code>for</code> works exactly as you expect. In R it is usually the wrong tool for transforming data — slower and longer than the vectorised version.'],
        code:'# what you would write in Python\ntotal <- 0\nfor (n in c(1, 2, 3)) {\n  total <- total + n\n}\nprint(total)\n\n# what you write in R\nprint(sum(c(1, 2, 3)))', out:'[1] 6\n[1] 6',
        note:'<b>Legitimate uses for a loop in R:</b> simulations, iterating over files, anything where each step depends on the previous one. Not: adding 5 to a column.' },
      { h:'The growing-vector trap',
        p:['If you must loop and collect results, pre-allocate. Growing a vector one element at a time copies the whole thing every pass — fine for 10 items, painfully slow for 100,000.'],
        code:'# slow: reallocates every iteration\nout <- c()\nfor (i in 1:3) out <- c(out, i * 2)\n\n# fast: space reserved up front\nout <- numeric(3)\nfor (i in 1:3) out[i] <- i * 2\nprint(out)', out:'[1] 2 4 6' }
    ],
    encounters:[
      { t:'mcq', q:'What does an R function return if there is no <code>return()</code>?',
        opts:['NULL','NA','The value of the last expression','An error'], a:2,
        why:'R returns the last evaluated expression automatically. Explicit return() is for early exits.' },
      { t:'mcq', q:'You want to label every score in a column pass/fail. Which do you use?',
        opts:['if','ifelse','for','which'], a:1,
        why:'ifelse() is vectorised — it works across the whole column. Plain if would only look at the first value.' },
      { t:'mcq', q:'What does this print?', code:'scores <- c(95, 72)\nprint(ifelse(scores >= 80, "pass", "fail"))',
        opts:['[1] "pass"','[1] "pass" "fail"','[1] TRUE FALSE','Error'], a:1,
        why:'One result per element, in order.' },
      { t:'mcq', q:'Why is <code>out <- c(out, x)</code> inside a loop a bad habit?',
        opts:['It is invalid syntax','It reallocates the whole vector every iteration','It only works on numbers','It reverses the order'], a:1,
        why:'Each append copies the entire vector. Pre-allocate with numeric(n) and assign by index instead.' },
      { t:'fill', q:'Complete the keyword that creates a function in R.',
        code:'add <- ___(a, b) {\n  a + b\n}', answers:['function'],
        why:'function(args) { body } — and you store it in a name like any other value.' },
      { t:'code', task:'Write <code>grade(score)</code> returning "A" for 90+, "B" for 80+, otherwise "F".',
        starter:'grade <- function(score) {\n  # your code here\n}\n',
        harness:'print(grade(95))\nprint(grade(83))\nprint(grade(50))', expected:'[1] "A"\n[1] "B"\n[1] "F"',
        hint:'if / else if / else — and remember else goes on the same line as the closing brace.',
        solution:'grade <- function(score) {\n  if (score >= 90) {\n    "A"\n  } else if (score >= 80) {\n    "B"\n  } else {\n    "F"\n  }\n}' },
      { t:'code', task:'Write <code>pass_fail(v)</code> labelling an entire vector: "pass" at 60 or above, else "fail".',
        starter:'pass_fail <- function(v) {\n  # must work on the whole vector\n}\n',
        harness:'print(pass_fail(c(70, 50, 60)))', expected:'[1] "pass" "fail" "pass"',
        hint:'ifelse(v >= 60, "pass", "fail")',
        solution:'pass_fail <- function(v) {\n  ifelse(v >= 60, "pass", "fail")\n}' },
      { t:'code', task:'Write <code>describe(name, score)</code> returning <code>"Ada scored 88"</code>.',
        starter:'describe <- function(name, score) {\n  # your code here\n}\n',
        harness:'print(describe("Ada", 88))', expected:'[1] "Ada scored 88"',
        hint:'paste(name, "scored", score) — paste() joins with spaces automatically.',
        solution:'describe <- function(name, score) {\n  paste(name, "scored", score)\n}' }
    ]},

  { title:'The apply Family', mon:'Loop Tempter II', emoji:'\u{1F504}',
    taunt:'"You escaped once. Not twice."',
    lesson:[
      { h:'Applying a function over a collection',
        p:['Vectorised arithmetic handles <code>x * 2</code>. But what about running your <i>own</i> function over every element, or every column? That is the apply family.'],
        code:'print(sapply(c(1, 4, 9), sqrt))\nprint(sapply(1:4, function(x) x ^ 2))',
        out:'[1] 1 2 3\n[1]  1  4  9 16' },
      { h:'sapply vs lapply',
        p:['Same job, different return type. <b>s</b>apply <b>s</b>implifies to a vector when it can. <b>l</b>apply always returns a <b>l</b>ist.'],
        code:'print(sapply(1:3, function(x) x * 2))\nprint(lapply(1:2, function(x) x * 2))',
        out:'[1] 2 4 6\n[[1]]\n[1] 2\n\n[[2]]\n[1] 4',
        note:'<b>sapply is convenient but unpredictable</b> — if the results have different shapes it silently hands back a list instead of a vector. In code that matters, <code>vapply()</code> forces you to declare the expected type and errors if reality disagrees.' },
      { h:'Anonymous functions',
        p:['<code>function(x) ...</code> written inline, with no name. R 4.1+ also allows the shorthand <code>\\(x)</code>.'],
        code:'print(sapply(c(2, 4), function(x) x + 100))\nprint(sapply(c(2, 4), \\(x) x + 100))', out:'[1] 102 104\n[1] 102 104' },
      { h:'sapply over a data frame walks the COLUMNS',
        p:['A data frame is a list of columns, so sapply hands your function one whole column at a time. That makes column summaries a one-liner.'],
        code:'df <- data.frame(a = c(1, 2, 3), b = c(10, 20, 30))\nprint(sapply(df, mean))\nprint(sapply(df, class))',
        out:' a  b \n 2 20 \n        a         b \n"numeric" "numeric" ' },
      { h:'apply() for rows or columns of a matrix',
        p:['The <code>MARGIN</code> argument: <b>1 = rows, 2 = columns</b>. Remember it as "rows come first, like in df[rows, cols]".'],
        code:'m <- matrix(1:6, nrow = 2)\nprint(m)\nprint(apply(m, 1, sum))   # per row\nprint(apply(m, 2, sum))   # per column',
        out:'     [,1] [,2] [,3]\n[1,]    1    3    5\n[2,]    2    4    6\n[1]  9 12\n[1] 3 7 11' },
      { h:'Why bother',
        p:['Beyond speed: an apply is a single expression with no counter variable and no accumulator to get wrong. Fewer moving parts, fewer bugs. Once it clicks, you will stop reaching for <code>for</code> almost entirely.',
           'If your course uses the tidyverse, <code>dplyr</code>\'s <code>mutate()</code>, <code>filter()</code> and <code>group_by()</code> are a friendlier layer on top of these same ideas — but base R is what exams test.'] }
    ],
    encounters:[
      { t:'mcq', q:'What is the difference between <code>sapply</code> and <code>lapply</code>?',
        opts:['sapply is faster','lapply always returns a list; sapply simplifies to a vector when it can','They are identical','lapply only works on data frames'], a:1,
        why:'The s is for "simplify". That convenience is also why sapply can surprise you when shapes differ.' },
      { t:'mcq', q:'What does <code>sapply(c(1, 4, 9), sqrt)</code> return?',
        opts:['[1] 1 4 9','[1] 1 2 3','A list','[1] 14'], a:1,
        why:'It applies sqrt to each element and simplifies the result to a vector.' },
      { t:'mcq', q:'<code>sapply(df, mean)</code> on a data frame computes the mean of...',
        opts:['each row','each column','the whole table','the first column'], a:1,
        why:'A data frame is a list of columns, so sapply iterates over columns.' },
      { t:'mcq', q:'In <code>apply(m, 1, sum)</code>, what does the 1 mean?',
        opts:['The first column','Operate over rows','Add 1','The first row only'], a:1,
        why:'MARGIN 1 = rows, 2 = columns — same order as df[rows, cols].' },
      { t:'code', task:'Write <code>squares(v)</code> returning each element squared, using <code>sapply</code>.',
        starter:'squares <- function(v) {\n  # use sapply with an anonymous function\n}\n',
        harness:'print(squares(c(1, 2, 3)))', expected:'[1] 1 4 9',
        hint:'sapply(v, function(x) x ^ 2)',
        solution:'squares <- function(v) {\n  sapply(v, function(x) x ^ 2)\n}' },
      { t:'code', task:'Write <code>col_means(df)</code> returning the mean of every column.',
        starter:'col_means <- function(df) {\n  # your code here\n}\n',
        harness:'d <- data.frame(a = c(1, 2, 3), b = c(10, 20, 30))\nprint(as.numeric(col_means(d)))',
        expected:'[1]  2 20',
        hint:'sapply(df, mean) — the harness strips the names off for you.',
        solution:'col_means <- function(df) {\n  sapply(df, mean)\n}' },
      { t:'code', task:'Write <code>name_lengths(v)</code> returning the character count of each string.',
        starter:'name_lengths <- function(v) {\n  # your code here\n}\n',
        harness:'print(name_lengths(c("Ada", "Taj", "Grace")))', expected:'[1] 3 3 5',
        hint:'sapply(v, nchar) — or just nchar(v), which is already vectorised.',
        solution:'name_lengths <- function(v) {\n  nchar(v)\n}' }
    ]},

  { title:'Summary Statistics & Missing Data', mon:'NA Poisoner', emoji:'\u{1F9EA}',
    taunt:'"One missing value. That is all it takes to ruin your mean."',
    lesson:[
      { h:'The core summaries',
        p:['This is what R is for. All of these are one call.'],
        code:'x <- c(2, 4, 6)\n\nprint(mean(x))\nprint(median(x))\nprint(sd(x))\nprint(var(x))\nprint(range(x))\nprint(sum(x))\nprint(length(x))',
        out:'[1] 4\n[1] 4\n[1] 2\n[1] 4\n[1] 2 6\n[1] 12\n[1] 3',
        note:'<b>R\'s <code>sd()</code> and <code>var()</code> use the SAMPLE formula</b> (divide by n−1), not the population one. That is almost always what you want in a stats class, but know which your assignment is asking for.' },
      { h:'summary() gives you five numbers at once',
        p:['The five-number summary plus the mean. This is usually your first look at any variable.'],
        code:'print(summary(c(2, 4, 6, 8)))',
        out:'   Min. 1st Qu.  Median 3rd Qu.    Max. \n   2.00    3.50    5.00    6.50    8.00 ' },
      { h:'NA poisons everything it touches',
        p:['<b>The monster on this floor.</b> Any summary that meets an NA returns NA — deliberately, because R refuses to quietly pretend the missing value was not there.'],
        code:'x <- c(1, 2, NA, 4)\n\nprint(mean(x))\nprint(mean(x, na.rm = TRUE))\nprint(sum(is.na(x)))',
        out:'[1] NA\n[1] 2.333333\n[1] 1',
        note:'<b><code>na.rm = TRUE</code> is the fix</b>, and it works on mean, median, sd, var, sum, min and max. But before you reach for it, ask <i>why</i> data is missing — dropping it silently can bias your result, and "I removed 40% of the rows" is something a marker wants stated.' },
      { h:'Rounding for reporting',
        p:['Raw R output gives seven significant digits. Round before you report anything.'],
        code:'x <- c(2, 4, 4, 4, 5, 5, 7, 9)\nprint(sd(x))\nprint(round(sd(x), 2))\nprint(signif(sd(x), 3))', out:'[1] 2.13809\n[1] 2.14\n[1] 2.14' },
      { h:'Quantiles and outliers',
        p:['Quartiles drive the boxplot, and the 1.5 × IQR rule is the standard outlier definition you will be asked about.'],
        code:'x <- c(1, 2, 3, 4, 100)\nprint(quantile(x, 0.5))\nprint(IQR(x))\n\nq <- quantile(x, c(0.25, 0.75))\ncutoff <- q[[2]] + 1.5 * IQR(x)\nprint(x[x > cutoff])',
        out:'50% \n  3 \n[1] 2\n[1] 100',
        note:'<b>Mean vs median:</b> that 100 drags the mean to 22 while the median stays at 3. When they disagree sharply, your data is skewed — and reporting the median is usually the honest choice.' }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>mean(c(1, 2, NA, 4))</code> return?',
        opts:['[1] 2.333333','[1] NA','[1] 7','An error'], a:1,
        why:'NA propagates. R refuses to guess what the missing value was. Add na.rm = TRUE to skip it.' },
      { t:'mcq', q:'Which argument tells a summary function to ignore missing values?',
        opts:['ignore = TRUE','na.rm = TRUE','drop = TRUE','skipna = TRUE'], a:1,
        why:'na.rm = TRUE works on mean, median, sd, var, sum, min and max.' },
      { t:'mcq', q:'R\'s <code>sd()</code> divides by...',
        opts:['n','n − 1','n + 1','the mean'], a:1,
        why:'R uses the sample standard deviation by default. Check which one your assignment wants.' },
      { t:'mcq', q:'For <code>c(1, 2, 3, 4, 100)</code>, which is the more honest summary?',
        opts:['The mean, because it uses every value','The median, because one extreme value drags the mean','They are the same','Neither'], a:1,
        why:'Mean 22 vs median 3. When they diverge sharply the data is skewed and the median describes a typical value better.' },
      { t:'fill', q:'Make this ignore the missing value.',
        code:'m <- mean(x, ___ = TRUE)', answers:['na.rm'],
        why:'na.rm stands for "NA remove".' },
      { t:'code', task:'Write <code>safe_mean(v)</code> returning the mean while ignoring NAs.',
        starter:'safe_mean <- function(v) {\n  # your code here\n}\n',
        harness:'print(safe_mean(c(2, 4, NA, 6)))\nprint(safe_mean(c(1, 2)))', expected:'[1] 4\n[1] 1.5',
        hint:'mean(v, na.rm = TRUE)',
        solution:'safe_mean <- function(v) {\n  mean(v, na.rm = TRUE)\n}' },
      { t:'code', task:'Write <code>spread(v)</code> returning the standard deviation rounded to 2 decimal places.',
        starter:'spread <- function(v) {\n  # your code here\n}\n',
        harness:'print(spread(c(2, 4, 4, 4, 5, 5, 7, 9)))\nprint(spread(c(2, 4, 6)))', expected:'[1] 2.14\n[1] 2',
        hint:'round(sd(v), 2)',
        solution:'spread <- function(v) {\n  round(sd(v), 2)\n}' },
      { t:'code', task:'Write <code>report(v)</code> returning a vector of the mean and median, in that order, NAs ignored.',
        starter:'report <- function(v) {\n  # your code here\n}\n',
        harness:'print(report(c(2, 4, 6, NA)))', expected:'[1] 4 4',
        hint:'c(mean(v, na.rm = TRUE), median(v, na.rm = TRUE))',
        solution:'report <- function(v) {\n  c(mean(v, na.rm = TRUE), median(v, na.rm = TRUE))\n}' },
      { t:'code', task:'Write <code>outliers(v)</code> returning values above the 1.5 × IQR upper fence.',
        starter:'outliers <- function(v) {\n  # your code here\n}\n',
        harness:'print(outliers(c(1, 2, 3, 4, 100)))', expected:'[1] 100',
        hint:'cutoff <- quantile(v, 0.75)[[1]] + 1.5 * IQR(v), then v[v > cutoff].',
        solution:'outliers <- function(v) {\n  cutoff <- quantile(v, 0.75)[[1]] + 1.5 * IQR(v)\n  v[v > cutoff]\n}' }
    ]},

  { title:'Grouping & Tables', mon:'Ungrouped Mass', emoji:'\u{1F5C2}️',
    taunt:'"One big average. That is all you get."',
    lesson:[
      { h:'table(): counting categories',
        p:['The fastest way to see what is in a categorical variable. It also catches typos in your data instantly — "Male", "male" and "MAle" show up as three categories.'],
        code:'year <- c("Fresh", "Senior", "Fresh", "Junior")\nprint(table(year))\n\nprint(table(year)[["Fresh"]])',
        out:'year\n Fresh Junior Senior \n     2      1      1 \n[1] 2' },
      { h:'Two-way tables (cross-tabulation)',
        p:['Hand <code>table()</code> two variables and you get a contingency table — the input to a chi-square test, and a staple of any stats course.'],
        code:'year <- c("Fresh", "Senior", "Fresh", "Senior")\npass <- c("Y", "Y", "N", "Y")\nprint(table(year, pass))\n\nprint(prop.table(table(year)))',
        out:'        pass\nyear     N Y\n  Fresh  1 1\n  Senior 0 2\nyear\n Fresh Senior \n   0.5    0.5 ',
        note:'<code>prop.table()</code> converts counts to proportions. <code>addmargins()</code> adds row and column totals.' },
      { h:'tapply(): a summary per group',
        p:['"Apply this function to this variable, split by that grouping variable." The classic base-R group-by.'],
        code:'scores <- c(90, 70, 80, 60)\ngroup  <- c("A", "B", "A", "B")\n\nprint(tapply(scores, group, mean))\nprint(tapply(scores, group, mean)[["A"]])',
        out:' A  B \n85 65 \n[1] 85',
        note:'The result is a named vector. Use <code>[["A"]]</code> to pull one group out as a plain number.' },
      { h:'aggregate(): the data frame version',
        p:['Same idea, but takes a formula and returns a tidy data frame — better when you want to keep working with the result.'],
        code:'df <- data.frame(score = c(90, 70, 80, 60),\n                 group = c("A", "B", "A", "B"))\n\nprint(aggregate(score ~ group, data = df, FUN = mean))',
        out:'  group score\n1     A    85\n2     B    65',
        note:'<b><code>score ~ group</code> is a formula</b> — read it as "score, explained by group". You will see this same syntax again in t-tests, chi-square and regression. Learning it once pays off repeatedly.' },
      { h:'The tidyverse alternative',
        p:['If your course uses <code>dplyr</code>, the same operation reads like a sentence. Base R is what exams test, but you will see this everywhere in real code and tutorials.'],
        code:'library(dplyr)\n\ndf %>%\n  group_by(group) %>%\n  summarise(avg = mean(score))',
        note:'<code>%>%</code> (or R 4.1+\'s <code>|></code>) is the pipe: "take this, then do that". It is the same computation as aggregate, written left to right.' }

    encounters:[
      { t:'mcq', q:'What does <code>table(c("a", "b", "a"))</code> give?',
        opts:['A count of each distinct value','The values sorted','A data frame','The length'], a:0,
        why:'table() counts occurrences of each level — and instantly exposes typos like "a" vs "A".' },
      { t:'mcq', q:'What does <code>tapply(scores, group, mean)</code> do?',

      { t:'mcq', q:'In <code>aggregate(score ~ group, ...)</code>, how do you read the formula?',
        opts:['group divided by score','score explained by group','group first, then score','score minus group'], a:1,
        why:'The tilde means "modelled by" or "explained by". The same syntax appears in t.test, chisq.test and lm.' },
      { t:'mcq', q:'What does <code>prop.table(table(x))</code> return?',
        opts:['Counts','Proportions of the total','Percentages with a % sign','The sorted table'], a:1,
        why:'It divides each count by the total, giving proportions between 0 and 1.' },
      { t:'code', task:'Write <code>count_of(v, value)</code> returning how many times <code>value</code> appears.',
        starter:'count_of <- function(v, value) {\n  # your code here\n}\n',
        harness:'print(count_of(c("a", "b", "a"), "a"))\nprint(count_of(c("a"), "z"))', expected:'[1] 2\n[1] 0',
        hint:'sum(v == value) — the comparison gives TRUE/FALSE and sum counts the TRUEs.',
        solution:'count_of <- function(v, value) {\n  sum(v == value)\n}' },
      { t:'code', task:'Write <code>group_mean(scores, group, which)</code> returning the mean for one group.',
        starter:'group_mean <- function(scores, group, which) {\n  # your code here\n}\n',
        harness:'s <- c(90, 70, 80, 60)\ng <- c("A", "B", "A", "B")\nprint(group_mean(s, g, "A"))\nprint(group_mean(s, g, "B"))',
        expected:'[1] 85\n[1] 65',
        hint:'tapply(scores, group, mean)[[which]] — or mean(scores[group == which]).',
        solution:'group_mean <- function(scores, group, which) {\n  tapply(scores, group, mean)[[which]]\n}' },
      { t:'code', task:'Write <code>group_table(df)</code> returning a data frame of mean score per group, via <code>aggregate</code>.',
        starter:'group_table <- function(df) {\n  # use aggregate with a formula\n}\n',
