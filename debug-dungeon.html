    lesson:[
      { h:'The skill nobody practises',
        p:['You will spend far more of your career reading code than writing it. On your first day at a job you will be handed a codebase nobody explains, and asked to change one small thing in it without breaking anything.',
           'Every exercise you have done so far was the opposite of this: a blank box and a clear spec. This floor inverts it.'] },
      { h:'How to approach an unfamiliar file',
        p:['<b>1. Do not read top to bottom.</b> Find the entry point — <code>main</code>, the route handler, the exported function — and follow only the path you care about.',
           '<b>2. Follow the data.</b> What comes in, what shape is it, what leaves? Ignore everything not on that path.',
           '<b>3. Read the tests first if they exist.</b> Tests are documentation that cannot go stale — they show you exactly how the thing is meant to be used.',
           '<b>4. Run it.</b> Add a print, change an input, see what moves. Reading is slow; poking is fast.',
           '<b>5. Do not judge it.</b> "This is terrible" is almost always missing context. Assume a constraint you cannot see.'] },
      { h:'Sample one: a retry decorator',
        p:['Real code from a real codebase shape. Read it, then answer the questions below.'],
        code:'import time\n\ndef retry(times=3, delay=0):\n    def decorator(fn):\n        def wrapper(*args, **kwargs):\n            last_error = None\n            for attempt in range(times):\n                try:\n                    return fn(*args, **kwargs)\n                except Exception as err:\n                    last_error = err\n                    if attempt < times - 1:\n                        time.sleep(delay)\n            raise last_error\n        return wrapper\n    return decorator',
        note:'<b>Reading strategy:</b> ignore the nesting at first. The only line that does real work is <code>return fn(*args, **kwargs)</code>. Everything around it is "try that up to <code>times</code> times, and if it never works, raise the last error."' },
      { h:'Sample two: pagination',
        p:['You will meet this exact function in some form at every company that has a list of anything.'],
        code:'def paginate(items, page, per_page=10):\n    start = (page - 1) * per_page\n    end = start + per_page\n    return {\n        "items": items[start:end],\n        "page": page,\n        "pages": (len(items) + per_page - 1) // per_page,\n        "has_next": end < len(items),\n    }',
        note:'<b>That <code>pages</code> line is the interesting one.</b> <code>(n + per_page - 1) // per_page</code> is the standard trick for rounding division <i>up</i> without importing anything. 25 items at 10 per page gives 3, not 2.' },
      { h:'Sample three: a cache with a hidden problem',
        p:['This works correctly. It also has a performance bug that will not appear until production.'],
        code:'class Cache:\n    def __init__(self, limit=100):\n        self.limit = limit\n        self.store = {}\n        self.order = []\n\n    def get(self, key):\n        if key not in self.store:\n            return None\n        self.order.remove(key)\n        self.order.append(key)\n        return self.store[key]\n\n    def put(self, key, value):\n        if key in self.store:\n            self.order.remove(key)\n        elif len(self.store) >= self.limit:\n            oldest = self.order.pop(0)\n            del self.store[oldest]\n        self.store[key] = value\n        self.order.append(key)',
        note:'<b><code>self.order.remove(key)</code> scans the whole list — O(n).</b> So every cache hit is O(n) instead of O(1), which defeats the point of a cache. Spotting this is exactly the kind of thing that gets you hired.' }
    ],
    encounters:[
      { t:'mcq', q:'In the <code>retry</code> decorator, how many times will <code>fn</code> be called at most?',
        code:'def retry(times=3, delay=0):\n    ...\n    for attempt in range(times):\n        try:\n            return fn(*args, **kwargs)',
        opts:['Once','times − 1','times','Forever until it works'], a:2,
        why:'range(times) gives 3 attempts. The return exits immediately on the first success.' },
      { t:'mcq', q:'If every attempt fails, what does <code>retry</code> do?',
        opts:['Returns None','Returns the last error object','Raises the last error','Loops forever'], a:2,
        why:'It stores each error in last_error and raises it after the loop. Failing loudly rather than returning None is deliberate — silent failure is worse.' },
      { t:'mcq', q:'Why is <code>(len(items) + per_page - 1) // per_page</code> used instead of <code>len(items) // per_page</code>?',
        opts:['It is faster','It rounds UP, so 25 items at 10 per page gives 3 pages not 2','It avoids floats','It handles negatives'], a:1,
        why:'Plain floor division would lose the final partial page. This is the standard integer ceiling-division idiom.' },
      { t:'mcq', q:'What is wrong with the <code>Cache</code> class?',
        opts:['It never evicts anything','get() is O(n) because list.remove scans the whole list','It uses too much memory','Nothing'], a:1,
        why:'Every cache hit does a linear scan, so the cache is slower than what it caches. The fix is collections.OrderedDict or a dict plus a doubly-linked list.' },
      { t:'mcq', q:'You are handed an unfamiliar 5,000-line codebase and asked to fix one bug. First move?',
        opts:['Read every file top to bottom','Find the entry point and follow only the path to the bug','Rewrite it','Ask to start fresh'], a:1,
        why:'Reading everything is impossible and unnecessary. Follow the data along one path. Reading the tests first is the other high-value move.' },
      { t:'code', task:'<b>Extend code you did not write.</b> Add a <code>has_prev</code> key to <code>paginate</code> — true when there is a page before this one. Change nothing else.',
        starter:'def paginate(items, page, per_page=10):\n    start = (page - 1) * per_page\n    end = start + per_page\n    return {\n        "items": items[start:end],\n        "page": page,\n        "pages": (len(items) + per_page - 1) // per_page,\n        "has_next": end < len(items),\n        # add has_prev here\n    }\n',
        harness:'p = paginate(list(range(25)), 2, 10)\nprint(p["items"][0])\nprint(p["pages"])\nprint(p["has_next"])\nprint(p["has_prev"])\nq = paginate(list(range(25)), 1, 10)\nprint(q["has_prev"])',
        expected:'10\n3\nTrue\nTrue\nFalse',
        hint:'"has_prev": page > 1 — and resist the urge to tidy anything else while you are in there. Unrelated changes in a PR make it harder to review and harder to revert.',
        solution:'def paginate(items, page, per_page=10):\n    start = (page - 1) * per_page\n    end = start + per_page\n    return {\n        "items": items[start:end],\n        "page": page,\n        "pages": (len(items) + per_page - 1) // per_page,\n        "has_next": end < len(items),\n        "has_prev": page > 1,\n    }' },
      { t:'code', task:'<b>Fix the Cache.</b> Make <code>get</code> and <code>put</code> O(1) using <code>OrderedDict</code>, keeping the same behaviour.',
        starter:'from collections import OrderedDict\n\nclass Cache:\n    def __init__(self, limit=100):\n        self.limit = limit\n        self.store = OrderedDict()\n\n    def get(self, key):\n        # return None if missing; otherwise mark as recently used and return it\n        pass\n\n    def put(self, key, value):\n        # evict the least recently used when full\n        pass\n',
        harness:'c = Cache(limit=2)\nc.put("a", 1)\nc.put("b", 2)\nprint(c.get("a"))\nc.put("c", 3)\nprint(c.get("b"))\nprint(c.get("a"))\nprint(c.get("c"))',
        expected:'1\nNone\n1\n3',
        hint:'OrderedDict has move_to_end(key) and popitem(last=False). get: if missing return None, else move_to_end then return. put: if key exists move_to_end; if full popitem(last=False); then set. Note "a" survives because getting it made it recent.',
        solution:'from collections import OrderedDict\n\nclass Cache:\n    def __init__(self, limit=100):\n        self.limit = limit\n        self.store = OrderedDict()\n\n    def get(self, key):\n        if key not in self.store:\n            return None\n        self.store.move_to_end(key)\n        return self.store[key]\n\n    def put(self, key, value):\n        if key in self.store:\n            self.store.move_to_end(key)\n        elif len(self.store) >= self.limit:\n            self.store.popitem(last=False)\n        self.store[key] = value' }
    ]},

  /* ---- F5 ---- */
  { title:'Debugging: Read The Error', mon:'The Stack Trace', emoji:'\u{1F50E}',
    taunt:'"Forty lines of red text. Which one matters?"',
    lesson:[
      { h:'The gap employers name most',
        p:['Surveys of employers repeatedly find the biggest complaint about graduates is not syntax — it is <b>hands-on debugging experience</b>. Everyone can write code that works. Fewer can fix code that does not.',
           'The good news: debugging is a procedure, not a talent.'] },
      { h:'Anatomy of a traceback',
        p:['Python prints the call chain that led to the crash. <b>Read it bottom-up.</b>'],
        code:'Traceback (most recent call last):\n  File "app.py", line 42, in <module>\n    report(scores)\n  File "app.py", line 30, in report\n    avg = average(nums)\n  File "app.py", line 12, in average\n    return sum(nums) / len(nums)\nZeroDivisionError: division by zero',
        note:'<b>The last line names the problem.</b> The line above it is the exact code that broke. The lines above that are how you got there. Beginners see a wall of red and panic; the wall is a map, and the destination is at the bottom.' },
      { h:'The procedure',
        p:['<b>1. Read the error.</b> Actually read it. The type and message are usually the answer.',
           '<b>2. Reproduce it reliably.</b> A bug you cannot trigger on demand cannot be fixed, only guessed at.',
           '<b>3. Form one hypothesis.</b> "I think nums is empty here."',
           '<b>4. Test that one thing.</b> A print, a breakpoint, whatever is fastest.',
           '<b>5. Narrow by halving.</b> Does it break before this line or after? Repeat until the space is one line.',
           '<b>6. Fix the cause, not the symptom.</b> Wrapping it in try/except so the error stops appearing is not a fix.'],
        note:'<b>Rubber duck debugging is real.</b> Explaining the problem out loud, in full sentences, to an object, forces you to state assumptions — and you usually spot the wrong one mid-sentence. Every experienced engineer does this.' },
      { h:'Your tools, in order of usefulness',
        p:[''],
        code:'print(f"{nums=}")      the f-string = syntax prints BOTH name and value\nbreakpoint()           drops into an interactive debugger at that line\nVS Code F5 + red dot   set a breakpoint, step line by line, inspect variables\ngit bisect             finds which commit introduced a bug, automatically\nlogging module         for anything you cannot pause - servers, production',
        note:'<code>print(f"{nums=}")</code> outputs <code>nums=[1, 2, 3]</code>. Knowing that one trick will save you thousands of keystrokes.' },
      { h:'The errors you will meet most',
        p:[''],
        code:'ZeroDivisionError    dividing by len() of something empty\nIndexError           off by one, or an empty list\nKeyError             assumed a dict key was there\nTypeError            None where you expected a value; or mixing str and int\nAttributeError       "NoneType has no attribute x" = a function returned None\nUnboundLocalError    assigned to a variable inside a function that\n                     you also read from outside',
        note:'<b>"NoneType has no attribute..." is the most common Python error in the world.</b> It nearly always means a function you called forgot to return something.' }
    ],
    encounters:[
      { t:'mcq', q:'Which line of a traceback tells you what actually went wrong?',
        opts:['The first line','The last line','The middle','The file name'], a:1,
        why:'The last line is the error type and message. Work upward from there to see how you arrived.' },
      { t:'mcq', q:'You get <code>AttributeError: \'NoneType\' object has no attribute \'upper\'</code>. Most likely cause?',
        opts:['Python is broken','A function you called returned None instead of a value','You need to import something','The string is empty'], a:1,
        why:'Almost always a missing return statement somewhere upstream. This is the single most common Python error there is.' },
      { t:'mcq', q:'The bug only happens sometimes and you cannot trigger it on demand. Next step?',
        opts:['Guess and change things until it stops','Find a reliable way to reproduce it first','Wrap it in try/except','Ignore it'], a:1,
        why:'You cannot verify a fix for something you cannot trigger. Reproduction comes before diagnosis, always.' },
      { t:'mcq', q:'What does <code>print(f"{nums=}")</code> output?',
        opts:['nums','[1, 2, 3]','nums=[1, 2, 3]','An error'], a:2,
        why:'The = inside an f-string prints the expression AND its value. The fastest debugging trick in Python.' },
      { t:'mcq', q:'Wrapping the failing line in try/except so the error stops showing is:',
        opts:['A proper fix','Hiding the symptom while the cause remains','Best practice','Required'], a:1,
        why:'The bad data is still flowing through your system, it just fails somewhere else later — and now with no traceback to help.' },
      { t:'code', task:'<b>Fix the crash.</b><br><code>ZeroDivisionError: division by zero</code><br>at <code>return sum(nums) / len(nums)</code>',
        spec:'An empty list should return <code>0</code>, not crash. Do not change the behaviour for non-empty lists.',
        starter:'def average(nums):\n    return sum(nums) / len(nums)\n',
        harness:'print(average([1, 2, 3]))\nprint(average([]))\nprint(average([10]))',
        expected:'2.0\n0\n10.0',
        hint:'Guard the empty case at the top: if not nums: return 0',
        solution:'def average(nums):\n    if not nums:\n        return 0\n    return sum(nums) / len(nums)' },
      { t:'code', task:'<b>Fix the crash.</b><br><code>IndexError: list index out of range</code><br>at <code>out.append(names[i][0])</code>',
        spec:'Classic off-by-one. Find it by asking: what is the largest value <code>i</code> takes, and what is the largest valid index?',
        starter:'def get_initials(names):\n    out = []\n    for i in range(len(names) + 1):\n        out.append(names[i][0])\n    return out\n',
        harness:'print(get_initials(["Ada", "Taj"]))\nprint(get_initials([]))',
        expected:"['A', 'T']\n[]",
        hint:'range(len(names) + 1) goes one past the end. A 2-item list has valid indexes 0 and 1, but this asks for 2. Drop the + 1 — or better, loop the values directly with "for name in names".',
        solution:'def get_initials(names):\n    out = []\n    for name in names:\n        out.append(name[0])\n    return out' },
      { t:'code', task:'<b>Fix the crash.</b><br><code>KeyError: \'bob\'</code><br>at <code>scores[name] = scores[name] + points</code>',
        spec:'Adding points for someone not yet in the dictionary should start them at that score rather than crashing.',
        starter:'def add_score(scores, name, points):\n    scores[name] = scores[name] + points\n    return scores\n',
        harness:'s = {"ada": 10}\nprint(add_score(s, "ada", 5))\nprint(add_score(s, "bob", 3))',
        expected:"{'ada': 15}\n{'ada': 15, 'bob': 3}",
        hint:'scores.get(name, 0) returns 0 for a missing key instead of raising.',
        solution:'def add_score(scores, name, points):\n    scores[name] = scores.get(name, 0) + points\n    return scores' },
      { t:'code', task:'<b>Fix the silent bug.</b> No error, wrong answer. <code>discount(100, 20)</code> should give 80.',
        spec:'This one raises nothing at all — the worst kind. Work through the arithmetic by hand before you change anything.',
        starter:'def discount(price, percent):\n    return price - percent / 100\n',
        harness:'print(discount(100, 20))\nprint(discount(50, 10))\nprint(discount(80, 0))',
        expected:'80.0\n45.0\n80.0',
        hint:'Operator precedence: percent / 100 happens first, giving 0.2, and 100 - 0.2 is 99.8. You need price - (price * percent / 100).',
        solution:'def discount(price, percent):\n    return price - (price * percent / 100)' }
    ]},

  /* ---- F6 ---- */
  { title:'Testing', mon:'It Works On My Machine', emoji:'\u{1F9EB}',
    taunt:'"It ran once. That is proof enough, surely."',
    lesson:[
      { h:'Why anyone bothers',
        p:['Tests are not about proving code works today. They are about knowing <b>next month</b>, when you change something else, that you did not silently break this.',
           'A codebase without tests becomes one nobody dares change. That is how software dies.'],
        note:'<b>For your portfolio:</b> a repo with tests reads completely differently from one without. It is one of the cheapest signals of professionalism you can add.' },
      { h:'assert: the whole idea',
        p:['<code>assert</code> does nothing when the condition is true and raises when it is false. That is the entire mechanism.'],
        code:'def add(a, b):\n    return a + b\n\nassert add(2, 3) == 5      # silence = pass\nassert add(2, 3) == 6      # AssertionError\nprint("all passed")' },
      { h:'pytest — the real tool',
        p:['Put tests in a file starting with <code>test_</code>, in functions starting with <code>test_</code>. Run <code>pytest</code> in the terminal. It finds and runs everything.'],
        code:'# test_grades.py\nfrom grades import letter\n\ndef test_a_grade():\n    assert letter(95) == "A"\n\ndef test_boundary():\n    assert letter(90) == "A"\n    assert letter(89) == "B"\n\ndef test_handles_zero():\n    assert letter(0) == "F"',
        note:'Install it with <code>pip install pytest</code>, run it with <code>pytest</code> or <code>python -m pytest</code>. It prints a green dot per passing test and a full diff for failures.' },
      { h:'Arrange, Act, Assert',
        p:['Every good test has three parts, in this order. Keeping them visually separate makes tests readable at a glance.'],
        code:'def test_player_takes_damage():\n    player = Player("Taj", hp=10)   # ARRANGE: set up\n\n    player.take_damage(3)           # ACT: do the one thing\n\n    assert player.hp == 7           # ASSERT: check the result',
        note:'<b>One behaviour per test.</b> When a test fails you should know what broke from the name alone, without reading the body.' },
      { h:'What to test — the boundaries',
        p:['Do not test that 2 + 2 is 4 in fifty ways. Test the places where behaviour <b>changes</b>:'],
        code:'· empty input          []   ""   {}   None\n· one item             the smallest real case\n· the boundary         if score >= 90 -> test 89, 90, 91\n· negatives and zero\n· duplicates\n· the biggest realistic input',
        note:'<b>Boundaries are where bugs live.</b> An off-by-one is invisible at 50 and obvious at exactly 90. If you only test the middle of a range, you test nothing interesting.' },
      { h:'TDD, briefly',
        p:['Write the failing test first, then the code that makes it pass, then tidy up. <b>Red, green, refactor.</b>',
           'You do not have to work this way. But writing the test first forces you to decide what the function should actually do before you start typing — which is where half of all bugs come from.'],
        note:'<b>Coverage is a trap.</b> 100% coverage means every line ran, not that anything was verified. A test suite that never asserts anything can hit 100%.' }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>assert x == 5</code> do when x is 5?',
        opts:['Prints True','Nothing — silence means pass','Returns 5','Raises'], a:1,
        why:'Assertions are silent on success and raise AssertionError on failure. Silence is the pass signal.' },
      { t:'mcq', q:'Your function is <code>if score >= 90: return "A"</code>. Which values are most worth testing?',
        opts:['50 and 100','89, 90 and 91','0 only','Random values'], a:1,
        why:'Boundaries are where off-by-one errors hide. 89/90/91 catches >= vs >, which 50 and 100 never would.' },
      { t:'mcq', q:'What does pytest need in order to find your tests?',
        opts:['A config file','Files named test_*.py with functions named test_*','A main() function','Nothing, it runs everything'], a:1,
        why:'Convention over configuration — the naming IS the registration.' },
      { t:'mcq', q:'Your project has 100% test coverage. What does that guarantee?',
        opts:['The code is bug-free','Every line ran during the tests — nothing more','All edge cases are handled','It is production ready'], a:1,
        why:'Coverage measures execution, not verification. A suite with no assertions at all can score 100%.' },
      { t:'mcq', q:'What are the three parts of a well-structured test?',
        opts:['Setup, Run, Teardown','Arrange, Act, Assert','Given, When, Delete','Input, Output, Log'], a:1,
        why:'Arrange the world, Act once, Assert the result. Keeping them separate makes a failure readable at a glance.' },
      { t:'code', task:'Write <code>test_letter()</code> asserting the <b>boundary</b> behaviour of the function given. Return "pass" at the end.',
        spec:'Assert the values on both sides of each threshold: 90 and 89, and 60 and 59. Those are the ones that catch <code>&gt;=</code> vs <code>&gt;</code>.',
        starter:'def letter(score):\n    if score >= 90:\n        return "A"\n    elif score >= 80:\n        return "B"\n    elif score >= 60:\n        return "D"\n    return "F"\n\n\ndef test_letter():\n    # assert the boundaries, then return "pass"\n    pass\n',
        harness:'print(test_letter())',
        expected:'pass',
        hint:'assert letter(90) == "A", then letter(89) == "B", letter(60) == "D", letter(59) == "F". Finish with return "pass".',
        solution:'def test_letter():\n    assert letter(90) == "A"\n    assert letter(89) == "B"\n    assert letter(60) == "D"\n    assert letter(59) == "F"\n    return "pass"' },
      { t:'code', task:'<b>Write it to survive the tests.</b> Implement <code>safe_average(nums)</code> — the harness attacks every edge case.',
        spec:'Empty list returns <code>0</code>. Everything else returns the mean. Think about what the tests will throw at you <i>before</i> you write it.',
        starter:'def safe_average(nums):\n    # empty, single item, negatives - all must work\n    pass\n',
        harness:'print(safe_average([2, 4, 6]))\nprint(safe_average([]))\nprint(safe_average([-2, 2]))\nprint(safe_average([5]))',
        expected:'4.0\n0\n0.0\n5.0',
        hint:'Guard the empty case, then sum/len. Note the empty case returns the integer 0 while the others return floats — that difference is exactly the kind of thing a test catches.',
        solution:'def safe_average(nums):\n    if not nums:\n        return 0\n    return sum(nums) / len(nums)' },
      { t:'code', task:'<b>TDD.</b> Here is a spec and its tests. Write <code>slugify(title)</code> to satisfy them.',
        spec:'Lowercase the title, collapse any run of whitespace to a single hyphen, and trim the ends. <code>"  Hello   World  "</code> becomes <code>"hello-world"</code>.',
        starter:'def slugify(title):\n    # lowercase, split on whitespace, join with hyphens\n    pass\n',
        harness:'print(slugify("Hello World"))\nprint(slugify("  Spaced   Out  "))\nprint(slugify(""))\nprint(slugify("ONE"))',
        expected:'hello-world\nspaced-out\n\none',
        hint:'"-".join(title.lower().split()) — bare .split() already collapses runs of whitespace and strips the ends, which handles all four cases at once.',
        solution:'def slugify(title):\n    return "-".join(title.lower().split())' }
    ]},

  /* ---- F7 ---- */
  { title:'Code Review', mon:'The Rubber Stamp', emoji:'\u{1F441}️',
    taunt:'"Looks good to me. Ship it."',
    lesson:[
      { h:'What a junior is really being tested on',
        p:['In a job, your code gets reviewed before it merges. How you handle that is watched at least as closely as the code itself.',
           'Reviews are also where you learn fastest. A senior engineer explaining why your approach breaks under load is worth a month of tutorials.'] },
      { h:'What reviewers look for, in order',
        p:[''],
        code:'1  Does it do what the PR says?\n2  Is it CORRECT at the edges? empty, null, zero, duplicates\n3  Does it break anything else?\n4  Security: injection, secrets, auth checks\n5  Performance: loops inside loops, queries inside loops\n6  Readability: will someone understand this in six months?\n7  Tests: is the new behaviour covered?\n8  Style: last, and usually automated anyway',
        note:'<b>Notice style is eighth.</b> Juniors reviewing code tend to comment only on naming and formatting because it is the easiest thing to see. Correctness at the edges is where the value is.' },
      { h:'How to receive a review',
        p:['<b>It is about the code, not you.</b> This sounds obvious and takes real practice to feel.',
           '<b>Ask rather than defend.</b> "Can you say more about why that breaks?" beats "it works fine on my machine."',
           '<b>Reply to every comment</b>, even if only to say "done" or "good catch". Silent resolves are irritating.',
           '<b>If you disagree, say so with reasoning.</b> Reviewers are wrong sometimes. "I chose X because Y — does that change it?" is a completely professional thing to say.'],
        note:'Hiring managers explicitly cite "responds to code review without becoming defensive" as something they screen for. It is a named skill, not a personality trait.' },
      { h:'How to give one',
        p:['You will review others\' code within weeks of starting.'],
        code:'GOOD\n  "This crashes if items is empty - line 12. Worth a guard?"\n  "Could pull this into a helper - it is repeated on line 40."\n  "nit: name could be clearer. Non-blocking."\n\nBAD\n  "This is wrong."\n  "Why did you do it this way?"      (reads as an accusation)\n  "Rewrite this."',
        note:'<b>Prefix trivia with "nit:"</b> — it signals "this is minor, do not let it block you". And ask questions rather than issue commands; you may be missing context.' },
      { h:'The classic review catches',
        p:['These four account for most real review comments:'],
        code:'· No empty/null guard on an input\n· A database query inside a loop  (the "N+1" problem)\n· String concatenation building SQL  (injection)\n· A magic number with no name  (if x > 86400: ...)' }
    ],
    encounters:[
      { t:'mcq', q:'Spot the problem in this diff.',
        code:'+ def get_user_names(user_ids):\n+     names = []\n+     for uid in user_ids:\n+         user = db.query("SELECT name FROM users WHERE id = ?", uid)\n+         names.append(user.name)\n+     return names',
        opts:['Bad naming','A database query inside a loop — the N+1 problem','Missing type hints','Should use a list comprehension'], a:1,
        why:'1,000 ids means 1,000 round trips to the database. One query with WHERE id IN (...) replaces all of them. This is the most common real performance bug in web apps.' },
      { t:'mcq', q:'Spot the problem in this diff.',
        code:'+ def find_user(name):\n+     sql = "SELECT * FROM users WHERE name = \'" + name + "\'"\n+     return db.execute(sql)',
        opts:['Should use double quotes','SQL injection — user input concatenated into the query','Too slow','Missing a return type'], a:1,

      { t:'mcq', q:'Spot the problem in this diff.',

  /* ---- F9 ---- */
  { title:'Algorithm Patterns', mon:'Brute Force', emoji:'\u{1F528}',
    taunt:'"Just check every possible pair. What could go wrong?"',
    lesson:[
      { h:'Interviews test patterns, not problems',
        p:['There are thousands of interview questions and roughly twenty underlying patterns. Learn the patterns and unseen problems become recognisable rather than terrifying.',
           'These five cover the overwhelming majority of what a junior gets asked.'] },
      { h:'Pattern 1 — hash map counting',
        p:['<b>Signal:</b> "how many", "duplicate", "anagram", "most frequent". <b>Move:</b> one pass into a dict or set. Turns O(n²) into O(n).'],
        code:'def has_duplicate(nums):\n    seen = set()\n    for n in nums:\n        if n in seen:\n            return True\n        seen.add(n)\n    return False' },
      { h:'Pattern 2 — two pointers',
        p:['<b>Signal:</b> a <i>sorted</i> array, or working inward from both ends — pairs, palindromes, in-place reversal. <b>Move:</b> one index at each end, move whichever helps.'],
        code:'def two_sum_sorted(nums, target):\n    left, right = 0, len(nums) - 1\n    while left < right:\n        total = nums[left] + nums[right]\n        if total == target:\n            return [left, right]\n        if total < target:\n            left += 1        # need bigger\n        else:\n            right -= 1       # need smaller\n    return []',
        note:'<b>Why it works:</b> because the array is sorted, moving left up can only increase the sum and moving right down can only decrease it. Each step eliminates a whole row of possibilities.' },
      { h:'Pattern 3 — sliding window',
        p:['<b>Signal:</b> "longest/shortest/max subarray or substring". <b>Move:</b> expand the right edge, and shrink from the left when the window becomes invalid.'],
        code:'def max_sum_window(nums, k):\n    window = sum(nums[:k])\n    best = window\n    for i in range(k, len(nums)):\n        window += nums[i] - nums[i - k]   # add new, drop old\n        best = max(best, window)\n    return best',
        note:'<b>The trick is not recomputing.</b> Naively summing every window is O(n × k); adding the entering element and subtracting the leaving one makes it O(n).' },
      { h:'Pattern 4 — binary search',
        p:['<b>Signal:</b> the data is sorted, or the answer space is monotonic. <b>Move:</b> halve the search space each step. O(log n) — a million items in twenty steps.'],
        code:'def binary_search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1',
        note:'<b>The two classic bugs:</b> <code>while lo < hi</code> instead of <code>&lt;=</code> (misses the last element), and forgetting the <code>+ 1</code>/<code>- 1</code> (infinite loop). Write it out by hand a few times.' },
      { h:'Pattern 5 — BFS and DFS',
        p:['<b>Signal:</b> trees, graphs, grids, "shortest path", "connected". <b>Move:</b> a queue explores level by level (BFS); a stack or recursion goes deep first (DFS).'],
        code:'from collections import deque\n\ndef bfs(graph, start):\n    seen = {start}\n    q = deque([start])\n    order = []\n    while q:\n        node = q.popleft()\n        order.append(node)\n        for nxt in graph[node]:\n            if nxt not in seen:\n                seen.add(nxt)\n                q.append(nxt)\n    return order',
        note:'<b>BFS for shortest path in an unweighted graph</b>, because it reaches everything at distance 1 before anything at distance 2. DFS for "does a path exist" and for exploring every branch.' },
      { h:'How to pick, live',
        p:['<b>Say the brute force out loud first.</b> "I could check every pair, that is O(n²)." This gets you credit immediately and buys thinking time.',
           'Then ask what would remove the repeated work: <i>Would knowing what I have already seen help?</i> → hash map. <i>Is it sorted?</i> → two pointers or binary search. <i>Is it a contiguous run?</i> → sliding window. <i>Is it connected things?</i> → BFS/DFS.'] }
    ],
    encounters:[
      { t:'mcq', q:'"Find the longest substring with no repeating characters." Which pattern?',
        opts:['Binary search','Sliding window','Two pointers on a sorted array','BFS'], a:1,
        why:'Contiguous substring plus longest/shortest is the sliding window signal.' },
      { t:'mcq', q:'"Given a SORTED array, find two numbers that sum to a target." Which pattern?',
        opts:['Hash map','Two pointers','Sliding window','Sorting again'], a:1,
        why:'Sorted plus finding a pair is the two-pointer signal, and it uses O(1) extra space versus a hash map\'s O(n).' },
      { t:'mcq', q:'"Find the shortest path between two nodes in an unweighted graph." Which pattern?',
        opts:['DFS','BFS','Binary search','Greedy'], a:1,
        why:'BFS explores by distance, so the first time it reaches the target is via the shortest path. DFS gives you a path, not the shortest.' },
      { t:'mcq', q:'Binary search on a million sorted items takes roughly how many steps?',
        opts:['1,000,000','1,000','20','100'], a:2,
        why:'log₂(1,000,000) ≈ 20. Halving is astonishingly powerful, which is why "is it sorted?" is always worth asking.' },
      { t:'mcq', q:'The interviewer asks a question you have never seen. Best first move?',
        opts:['Stay silent and think','Say the brute-force approach and its complexity out loud','Guess a clever trick','Ask for a different question'], a:1,
        why:'It earns immediate credit, gives you a working baseline, and buys thinking time. Silence is what actually sinks candidates.' },
      { t:'code', task:'<b>Two pointers.</b> Write <code>two_sum_sorted(nums, target)</code> returning the two indexes. The array is sorted.',
        starter:'def two_sum_sorted(nums, target):\n    # one pointer at each end\n    pass\n',
        harness:'print(two_sum_sorted([2, 7, 11, 15], 9))\nprint(two_sum_sorted([1, 2, 3, 4], 7))\nprint(two_sum_sorted([1, 2], 99))',
        expected:'[0, 1]\n[2, 3]\n[]',
        hint:'left = 0, right = len - 1. If the sum is too small move left up; too big, move right down; equal, return both.',
        solution:'def two_sum_sorted(nums, target):\n    left, right = 0, len(nums) - 1\n    while left < right:\n        total = nums[left] + nums[right]\n        if total == target:\n            return [left, right]\n        if total < target:\n            left += 1\n        else:\n            right -= 1\n    return []' },
      { t:'code', task:'<b>Sliding window.</b> Write <code>max_sum_window(nums, k)</code> returning the largest sum of any <code>k</code> consecutive numbers.',
        starter:'def max_sum_window(nums, k):\n    # do not recompute each window from scratch\n    pass\n',
        harness:'print(max_sum_window([1, 4, 2, 10, 2, 3, 1, 0, 20], 4))\nprint(max_sum_window([1, 2, 3], 3))\nprint(max_sum_window([5], 1))',
        expected:'24\n6\n5',
        hint:'Sum the first k. Then slide: window += nums[i] - nums[i - k]. Keep the best seen. O(n), not O(n × k).',
        solution:'def max_sum_window(nums, k):\n    window = sum(nums[:k])\n    best = window\n    for i in range(k, len(nums)):\n        window += nums[i] - nums[i - k]\n        best = max(best, window)\n    return best' },
      { t:'code', task:'<b>Binary search.</b> Write <code>binary_search(nums, target)</code> returning the index, or −1.',
        starter:'def binary_search(nums, target):\n    # halve the space each step\n    pass\n',
        harness:'print(binary_search([1, 3, 5, 7, 9], 7))\nprint(binary_search([1, 3, 5, 7, 9], 1))\nprint(binary_search([1, 3, 5, 7, 9], 4))\nprint(binary_search([], 1))',
        expected:'3\n0\n-1\n-1',
        hint:'lo, hi = 0, len(nums) - 1. Loop while lo <= hi — the <= matters, or you miss the final element. mid = (lo + hi) // 2.',
        solution:'def binary_search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1' }

  { title:'BOSS: The Most-Asked Problems', mon:'The Technical Screen', emoji:'\u{1F480}', boss:true,

        why:'Store what you have seen; for each number, check whether target − n is already in the map. Sorting would work but costs O(n log n) and loses the original indexes.' },
      { t:'code', task:'<b>Valid Parentheses.</b> Return True if every bracket is correctly opened and closed in order.',
        spec:'Handles <code>()</code>, <code>[]</code> and <code>{}</code>. <code>"([)]"</code> is invalid — order matters, not just counts.',
        starter:'def is_valid(s):\n    # a stack problem\n    pass\n',
        harness:'print(is_valid("()[]{}"))\nprint(is_valid("(]"))\nprint(is_valid("([)]"))\nprint(is_valid("{[]}"))\nprint(is_valid(""))\nprint(is_valid("("))',
        expected:'True\nFalse\nFalse\nTrue\nTrue\nFalse',
        hint:'Push openers onto a stack. On a closer, pop and check it matches — if the stack is empty, fail. At the end the stack must be empty. Use a dict {")": "(", "]": "[", "}": "{"}.',
        solution:'def is_valid(s):\n    pairs = {")": "(", "]": "[", "}": "{"}\n    stack = []\n    for ch in s:\n        if ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n        else:\n            stack.append(ch)\n    return len(stack) == 0' },
      { t:'code', task:'<b>Best Time to Buy and Sell Stock.</b> One buy, one later sell. Return the maximum profit, or 0.',
        spec:'One pass. Ask yourself: if I sell today, what is the best I could have bought at?',
        starter:'def max_profit(prices):\n    # track the cheapest price seen so far\n    pass\n',
        harness:'print(max_profit([7, 1, 5, 3, 6, 4]))\nprint(max_profit([7, 6, 4, 3, 1]))\nprint(max_profit([1, 2]))\nprint(max_profit([]))',
        expected:'5\n0\n1\n0',
        hint:'Keep cheapest = infinity and best = 0. For each price: update best with price - cheapest, then update cheapest. O(n), one pass.',
        solution:'def max_profit(prices):\n    cheapest = float("inf")\n    best = 0\n    for price in prices:\n        best = max(best, price - cheapest)\n        cheapest = min(cheapest, price)\n    return best' },
      { t:'code', task:'<b>Maximum Subarray.</b> Return the largest sum of any contiguous run. (Kadane\'s algorithm.)',
        spec:'The array can be all negative, in which case the answer is the least-negative single element.',
        starter:'def max_subarray(nums):\n    # at each step: extend the run, or start fresh here?\n    pass\n',

        expected:'6\n-1\n23\n-1',
        hint:'current = max(n, current + n) — the whole insight is "is the run so far helping me, or should I restart from here?" Track best separately. Start both at nums[0], not 0.',
        solution:'def max_subarray(nums):\n    current = best = nums[0]\n    for n in nums[1:]:\n        current = max(n, current + n)\n        best = max(best, current)\n    return best' },
      { t:'code', task:'<b>Longest Substring Without Repeating Characters.</b> Return its length.',
        spec:'Sliding window plus a set. When a repeat enters, shrink from the left until it is valid again.',
        starter:'def length_of_longest(s):\n    # window of unique characters\n    pass\n',
        harness:'print(length_of_longest("abcabcbb"))\nprint(length_of_longest("bbbbb"))\nprint(length_of_longest("pwwkew"))\nprint(length_of_longest(""))',
        expected:'3\n1\n3\n0',
        hint:'left = 0, seen = set(). For each right character: while it is in seen, remove s[left] and advance left. Then add it and update the best length.',
        solution:'def length_of_longest(s):\n    seen = set()\n    left = 0\n    best = 0\n    for right, ch in enumerate(s):\n        while ch in seen:\n            seen.remove(s[left])\n            left += 1\n        seen.add(ch)\n        best = max(best, right - left + 1)\n    return best' },
      { t:'code', task:'<b>Group Anagrams.</b> Group words that use the same letters.',
        spec:'Return groups sorted alphabetically inside, and the outer list sorted too, so the result is deterministic.',
        starter:'def group_anagrams(words):\n    # what do all anagrams of each other share?\n    pass\n',
        harness:'print(group_anagrams(["eat", "tea", "tan", "ate", "nat", "bat"]))\nprint(group_anagrams([]))\nprint(group_anagrams(["a"]))',
        expected:"[['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]\n[]\n[['a']]",
        hint:'The sorted letters make a key: "".join(sorted(word)). Group into a dict with setdefault, then sort each group and sort the outer list.',
        solution:'def group_anagrams(words):\n    groups = {}\n    for word in words:\n        key = "".join(sorted(word))\n        groups.setdefault(key, []).append(word)\n    return sorted(sorted(g) for g in groups.values())' },
      { t:'code', task:'<b>Merge Two Sorted Lists.</b> Combine two sorted lists into one sorted list.',
        spec:'Do it with two pointers in O(n + m). Concatenating and re-sorting is O(n log n) and will be marked down.',
        starter:'def merge_sorted(a, b):\n    # walk both with an index each\n    pass\n',
        harness:'print(merge_sorted([1, 3, 5], [2, 4, 6]))\nprint(merge_sorted([], [1, 2]))\nprint(merge_sorted([1], []))\nprint(merge_sorted([1, 1], [1]))',
        expected:'[1, 2, 3, 4, 5, 6]\n[1, 2]\n[1]\n[1, 1, 1]',
        hint:'i = j = 0. While both have items left, append the smaller and advance that index. Then append whatever remains of each with slicing.',
        solution:'def merge_sorted(a, b):\n    out = []\n    i = j = 0\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            out.append(a[i])\n            i += 1\n        else:\n            out.append(b[j])\n            j += 1\n    out.extend(a[i:])\n    out.extend(b[j:])\n    return out' }
    ]},

  { title:'APIs & HTTP', mon:'500 Internal Server Error', emoji:'\u{1F310}',
    taunt:'"Something went wrong. That is all you are getting."',
    lesson:[
      { h:'Every web app is this one loop',
        p:['A client sends a <b>request</b>. A server sends a <b>response</b>. That is the whole model, and understanding it properly separates people who can debug a web app from people who guess.'],
        code:'REQUEST                          RESPONSE\nGET /api/users/7 HTTP/1.1        200 OK\nHost: api.example.com            Content-Type: application/json\nAuthorization: Bearer eyJhb...\n                                 {"id": 7, "name": "Ada"}' },
      { h:'The methods',
        p:['<b>Idempotent</b> means doing it twice has the same effect as doing it once. It matters because networks fail and clients retry.'],
        code:'GET     read something          safe, idempotent\nPOST    create something        NOT idempotent - retry creates two\nPUT     replace something       idempotent\nPATCH   partially update        usually not\nDELETE  remove something        idempotent',
        note:'<b>This is a real interview question.</b> "Why is POST not idempotent?" — because a retried POST creates a second record. It is also why payment endpoints use idempotency keys.' },
      { h:'Status codes — learn these seven',
        p:['The first digit tells you who to blame: <b>2xx</b> worked, <b>3xx</b> moved, <b>4xx</b> the client got it wrong, <b>5xx</b> the server got it wrong.'],
        code:'200  OK                    it worked\n201  Created               POST succeeded, thing exists now\n400  Bad Request           your input was malformed\n401  Unauthorized          you are not logged in\n403  Forbidden             logged in, but not allowed\n404  Not Found             no such thing\n429  Too Many Requests     rate limited, back off\n500  Internal Server Error the server crashed - THEIR bug',
        note:'<b>401 vs 403 catches people out.</b> 401 = "who are you?" (authentication). 403 = "I know who you are, and no" (authorisation).' },
      { h:'What a REST API looks like',
        p:['Resources are nouns; the method is the verb. If your URLs contain verbs, it is not REST.'],
        code:'GET    /users          list them\nPOST   /users          create one\nGET    /users/7        fetch one\nPATCH  /users/7        update one\nDELETE /users/7        delete one\n\nGET /users?page=2&per_page=20&sort=name    filtering and paging\n\nBAD:  /getUser?id=7    /createNewUser    /deleteUserById' },
      { h:'Calling one, safely',
        p:['<b>Never assume it worked.</b> Check the status, handle the failure, and set a timeout — a request with no timeout can hang forever and take your app down with it.'],
        code:'import requests\n\nresp = requests.get(\n    "https://api.example.com/users/7",\n    headers={"Authorization": f"Bearer {token}"},\n    timeout=10,\n)\n\nif resp.status_code == 200:\n    data = resp.json()\nelif resp.status_code == 404:\n    data = None\nelse:\n    resp.raise_for_status()',
        note:'<b>Exponential backoff</b> is the standard retry policy: wait 1s, then 2, 4, 8. Retrying immediately in a tight loop turns a small outage into an outage you caused.' },
      { h:'Where the keys go',
        p:['API keys go in environment variables. Never in the code, never in the repo, never in the frontend bundle.'],
        code:'import os\n\nAPI_KEY = os.environ["STRIPE_KEY"]     # crashes loudly if missing - good\nAPI_KEY = os.getenv("STRIPE_KEY", "")  # fails silently later - bad\n\n# locally: put it in .env, and put .env in .gitignore\n# in production: set it in your host\'s dashboard' }

    encounters:[

        why:'5xx means the server failed. 4xx means the client (you) sent something wrong. The first digit tells you where to look.' },
      { t:'mcq', q:'What is the difference between 401 and 403?',
        opts:['They are the same','401 = not authenticated; 403 = authenticated but not permitted','401 is for GET only','403 means the server is down'], a:1,

      { t:'mcq', q:'Why is POST not idempotent?',
        opts:['It is slower','Sending it twice creates two records','It cannot be cached','It has no body'], a:1,
        why:'Which is why a flaky network plus an automatic retry can double-charge a customer — and why payment APIs use idempotency keys.' },
      { t:'mcq', q:'Which URL is properly RESTful?',
        opts:['GET /getUserById?id=7','POST /createUser','GET /users/7','GET /deleteUser/7'], a:2,

      { t:'mcq', q:'A request to a third-party API hangs. What did you forget?',
        opts:['A timeout','A semicolon','To import json','Authentication'], a:0,

      { t:'code', task:'Write <code>get_user_name(payload)</code> pulling <code>user.name</code> out of a JSON string, returning "unknown" if anything is missing.',

        hint:'data = json.loads(payload), then data.get("user", {}).get("name", "unknown"). Chaining .get with a {} default handles both missing levels.',
        solution:'import json\n\n\ndef get_user_name(payload):\n    data = json.loads(payload)\n    return data.get("user", {}).get("name", "unknown")' },
      { t:'code', task:'Write <code>build_response(data, status)</code> returning an API response dict with an <code>ok</code> flag.',
        spec:'<code>ok</code> is True for any 2xx status. Default the status to 200.',
        starter:'def build_response(data, status=200):\n    pass\n',

        expected:"{'status': 200, 'ok': True, 'body': {'id': 1}}\n{'status': 404, 'ok': False, 'body': None}\n{'status': 201, 'ok': True, 'body': 'created'}",
        hint:'"ok": 200 <= status < 300 — Python lets you chain comparisons like that.',
        solution:'def build_response(data, status=200):\n    return {\n        "status": status,\n        "ok": 200 <= status < 300,\n        "body": data,\n    }' },
      { t:'code', task:'Write <code>backoff_delays(attempts, base=1)</code> returning the exponential backoff wait times.',
        spec:'Four attempts at base 1 gives <code>[1, 2, 4, 8]</code>. This is the standard retry policy for every real API client.',
        starter:'def backoff_delays(attempts, base=1):\n    pass\n',
        harness:'print(backoff_delays(4))\nprint(backoff_delays(3, base=2))\nprint(backoff_delays(0))',

  /* ---- Backend ---- */
  { title:'Backend: Build a Real API', mon:'The Bare Socket', emoji:'\u{1F5A5}️',
    taunt:'"No routing. No parsing. No validation. Write it all yourself."',
    lesson:[
      { h:'What a framework gives you',
        p:['You could write a web server from raw sockets. Nobody does, because a framework hands you routing, request parsing, validation, serialisation, error handling and auto-generated docs for free.',
           'The examples here use <b>FastAPI</b> — the modern Python default, and the easiest to be productive in fast. Flask and Django work the same way conceptually.'],
        code:'pip install "fastapi[standard]"\nfastapi dev main.py      # runs it, with live reload' },
      { h:'The anatomy of an endpoint',
        p:['A decorator binds a URL and a method to a function. Everything else is normal Python.'],
        code:'from fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get("/users/{user_id}")           # path parameter\ndef get_user(user_id: int, verbose: bool = False):\n    #                        └── query parameter, ?verbose=true\n    return {"id": user_id, "verbose": verbose}',
        note:'<b>Those type hints are doing real work.</b> FastAPI reads them and converts and validates automatically — <code>/users/abc</code> returns a 422 with a clear message before your function ever runs. It also generates interactive docs at <code>/docs</code> for free.' },
      { h:'Validation at the boundary',
        p:['Define the shape of the data once, and let it be enforced at the edge of your system. Bad data never gets inside.'],
        code:'from pydantic import BaseModel, EmailStr, Field\n\nclass UserIn(BaseModel):\n    email: EmailStr\n    name: str = Field(min_length=1, max_length=50)\n    age: int = Field(ge=0, le=150)\n\n@app.post("/users", status_code=201)\ndef create_user(user: UserIn):\n    return save(user)',
        note:'<b>Validate at the boundary, trust inside.</b> The alternative — checking values in twelve places deep in your code — is how bugs happen. And a 201 for a successful POST rather than 200 is the kind of detail reviewers notice.' },
      { h:'Talking to a database',
        p:['An <b>ORM</b> maps rows to objects so you write Python instead of SQL strings. A <b>migration</b> is a versioned, committed change to the schema, so every environment can be brought to the same state.'],
        code:'# SQLAlchemy model\nclass User(Base):\n    __tablename__ = "users"\n    id = Column(Integer, primary_key=True)\n    email = Column(String, unique=True, index=True)\n\n# migration - generated, reviewed, committed\nalembic revision --autogenerate -m "add users table"\nalembic upgrade head',
        note:'<b>Never change a production schema by hand.</b> Migrations are code, they live in Git, and they are how you avoid "it works on staging". And your SQL knowledge still matters — an ORM makes the N+1 problem <i>easier</i> to cause, not harder.' },
      { h:'Auth, in outline',
        p:['You will use a library. Know the shape anyway, because it is a standard interview question.'],
        code:'1  POST /register  -> hash the password (bcrypt/argon2), store the user\n2  POST /login     -> verify the hash, issue a token or session\n3  every request   -> client sends the token in an Authorization header\n4  middleware      -> verify it, attach the user, or return 401\n5  the endpoint    -> checks permissions, or returns 403',
        note:'<b>Sessions vs JWTs</b> is the follow-up question. Sessions live server-side and can be revoked instantly. JWTs are stateless and scale better, but you cannot un-issue one before it expires. "It depends on whether I need instant revocation" is the right answer.' },

        code:'@app.___("/users/{user_id}")\ndef get_user(user_id: int):\n    ...', answers:['get'],
        why:'The decorator binds an HTTP method and a path to your function. @app.post, @app.patch and so on follow the same shape.' },
      { t:'mcq', q:'Why declare request bodies with a Pydantic model?',
        opts:['It is faster','Bad data is rejected at the boundary with a clear 422, before your code runs','It saves memory','It is required by Python'], a:1,

      { t:'code', task:'Implement the routing itself. Write <code>parse_path(url, pattern)</code> returning the extracted parameters, or <code>None</code> if it does not match.',
        spec:'<code>parse_path("/users/7", "/users/{id}")</code> gives <code>{"id": "7"}</code>. A pattern with no placeholders that matches gives an empty dict.',
        starter:'def parse_path(url, pattern):\n    # split both on "/", compare segment by segment\n    pass\n',
        harness:'print(parse_path("/users/7", "/users/{id}"))\nprint(parse_path("/users", "/users/{id}"))\nprint(parse_path("/a/b", "/a/b"))\nprint(parse_path("/users/7/posts/3", "/users/{uid}/posts/{pid}"))',
        expected:"{'id': '7'}\nNone\n{}\n{'uid': '7', 'pid': '3'}",
        hint:'Split both by "/". If the lengths differ, return None. Walk them in pairs with zip: if the pattern segment starts with "{", record it as a parameter; otherwise it must match exactly or you return None.',
        solution:'def parse_path(url, pattern):\n    url_parts = url.split("/")\n    pat_parts = pattern.split("/")\n    if len(url_parts) != len(pat_parts):\n        return None\n    params = {}\n    for u, p in zip(url_parts, pat_parts):\n        if p.startswith("{") and p.endswith("}"):\n            params[p[1:-1]] = u\n        elif u != p:\n            return None\n    return params' },

        expected:"[]\n['email is invalid']\n['email is required', 'age must be non-negative']\n['email is required', 'age is required']",
        hint:'Check presence first with "not in payload", then validity. Appending to an errors list and returning them all at once is much better UX than raising on the first problem.',
        solution:'def validate_user(payload):\n    errors = []\n    if "email" not in payload:\n        errors.append("email is required")\n    elif "@" not in payload["email"]:\n        errors.append("email is invalid")\n    if "age" not in payload:\n        errors.append("age is required")\n    elif payload["age"] < 0:\n        errors.append("age must be non-negative")\n    return errors' },
      { t:'code', task:'Write <code>serialize_user(row)</code> returning the record safe to send to a client.',
        spec:'Strip anything sensitive. Never let a password hash leave your server — this is a real breach vector, not a hypothetical.',
        starter:'SECRET_FIELDS = {"password_hash", "reset_token"}\n\n\ndef serialize_user(row):\n    pass\n',
        harness:'print(serialize_user({"id": 1, "name": "Ada", "email": "a@b.com", "password_hash": "x"}))\nprint(serialize_user({"id": 2, "name": "Taj", "reset_token": "abc"}))',
        expected:"{'id': 1, 'name': 'Ada', 'email': 'a@b.com'}\n{'id': 2, 'name': 'Taj'}",
        hint:'A dict comprehension: {k: v for k, v in row.items() if k not in SECRET_FIELDS}. Allow-listing the fields you want is even safer than blocking the ones you do not.',
        solution:'SECRET_FIELDS = {"password_hash", "reset_token"}\n\n\ndef serialize_user(row):\n    return {k: v for k, v in row.items() if k not in SECRET_FIELDS}' }
