/* ==========================================================================
   FLASHCARDS — spaced repetition, built automatically from cleared floors.
   Free recall only: no options shown, so you cannot pattern-match an answer.
   ========================================================================== */
const doneFor=(lang,z,e)=>!!S.done[lang+':'+z+':'+e];
const zoneDoneFor=(lang,z)=>CONTENT[lang].zones[z].encounters.every((_,i)=>doneFor(lang,z,i));
const dayNow=()=>Math.floor(Date.now()/86400000);
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }

function buildDeck(opts){
  opts=opts||{};
  const cards=[];
  Object.keys(CONTENT).forEach(lang=>{
    if(opts.lang && lang!==opts.lang) return;            // cram mode: one track only
    const C=CONTENT[lang];
    C.zones.forEach((z,zi)=>{
      if(!opts.all && !zoneDoneFor(lang,zi)) return;     // normally: only floors you have beaten
      const where=C.name+' · Floor '+(zi+1)+' · '+z.title;
      (z.lesson||[]).forEach((p,pi)=>{
        if(!p.note) return;
        /* Most notes are written as "<b>The one-line rule.</b> rest of the explanation."
           Use that structure for a real cloze card: show the explanation, hide the rule,
           ask the player to state the rule before revealing. Notes that don't fit the
           pattern fall back to the old generic prompt rather than breaking. */
        const m=/^\s*<b>([^<]+?)<\/b>\s*([\s\S]*)$/.exec(p.note||'');
        const front = (m && m[2].trim())
          ? '<h2>'+p.h+'</h2><div class="note" style="opacity:.8">'+m[2]+'</div>'+
            '<p class="sub">What\'s the one-line rule this is teaching? Say it before revealing.</p>'
          : '<h2>'+p.h+'</h2><p class="sub">What is the key thing to remember here? Say it out loud before revealing.</p>';
        cards.push({ id:lang+'|n|'+zi+'|'+pi, where, tag:'concept',
          front, back:'<div class="note">'+p.note+'</div>' });
      });
      z.encounters.forEach((e,ei)=>{
        if(e.t==='mcq'){
          /* "Which of these..." questions ARE the options — the candidates are the substance
             of the question, not just answer choices to something self-contained. Stripping
             them (like we do for "what does this print?") leaves nothing to answer. Show them,
             shuffled, without marking which is correct. */
          const bareQ=String(e.q).replace(/<[^>]*>/g,'');
          const isWhich=/^\s*which\b/i.test(bareQ);
          if(isWhich){
            const order=shuffle(e.opts.map((_,i)=>i));
            cards.push({ id:lang+'|q|'+zi+'|'+ei, where, tag:'recall',
              front:'<h2>'+e.q+'</h2>'+(e.code?'<pre><code>'+esc(e.code)+'</code></pre>':'')+
                    '<ol class="sub" style="padding-left:20px;margin:8px 0">'+order.map(i=>'<li>'+e.opts[i]+'</li>').join('')+'</ol>'+
                    '<p class="sub">Pick the one that fits, then reveal to check.</p>',
              back:'<p class="ok" style="font-size:17px"><b>'+e.opts[e.a]+'</b></p><p class="sub">'+e.why+'</p>' });
          } else {
            cards.push({ id:lang+'|q|'+zi+'|'+ei, where, tag:'recall',
              front:'<h2>'+e.q+'</h2>'+(e.code?'<pre><code>'+esc(e.code)+'</code></pre>':'')+
                    '<p class="sub">No options. Answer from memory.</p>',
              back:'<p class="ok" style="font-size:17px"><b>'+e.opts[e.a]+'</b></p><p class="sub">'+e.why+'</p>' });
          }
        } else if(e.t==='fill'){
          cards.push({ id:lang+'|f|'+zi+'|'+ei, where, tag:'recall',
            blank:true, code:e.code, answers:e.answers,
            front:'<h2>'+e.q+'</h2>',
            back:'<p class="ok" style="font-size:17px"><b>'+esc(e.answers[0])+'</b></p><p class="sub">'+e.why+'</p>' });
        } else if((e.t==='code'||e.t==='sql')&&e.solution){
          /* "Fix"/"Complete" tasks hand you real starting code — a fresh blank box under
             "write this from memory" asks you to reproduce boilerplate that was never the
             point, and mislabels the exercise. Preload the actual starter, same as the
             floor itself does, and word the prompt to match what's actually being asked. */
          const bareTask=String(e.task).replace(/<[^>]*>/g,'');
          const isFix=/\bfix\b/i.test(bareTask);
          const starter=e.starter||'';
          cards.push({ id:lang+'|c|'+zi+'|'+ei, where, tag:'write it',
            write:true, lang, isSQL:(e.t==='sql'||lang==='sql'), starter,
            harness:e.harness||'', expected:e.expected, ordered:e.ordered, match:e.match,
            front:'<h2>'+(isFix?'Fix it from memory':(starter.trim()?'Complete it from memory':'Write this from memory'))+'</h2><p>'+e.task+'</p>'+
                  (e.spec?'<div class="note">'+e.spec+'</div>':'')+
                  '<p class="sub">'+(starter.trim()?'The starting code is loaded below. ':'')+
                  (isFix?'Fix it, then run.':(starter.trim()?'Complete it, then run.':'Write it, then run.'))+
                  ' Recognising a solution is not the same as being able to produce one.</p>',
            back:'<pre><code>'+esc(e.solution)+'</code></pre>' });
        } else if(e.t==='do'&&e.cmds&&e.cmds.length){
          const pick=e.cmds[0];
          cards.push({ id:lang+'|d|'+zi+'|'+ei, where, tag:'command',
            front:'<h2>'+e.task+'</h2><p class="sub">What is the command for: <b>'+pick[1]+'</b>?</p>',
            back:'<pre><code>'+esc(pick[0])+'</code></pre>' });
        }
      });
    });
  });
  return cards;
}

function srsGrade(id,g){
  S.srs=S.srs||{};
  const s=S.srs[id]||{ef:2.5,iv:0,reps:0};
  if(g===0){ s.reps=0; s.iv=0; s.ef=Math.max(1.3,s.ef-0.2); }
  else if(g===1){ s.reps++; s.ef=Math.max(1.3,s.ef-0.15); s.iv=s.iv<=1?1:Math.round(s.iv*1.2); }
  else if(g===2){ s.reps++; s.iv=s.iv===0?1:(s.iv===1?3:Math.round(s.iv*s.ef)); }
  else { s.reps++; s.ef=Math.min(3.0,s.ef+0.15); s.iv=s.iv===0?2:Math.round(s.iv*s.ef*1.3); }
  s.due=dayNow()+s.iv;
  S.srs[id]=s; save();
  return s;
}
function dueCount(){
  const deck=buildDeck(), srs=S.srs||{}, d=dayNow();
  return deck.filter(c=>!srs[c.id]||srs[c.id].due<=d).length;
}

let CARDQ=null, CARDI=0, CARDDONE=0, CRAM=false;
function startCards(){
  CRAM=false;
  const deck=buildDeck(), srs=S.srs||{}, d=dayNow();
  const due=shuffle(deck.filter(c=>srs[c.id]&&srs[c.id].due<=d));
  const fresh=shuffle(deck.filter(c=>!srs[c.id])).slice(0,12);
  CARDQ=shuffle(due.concat(fresh)).slice(0,25);
  CARDI=0; CARDDONE=0;
  S.view='cards'; save(); render(); window.scrollTo(0,0);
}
/* CRAM MODE — every card in this track, cleared or not. For the night before. */
function startCram(){
  CRAM=true;
  CARDQ=shuffle(buildDeck({all:true, lang:S.lang})).slice(0,60);
  CARDI=0; CARDDONE=0;
  S.view='cards'; save(); render(); window.scrollTo(0,0);
  toast('⚡ Cram mode — every card in this track, shuffled.');
}

function renderCards(v){
  const deck=CRAM?CARDQ:buildDeck();
  if(!deck||!deck.length){
    v.appendChild(el('div','card','<h2>\u{1F5C3}️ Flashcards</h2>'+
      '<p class="sub">Nothing scheduled yet. Normal flashcards come from floors you have <b>fully cleared</b>, across every track.</p>'+
      '<div class="note"><b>Got an exam? Use Cram mode.</b> It pulls <i>every</i> card in the current track whether you have cleared the floor or not, shuffled, free-recall. That is the fastest way to revise something you have not played through yet.</div>'));
    const r=el('div','row');
    const c=el('button','primary','⚡ Cram this track'); c.onclick=startCram;
    const m=el('button','ghost','← Back to map'); m.onclick=goMap;
    r.append(c,m); v.appendChild(r);
    return;
  }
  if(!CARDQ){ startCards(); return; }
  if(CARDI>=CARDQ.length){
    v.appendChild(el('div','card',
      '<div style="font-size:46px;text-align:center">\u{1F9E0}</div>'+
      '<h2 style="text-align:center">Session complete</h2>'+
      '<p class="sub" style="text-align:center">'+CARDDONE+' cards reviewed.<br>'+
      'Cards you found hard come back sooner. Ones you knew cold come back in days or weeks.</p>'+
      '<p class="sub" style="text-align:center">'+dueCount()+' cards due right now · '+deck.length+' in the deck total.</p>'));
    const r=el('div','row'); r.style.justifyContent='center';
    const again=el('button','primary','Study more'); again.onclick=startCards;
    const m=el('button','ghost','Map'); m.onclick=goMap;
    r.append(again,m); v.appendChild(r);
    return;
  }

  const c=CARDQ[CARDI];
  const s=(S.srs||{})[c.id];
  const head=el('div','card',
    '<div class="sub">\u{1F5C3}️ FLASHCARD '+(CARDI+1)+' of '+CARDQ.length+
    ' · <span class="chip">'+c.tag+'</span> '+(s?'<span class="chip">seen '+s.reps+'×</span>':'<span class="chip">new</span>')+'</div>'+
    '<div class="sub" style="margin-top:4px">'+c.where+'</div>');
  v.appendChild(head);

  const card=el('div','card'); card.innerHTML=c.front;
  v.appendChild(card);

  /* fill-in-the-blank cards get an inline input you can actually type in */
  let blankInp=null;
  if(c.blank){
    const parts=String(c.code).split('___');
    const pre=el('pre');
    pre.appendChild(document.createTextNode(parts[0]));
    blankInp=noAutoFix(el('input')); blankInp.className='blank'; blankInp.placeholder='?';
    pre.appendChild(blankInp);
    pre.appendChild(document.createTextNode(parts[1]||''));
    card.appendChild(pre);
    const bres=el('div'); card.appendChild(bres);
    const check=()=>{
      const val=blankInp.value.trim().toLowerCase();
      if(!val) return;
      const ok=(c.answers||[]).map(a=>String(a).toLowerCase()).includes(val);
      bres.innerHTML = ok
        ? '<p class="ok" style="margin-bottom:0">✓ That is it. Reveal to check the reasoning.</p>'
        : '<p class="no" style="margin-bottom:0">✗ Not that one. Try again, or reveal.</p>';
    };
    blankInp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); check(); } });
    card.appendChild(el('p','sub','Type your answer and press <span class="kbd">Enter</span> to check it.'));
    setTimeout(()=>blankInp.focus(),60);
  }

  /* "write it" cards get a real editor that runs your answer */
  let ta=null, out=null, runBtn=null;
  if(c.write){
    ta=el('textarea'); ta.spellcheck=false; ta.style.minHeight='170px';
    ta.placeholder = c.isSQL ? 'SELECT ...' : 'write it from memory, then Run & check';
    if(c.starter && c.starter.trim()) ta.value=c.starter;
    ta.addEventListener('keydown',ev=>{
      if(ev.key==='Tab'){ ev.preventDefault();
        const p=ta.selectionStart, ind=c.isSQL?'  ':((CONTENT[c.lang]&&CONTENT[c.lang].indent)||'  ');
        ta.value=ta.value.slice(0,p)+ind+ta.value.slice(ta.selectionEnd);
        ta.selectionStart=ta.selectionEnd=p+ind.length;
      }
      if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){ ev.preventDefault(); if(runBtn) runBtn.click(); }
    });
    card.appendChild(ta);
    attachCodeBar(ta, c.lang, card);
    if(c.isSQL) card.appendChild(el('p','sub','Tables: <code>employees(id, name, dept, salary, years, manager_id)</code> · <code>sales(id, emp_id, amount, region, bonus)</code>'));
    else if(c.harness) card.appendChild(el('p','sub','Tested with:<br><code>'+esc(c.harness).replace(/\n/g,'<br>')+'</code>'));
    card.appendChild(el('p','sub','<span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to run'));
    out=el('div'); out.style.display='none'; card.appendChild(out);

    runBtn=el('button','primary','▶ Run &amp; check');
    runBtn.onclick=async()=>{
      if(!ta.value.trim()){ toast('Write something first — that is the whole exercise.'); return; }
      runBtn.disabled=true; runBtn.textContent='Running...';
      out.style.display='block';
      out.innerHTML='<p class="sub">Running'+engineWarmingFor(c.lang)+'...</p>';
      try{
        let pass, body;
        if(c.isSQL){
          const r=await runSQL(ta.value);
          pass=sameRows(r.rows,c.expected,c.ordered);
          body='<div class="outlbl">your result</div>'+tableHTML(r.cols,r.rows);
        } else {
          const got=(await runCodeFor(c.lang, ta.value+'\n'+(c.harness||''))).trim();
          pass = c.match ? new RegExp(c.match,'m').test(got) : (got===String(c.expected).trim());
          body='<div class="split"><div><div class="outlbl">your output</div><pre'+(pass?' class="out"':'')+'><code>'+
               (esc(got)||'<i style="color:#8598b3">(nothing printed)</i>')+'</code></pre></div>'+
               '<div><div class="outlbl">expected</div><pre><code>'+esc(c.expected)+'</code></pre></div></div>';
        }
        out.innerHTML=(pass
          ? '<p class="ok" style="margin-top:0;font-size:16px">✓ Correct — and you produced it from memory, which is the point.</p>'
          : '<p class="no" style="margin-top:0">✗ Not matching yet. Adjust and run again, or reveal and grade yourself honestly.</p>')+body;
      }catch(err){
        out.innerHTML='<p class="no" style="margin-top:0">\u{1F4A5} '+esc(String(err&&err.message||err))+'</p>'+
          '<p class="sub">An error still counts as an attempt. Fix it, or reveal and mark it Again.</p>';
      }
      runBtn.disabled=false; runBtn.innerHTML='▶ Run &amp; check';
    };
  }

  const back=el('div'); v.appendChild(back);
  const row=el('div','row');
  if(runBtn) row.appendChild(runBtn);
  const show=el('button', c.write?'ghost':'primary', 'Show answer');
  show.onclick=()=>{
    show.remove();
    if(runBtn) runBtn.remove();
    if(ta) ta.disabled=true;
    if(blankInp) blankInp.disabled=true;
    const attempt = (ta && ta.value.trim())
      ? '<div class="card"><div class="outlbl">what you wrote</div><pre><code>'+esc(ta.value.trim())+'</code></pre></div>'
      : '';
    back.innerHTML=attempt+'<div class="card"><div class="outlbl">answer</div>'+c.back+'</div>';
    const g=el('div','card','<p class="sub" style="margin-top:0">How did that go? Be honest — grading yourself generously just means you see it less often.</p>');
    const gr=el('div','row');
    [['Again','0','var(--bad)','see it again this session'],
     ['Hard','1','var(--warn)','soon'],
     ['Good','2','var(--acc)','normal'],
     ['Easy','3','var(--acc2)','much later']].forEach(([label,grade,col,note])=>{
      const b=el('button','', '<b>'+label+'</b><br><span class="sub" style="font-size:11px">'+note+'</span>');
      b.style.borderColor=col; b.style.color=col; b.style.textAlign='center'; b.style.flex='1';
      b.onclick=()=>{
        const st=srsGrade(c.id, Number(grade));
        CARDDONE++;
        if(Number(grade)===0){ CARDQ.push(c); }        // requeue at the end of this session
        else { addXP(4); }
        CARDI++; sfx.page(); render(); window.scrollTo(0,0);
        if(st.iv>=1&&Number(grade)>0) toast('Next in '+st.iv+' day'+(st.iv===1?'':'s'));
      };
      gr.appendChild(b);
    });
    g.appendChild(gr); back.appendChild(g);
  };
  row.appendChild(show);
  const skip=el('button','ghost','Skip'); skip.onclick=()=>{ CARDI++; render(); };
  const m=el('button','ghost','End session'); m.onclick=goMap;
  row.append(skip,m); v.appendChild(row);
}

/* ==========================================================================
   GLOSSARY — every term the lessons use, in plain English.
   Auto-detected in lesson text: dotted underline = click for a definition.
   ========================================================================== */
const GLOSSARY=[
/* --- the absolute basics --- */
{t:'program',a:['programs'],d:'A list of instructions for a computer, written in a language it can be made to understand.'},
{t:'source code',a:['code','sourcecode'],d:'The text you write. It is just a text file — the special part is that a program can turn it into instructions a machine runs.'},
{t:'syntax',d:'The grammar rules of a language. Break them and the language refuses to run your code at all, the same way a missing bracket breaks a maths expression.'},
{t:'statement',a:['statements'],d:'One complete instruction. Usually one line, like "store 5 in x" or "print this".'},
{t:'expression',a:['expressions'],d:'Any piece of code that produces a value. "2 + 3" is an expression; its value is 5.'},
{t:'variable',a:['variables'],d:'A name you attach to a value so you can use it later. Think of a labelled box you put something in.'},
{t:'value',a:['values'],d:'An actual piece of data: the number 5, the text "hello", true or false.'},
{t:'type',a:['types','data type'],d:'What kind of thing a value is — a whole number, a decimal, text, true/false. The type decides what you are allowed to do with it.'},
{t:'function',a:['functions'],d:'A named set of steps you can run whenever you want, instead of writing them out again each time.'},
{t:'argument',a:['arguments'],d:'A value you hand to a function when you run it. In print("hi"), the argument is "hi".'},
{t:'parameter',a:['parameters'],d:'The name a function uses for a value it is given. The empty slot; the argument is what you put in it.'},
{t:'return',a:['returns','returning','return value'],d:'What a function hands back to whoever ran it, so the answer can be stored and used.'},
{t:'call',a:['calls','calling','called'],d:'To run a function. Writing add(2, 3) is calling add.'},
{t:'loop',a:['loops','looping'],d:'Code that repeats. Instead of writing the same line 100 times, you write it once inside a loop.'},
{t:'condition',a:['conditions','conditional'],d:'A question with a true/false answer, used to decide whether some code runs.'},
{t:'boolean',a:['booleans','bool'],d:'A value that is either true or false. Nothing else.'},
{t:'string',a:['strings'],d:'Text. Called a string because it is a string of characters. Usually written inside quotes.'},
{t:'integer',a:['integers','int'],d:'A whole number, with no decimal part. 5, 0, −12.'},
{t:'float',a:['floats','floating point','double'],d:'A number with a decimal part, like 3.5. Stored approximately, which is why 0.1 + 0.2 is not exactly 0.3.'},
{t:'comment',a:['comments'],d:'A note in your code that the computer ignores completely. It exists purely for humans reading it later — usually you.'},
{t:'output',d:'Whatever your program shows or produces. Usually text printed to the screen.'},
{t:'input',d:'Whatever your program is given to work with — typed by a user, read from a file, or fetched over a network.'},
{t:'run',a:['running','execute','executed','execution'],d:'To make the computer actually carry out your instructions.'},
{t:'bug',a:['bugs'],d:'A mistake in code that makes it behave wrongly. Named after a real moth found in a computer in 1947.'},
{t:'debug',a:['debugging','debugger'],d:'Finding and fixing bugs. A debugger is a tool that pauses your program so you can look inside while it runs.'},
{t:'error',a:['errors'],d:'The language telling you it cannot do what you asked, and usually exactly why. Errors are help, not failure.'},
{t:'runtime',d:'While the program is actually running, as opposed to while it is being written or prepared.'},
{t:'console',a:['standard output','stdout'],d:'The plain text window where a program prints its output. On your machine that is the terminal.'},
{t:'terminal',a:['command line','shell'],d:'A text window where you type commands instead of clicking buttons. Every professional tool is driven from here.'},
{t:'library',a:['libraries'],d:'Code someone else wrote that you can use instead of writing it yourself.'},
{t:'import',a:['imports','importing','include','includes'],d:'Telling your file that you want to use code from somewhere else — another file or a library.'},
{t:'module',a:['modules','package','packages'],d:'A file or bundle of code you can import. A package is usually a bundle of modules distributed together.'},
{t:'IDE',a:['editor','code editor'],d:'The program you write code in. VS Code is one. It adds highlighting, autocomplete and a debugger on top of a plain text editor.'},

/* --- how code gets run --- */
{t:'compile',a:['compiled','compiling','compiler','compilation'],d:'Translating your whole source file into machine instructions ahead of time, before anything runs. C++ works this way.'},
{t:'interpret',a:['interpreted','interpreter'],d:'Reading and running your code line by line as it goes, with no separate translation step. Python and JavaScript work this way.'},
{t:'compile-time',a:['compile time'],d:'Things that happen while your code is being translated, before it runs. Errors caught here are caught before a user ever sees them.'},
{t:'machine code',a:['binary','executable'],d:'The raw numeric instructions a processor actually understands. Nobody writes this by hand any more.'},
{t:'linker',a:['linking','link'],d:'The step that joins your separately compiled pieces into one finished program. "Undefined reference" means it could not find something it was told existed.'},
{t:'preprocessor',a:['preprocessor directive','directive'],d:'A step that edits your source text before compiling — mostly pasting in other files. In C++ every line starting with # is one of these.'},
{t:'header',a:['headers','header file'],d:'A C++ file that lists what exists — function names and shapes — without the code that implements them. Other files include it so they know what is available.'},
{t:'declaration',a:['declare','declared','declaring'],d:'Announcing that something exists and what shape it has, without saying what it does.'},
{t:'definition',a:['define','defined'],d:'Actually providing the thing — the body of a function, the contents of a variable.'},
{t:'namespace',a:['namespaces'],d:'A named container for names, so two libraries can both have a function called "sort" without colliding. std is the C++ standard library namespace.'},
{t:'stream',a:['streams'],d:'A flow of data you write to or read from — the screen, a file, a network connection. C++ uses cout as the stream for screen output.'},
{t:'buffer',a:['buffers','buffered','flush'],d:'A holding area for data on its way somewhere. Output is collected in a buffer and sent in batches because that is faster. Flushing means sending it now.'},

/* --- data and structure --- */
{t:'array',a:['arrays'],d:'A numbered row of values stored together. Position 0 is the first one.'},
{t:'list',a:['lists'],d:'An ordered collection of values you can add to and remove from. Python calls it a list; C++ and JavaScript usually say array or vector.'},
{t:'index',a:['indexes','indices','indexing'],d:'The position number of an item in a list. In almost every language the first item is at index 0 — R is the odd one out and starts at 1.'},
{t:'element',a:['elements','item','items'],d:'One of the values inside a list or array.'},
{t:'iterate',a:['iterating','iteration','traverse'],d:'To go through a collection one item at a time.'},
{t:'dictionary',a:['dictionaries','hash map','hashmap','map','associative array'],d:'A collection that looks things up by name instead of by position — like a real dictionary, where you look up a word rather than "entry number 4,812".'},
{t:'key',a:['keys'],d:'The name you look something up by in a dictionary.'},
{t:'set',a:['sets'],d:'A collection with no duplicates and no order, useful for answering "have I seen this before?" instantly.'},
{t:'tuple',a:['tuples'],d:'A small fixed group of values that belong together and cannot be changed afterwards, like a pair of coordinates.'},
{t:'stack',a:['stacks'],d:'A pile where you can only take from the top: last in, first out. Used for anything nested, like matching brackets or an undo history.'},
{t:'queue',a:['queues'],d:'A line where the first thing in is the first thing out, like queuing for a till.'},
{t:'linked list',d:'A chain where each item holds the address of the next. Easy to insert into, but you cannot jump straight to item 500 — you must walk there.'},
{t:'tree',a:['trees','binary tree'],d:'A branching structure where each item can have children. Folders inside folders are a tree.'},
{t:'node',a:['nodes'],d:'One item in a tree or linked list, along with the links to whatever comes next.'},
{t:'data structure',a:['data structures'],d:'A particular way of organising data. The choice decides what is fast and what is slow.'},

{t:'linear',a:['linear time'],d:'Work grows in step with the input: twice the data, twice the time. Written O(n).'},
{t:'constant time',d:'Takes the same time no matter how much data there is. Written O(1). Dictionary lookups are like this.'},
{t:'quadratic',a:['quadratic time'],d:'Work grows with the square of the input: ten times the data, a hundred times the work. Usually caused by a loop inside a loop. Written O(n squared).'},

{t:'index',a:['indexed'],d:'A sorted lookup structure the database keeps so it can jump straight to matching rows instead of reading every one.'},

{t:'normalisation',a:['normalization','normalised','denormalised'],d:'Storing each fact in exactly one place and referencing it elsewhere, so it cannot drift out of sync with itself.'},

{t:'repository',a:['repo','repos','repositories'],d:'A project folder that Git is tracking, including its full history of changes.'},
{t:'commit',a:['commits','committed','committing'],d:'A saved snapshot of your project at one moment, with a message explaining what changed and why.'},
{t:'branch',a:['branches','branching'],d:'A parallel line of work, so you can build something without disturbing the main version until it is ready.'},
{t:'merge',a:['merging','merged'],d:'Bringing the changes from one branch into another.'},

{t:'pull request',a:['PR','pull requests','PRs'],d:'A proposal to merge your branch, opened so others can review it first. The basic unit of work in a software job.'},
{t:'remote',a:['origin','upstream'],d:'A copy of your repository hosted somewhere else, usually on GitHub. You push changes up to it and pull others down.'},
{t:'staging area',a:['staged','staging'],d:'A holding area where you choose which changed files go into your next commit.'},
{t:'diff',a:['diffs'],d:'The list of exactly what changed between two versions — which lines were added and removed.'},
{t:'CI',a:['continuous integration'],d:'A robot that automatically builds your project and runs your tests every time you push, on a clean machine.'},
{t:'deploy',a:['deployment','deployed','deploying'],d:'Putting your code somewhere the public can actually use it.'},
{t:'container',a:['containers','Docker','image'],d:'Your application packaged together with everything it needs to run, so it behaves identically on any machine.'},
{t:'environment variable',a:['environment variables'],d:'A setting passed to your program from outside it, used for anything that differs between your laptop and the real server — especially passwords and keys.'},
{t:'API',a:['APIs'],d:'A defined way for one program to ask another for something. Usually a set of web addresses you can send requests to.'},
{t:'endpoint',a:['endpoints'],d:'One specific address in an API that does one specific thing.'},
{t:'request',a:['requests'],d:'A message asking a server for something, or asking it to do something.'},

];

let GL_MAP=null, GL_RE=null;
function glInit(){
  if(GL_RE) return;
  const pairs=[];
  GLOSSARY.forEach(g=>{ pairs.push([g.t.toLowerCase(),g]); (g.a||[]).forEach(x=>pairs.push([x.toLowerCase(),g])); });
  GL_MAP=new Map(pairs);
  const linkable=pairs.map(p=>p[0]).filter(t=>/^[a-z][a-z -]*$/i.test(t)).sort((a,b)=>b.length-a.length);
  GL_RE=new RegExp('\\b('+linkable.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','i');
}
function glossify(root){
  try{
    glInit();
    const used=new Set(), nodes=[];
    const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let n; while((n=w.nextNode())) nodes.push(n);
    nodes.forEach(node=>{
      const par=node.parentElement;
      if(!par||par.closest('pre,code,button,textarea,input,.gl,.glpop,.hud,h1,table')) return;
      const text=node.nodeValue;
      if(!text||text.trim().length<3) return;
      const m=GL_RE.exec(text);
      if(!m) return;
      const key=m[1].toLowerCase();
      if(used.has(key)||!GL_MAP.get(key)) return;
      used.add(key);
      const parent=node.parentNode;
      const after=document.createTextNode(text.slice(m.index+m[1].length));
      const span=document.createElement('span');
      span.className='gl'; span.textContent=m[1]; span.dataset.term=key;
      parent.replaceChild(after,node);
      parent.insertBefore(span,after);
      parent.insertBefore(document.createTextNode(text.slice(0,m.index)),span);
    });
  }catch(e){}
}
function closeGl(){ const p=document.querySelector('.glpop'); if(p) p.remove(); }
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t&&t.classList&&t.classList.contains('gl')){
    ev.stopPropagation();
    closeGl();
    const g=GL_MAP&&GL_MAP.get(t.dataset.term);
    if(!g) return;
    const pop=el('div','glpop','<span class="x">✕</span><b>'+esc(g.t)+'</b>'+g.d);
    document.body.appendChild(pop);
    const r=t.getBoundingClientRect();
    const w=pop.offsetWidth, h=pop.offsetHeight;
    let left=Math.min(Math.max(8,r.left), window.innerWidth-w-8);
    let top=r.bottom+8;
    if(top+h>window.innerHeight-8) top=Math.max(8,r.top-h-8);
    pop.style.left=left+'px'; pop.style.top=top+'px';
    sfx.page();
  } else if(!(t&&t.closest&&t.closest('.glpop'))){ closeGl(); }
  else if(t&&t.classList&&t.classList.contains('x')){ closeGl(); }
});

function renderGlossary(v){
  v.appendChild(el('div','card','<h2>\u{1F4D6} Glossary</h2>'+
    '<p class="sub">Every technical word the lessons use, in plain English. You should never have to guess what something means.</p>'+
    '<p class="sub">These are also linked automatically wherever they appear: a <span class="gl" data-term="variable">dotted underline</span> means click for a definition.</p>'));
  const inp=el('input'); inp.className='blank'; inp.style.width='100%'; inp.placeholder='search…';
  const box=el('div','card'); box.style.paddingTop='4px';
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();
    const hits=GLOSSARY.filter(g=>!q||g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q)||(g.a||[]).some(a=>a.toLowerCase().includes(q)));
    box.innerHTML='<p class="sub">'+hits.length+' terms</p>'+hits.map(g=>
      '<div class="glitem"><b>'+esc(g.t)+'</b>'+
      ((g.a&&g.a.length)?' <span class="sub">('+g.a.map(esc).join(', ')+')</span>':'')+
      '<div class="sub" style="margin-top:3px">'+g.d+'</div></div>').join('');
  };
  inp.addEventListener('input',draw);
  const wrap=el('div','card'); wrap.appendChild(inp);
  v.appendChild(wrap); v.appendChild(box); draw();
  const r=el('div','row'); const m=el('button','ghost','← Back to map'); m.onclick=goMap; r.appendChild(m); v.appendChild(r);
}

    note:'<b>Learn this if you want to build things people can see.</b> It runs instantly in this game with nothing to download, so it is also the fastest track to experiment in.' },
  sql:{ h:'What SQL is, and why it is unlike the others',
    p:['SQL is not a general programming language. It has no loops and barely any variables. It does one thing: <b>ask questions of a database</b>.',
       'And it is <b>declarative</b> — you describe the result you want and the database works out how to get it. In every other language you specify the steps; in SQL you specify the destination.'],
    code:'-- you describe WHAT you want\nSELECT name, salary\nFROM employees\nWHERE dept = \'Engineering\'\nORDER BY salary DESC;\n\n-- not HOW to find it. no loops anywhere.',
    note:'<b>It is by far the smallest language here and the fastest to become useful in.</b> It also appears in a huge share of job listings, which makes it the best return on a weekend of your time on the whole map.' },
  career:{ h:'What this track is, and why it exists',
    p:['Every other track teaches a language. This one teaches everything <b>between</b> knowing a language and being employable — which is the part nobody teaches and the part employers actually screen on.',
       'The terminal. Git and GitHub. Reading code you did not write. Debugging. Testing. Code review. The data structures and patterns interviews are built from. APIs, security, system design, and the interview itself.'],
    code:'knows a language          →   ???   →   gets hired\n                            ↑\n                     this track',
    note:'<b>Start it once you have cleared about twelve floors of a language.</b> Some floors here are real-world tasks you do on your own machine rather than in this box — installing tools, making your first commits, applying for things. Those count for the most.' }
};
function primerPages(lang){
  const mid=PRIMER_LANG[lang];
  return PRIMER_INTRO.concat(mid?[mid]:[]).concat(PRIMER_OUTRO);
}
function renderPrimer(v){
  const pages=primerPages(S.lang);
  if(S.ppage>pages.length-1) S.ppage=pages.length-1;
  if(S.ppage<0) S.ppage=0;
  const p=pages[S.ppage];
  const c=el('div','card',
    '<div class="sub">\u{1F4D8} START HERE · '+(S.ppage+1)+' of '+pages.length+' · no test, no score</div>'+
    '<h2 style="margin-top:6px">'+p.h+'</h2>'+
    (p.key?'<div class="keybox"><span class="lbl">the point</span>'+p.key+'</div>':'')+
    (p.p||[]).filter(Boolean).map(x=>'<p>'+x+'</p>').join('')+
    (p.code?'<pre><code>'+esc(p.code)+'</code></pre>':'')+
    (p.out?'<div class="outlbl">output</div><pre class="out"><code>'+esc(p.out)+'</code></pre>':'')+
    (p.note?'<div class="note">'+p.note+'</div>':''));
  const dots=el('div','dots'); pages.forEach((_,i)=>dots.appendChild(el('i',i<=S.ppage?'on':'')));
  c.appendChild(dots);
  const r=el('div','row');
  const back=el('button','ghost','← Back'); back.disabled=S.ppage===0;
  back.onclick=()=>{S.ppage--;sfx.page();save();render();};
  r.appendChild(back);
  if(S.ppage<pages.length-1){
    const nx=el('button','primary','Next →');
    nx.onclick=()=>{S.ppage++;sfx.page();save();render();window.scrollTo(0,0);};
    r.appendChild(nx);
  } else {
    const go=el('button','primary','⚔️ I am ready — take me to floor 1');
    go.onclick=()=>{ S.primed[S.lang]=1; save(); enterZone(0); };
    r.appendChild(go);
  }
  const m=el('button','ghost','Skip to the map');
  m.onclick=()=>{ S.primed[S.lang]=1; save(); goMap(); };
  r.appendChild(m);
  c.appendChild(r);
  const wrap=el('div','primer'); wrap.appendChild(c); v.appendChild(wrap);
}

/* ---------- boot ---------- */
if(IS_TOUCH) document.body.classList.add('touch');
if(!S.lang||!CONTENT[S.lang]) { S.lang=null; S.view='lang'; }
render();
</script>
