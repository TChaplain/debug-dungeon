  { title:'Subqueries', mon:'The Nested One', emoji:'\u{1FA86}',
    taunt:'"A query inside a query. Where does it end?"',
    lesson:[
      { h:'A query used as a value',
        p:['Any query that returns a single value can be dropped in wherever a value belongs. This is how you compare rows against an aggregate — something a plain WHERE cannot do.'],
        code:'SELECT name, salary FROM employees\nWHERE salary > (SELECT AVG(salary) FROM employees);',
        note:'<b>You cannot write <code>WHERE salary > AVG(salary)</code></b> — aggregates are not allowed in WHERE, because WHERE runs before grouping. The subquery computes the average separately first.' },
      { h:'IN and NOT IN with a list',
        p:['A subquery returning one column becomes a list to test membership against.'],
        code:'SELECT name FROM employees\nWHERE id IN (SELECT emp_id FROM sales);\n\nSELECT name FROM employees\nWHERE id NOT IN (SELECT emp_id FROM sales);',
        note:'<b>Danger: if the inner query returns any NULL, <code>NOT IN</code> returns nothing at all.</b> Unknown values make every comparison unknown. Use <code>NOT EXISTS</code> when NULLs are possible.' },
      { h:'EXISTS',
        p:['Asks "does at least one matching row exist?" It can stop at the first hit, so it is often faster than IN, and it handles NULLs correctly.'],
        code:'SELECT name FROM employees e\nWHERE EXISTS (\n  SELECT 1 FROM sales s WHERE s.emp_id = e.id\n);',
        note:'The <code>SELECT 1</code> is conventional — EXISTS only cares whether a row came back, never what is in it.' },
      { h:'Subqueries in FROM (derived tables)',
        p:['A subquery can also stand in for a table. Useful when you need to aggregate and then filter or join on the result.'],
        code:'SELECT dept, avg_salary\nFROM (\n  SELECT dept, AVG(salary) AS avg_salary\n  FROM employees\n  GROUP BY dept\n) AS dept_stats\nWHERE avg_salary > 90000;',
        note:'A derived table needs an alias — <code>AS dept_stats</code>. Modern SQL also offers <code>WITH name AS (...)</code>, a CTE, which reads far better once queries get long.' },
      { h:'Common Table Expressions',
        p:['<code>WITH</code> pulls the subquery out to the top and names it. Same result, dramatically more readable, and you can chain several.'],
        code:'WITH dept_stats AS (\n  SELECT dept, AVG(salary) AS avg_salary\n  FROM employees\n  GROUP BY dept\n)\nSELECT dept FROM dept_stats WHERE avg_salary > 90000;',
        note:'<b>Prefer CTEs for anything non-trivial.</b> Deeply nested subqueries are how SQL gets its reputation for being unreadable.' }
    ],
    encounters:[
      { t:'mcq', q:'Why can you not write <code>WHERE salary > AVG(salary)</code>?',
        opts:['AVG is spelled wrong','WHERE runs before aggregation, so the average does not exist yet','You need quotes','You can'], a:1,
        why:'Use a subquery to compute the average first, or HAVING if you are filtering groups.' },
      { t:'mcq', q:'What does <code>EXISTS</code> return?',
        opts:['The matching rows','TRUE or FALSE — whether any row matched','A count','The first value'], a:1,
        why:'It is a boolean test, which is why the convention is SELECT 1 inside.' },
      { t:'mcq', q:'Why can <code>NOT IN (subquery)</code> silently return zero rows?',
        opts:['It is deprecated','If the subquery yields a NULL, every comparison becomes unknown','It only works on numbers','It needs an index'], a:1,
        why:'A famous SQL trap. Use NOT EXISTS when NULLs are possible.' },
      { t:'mcq', q:'What is a CTE?',
        opts:['A type of index','A named subquery defined with WITH, at the top of the query','A constraint','A stored procedure'], a:1,
        why:'Same result as a nested subquery, far easier to read and reuse.' },
      { t:'sql', task:'Return <code>name</code> of every employee earning above the company average salary.',
        starter:'SELECT ', ordered:false, expected:[['Ada'],['Grace'],['Tim']],
        hint:'WHERE salary > (SELECT AVG(salary) FROM employees)',
        solution:'SELECT name FROM employees\nWHERE salary > (SELECT AVG(salary) FROM employees);' },
      { t:'sql', task:'Return <code>name</code> of every employee who has made at least one sale.',
        starter:'SELECT ', ordered:false, expected:[['Ada'],['Marie'],['Alan']],
        hint:'WHERE id IN (SELECT emp_id FROM sales)',
        solution:'SELECT name FROM employees WHERE id IN (SELECT emp_id FROM sales);' },
      { t:'sql', task:'Return <code>name</code> of every employee who has made <b>no</b> sales.',
        starter:'SELECT ', ordered:false, expected:[['Grace'],['Linus'],['Katherine'],['Tim']],
        hint:'NOT EXISTS (SELECT 1 FROM sales s WHERE s.emp_id = e.id) — safer than NOT IN.',
        solution:'SELECT name FROM employees e\nWHERE NOT EXISTS (SELECT 1 FROM sales s WHERE s.emp_id = e.id);' },
      { t:'sql', task:'Using a <code>WITH</code> clause, return <code>dept</code> names whose average salary exceeds 90000.',
        starter:'WITH ', ordered:false, expected:[['Engineering'],['Design']],
        hint:'WITH stats AS (SELECT dept, AVG(salary) AS a FROM employees GROUP BY dept) SELECT dept FROM stats WHERE a > 90000;',
        solution:'WITH stats AS (\n  SELECT dept, AVG(salary) AS a FROM employees GROUP BY dept\n)\nSELECT dept FROM stats WHERE a > 90000;' }
    ]},

  { title:'Window Functions', mon:'The Flattener', emoji:'\u{1FA9F}',
    taunt:'"Group it and lose the detail. That is the deal."',
    lesson:[
      { h:'Aggregate without collapsing',
        p:['<code>GROUP BY</code> destroys your rows — seven employees become three department rows. A <b>window function</b> computes across a set of rows while <i>keeping every row</i>.',
           'This is the single most impressive thing you can know in an entry-level SQL interview, because most candidates do not.'],
        code:'SELECT name, dept, salary,\n       AVG(salary) OVER (PARTITION BY dept) AS dept_avg\nFROM employees;',
        note:'<b><code>OVER</code> is what makes it a window function.</b> <code>PARTITION BY</code> is like GROUP BY, but it only defines the window — the rows survive.' },
      { h:'Ranking',
        p:['Three near-identical functions with one important difference in how they handle ties.'],
        code:'SELECT name, dept, salary,\n       ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn,\n       RANK()       OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk,\n       DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS drnk\nFROM employees;',
        note:'<b>With a tie for 1st:</b> ROW_NUMBER gives 1, 2, 3 (arbitrary tiebreak). RANK gives 1, 1, 3 (skips). DENSE_RANK gives 1, 1, 2 (no gap). Interviewers ask this exact question.' },
      { h:'Running totals',
        p:['Add <code>ORDER BY</code> inside the OVER and the aggregate becomes cumulative — each row sees itself and everything before it.'],
        code:'SELECT name, salary,\n       SUM(salary) OVER (ORDER BY id) AS running_total\nFROM employees;',
        note:'Running totals, moving averages and cumulative percentages are all this pattern. Doing it without window functions requires an ugly self-join.' },
      { h:'LAG and LEAD',
        p:['Look at the previous or next row — how you compute change over time without joining a table to itself.'],
        code:'SELECT name, salary,\n       LAG(salary) OVER (ORDER BY id)  AS prev_salary,\n       salary - LAG(salary) OVER (ORDER BY id) AS change\nFROM employees;',
        note:'The first row has no previous row, so LAG gives NULL. <code>LAG(salary, 1, 0)</code> supplies a default instead.' },
      { h:'Top-N-per-group: the classic',
        p:['"The highest paid person in each department" cannot be done with GROUP BY alone. With a window function it is routine — rank inside each partition, then filter to rank 1.'],
        code:'WITH ranked AS (\n  SELECT name, dept,\n         ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn\n  FROM employees\n)\nSELECT name, dept FROM ranked WHERE rn = 1;',
        note:'<b>You cannot filter on a window function in WHERE</b> — windows are computed after WHERE. Wrap it in a CTE or subquery, then filter outside.' }
    ],
    encounters:[
      { t:'mcq', q:'What is the key difference between GROUP BY and a window function?',
        opts:['Window functions are faster','GROUP BY collapses rows; a window function keeps every row','They are identical','Windows only work on numbers'], a:1,
        why:'That is the whole point — per-group calculations alongside the original detail.' },
      { t:'mcq', q:'With a tie for first place, what does <code>RANK()</code> produce?',
        opts:['1, 2, 3','1, 1, 2','1, 1, 3','1, 1, 1'], a:2,
        why:'RANK skips the gap; DENSE_RANK gives 1, 1, 2; ROW_NUMBER forces 1, 2, 3.' },
      { t:'mcq', q:'What does adding <code>ORDER BY</code> inside <code>OVER (...)</code> do to SUM?',
        opts:['Nothing','Makes it a running/cumulative total','Sorts the output','Causes an error'], a:1,
        why:'Each row then sees itself plus all preceding rows in the window.' },
      { t:'mcq', q:'Why must top-N-per-group be wrapped in a CTE or subquery?',
        opts:['For readability only','Window functions are computed after WHERE, so you cannot filter on them there','CTEs are faster','It is not required'], a:1,
        why:'You have to materialise the rank first, then filter it in an outer query.' },
      { t:'sql', task:'Return <code>name</code> and each employee\'s rank by salary within their department (highest = 1).',
        starter:'SELECT ', ordered:false,
        expected:[['Grace','1'],['Ada','2'],['Linus','3'],['Alan','1'],['Marie','2'],['Tim','1'],['Katherine','2']],
        hint:'RANK() OVER (PARTITION BY dept ORDER BY salary DESC)',
        solution:'SELECT name,\n       RANK() OVER (PARTITION BY dept ORDER BY salary DESC)\nFROM employees;' },
      { t:'sql', task:'Return <code>name</code> and a running total of salary, ordered by <code>id</code>.',
        starter:'SELECT ', ordered:true,
        expected:[['Ada','120000'],['Grace','255000'],['Linus','353000'],['Marie','440000'],['Alan','531000'],['Katherine','610000'],['Tim','715000']],
        hint:'SUM(salary) OVER (ORDER BY id), and ORDER BY id on the outside too.',
        solution:'SELECT name, SUM(salary) OVER (ORDER BY id)\nFROM employees ORDER BY id;' },
      { t:'sql', task:'Return the <code>name</code> of the highest-paid person in each department.',
        starter:'WITH ', ordered:false, expected:[['Grace'],['Alan'],['Tim']],
        hint:'CTE with ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC), then WHERE rn = 1.',
        solution:'WITH ranked AS (\n  SELECT name, ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn\n  FROM employees\n)\nSELECT name FROM ranked WHERE rn = 1;' }
    ]},

  { title:'Self-Joins & Set Operations', mon:'The Doppelganger', emoji:'\u{1F46F}',
    taunt:'"Join me to myself. I will not make it easy."',
    lesson:[
      { h:'Joining a table to itself',
        p:['When a table references itself — an employee has a manager who is also an employee — you join it to itself using two different aliases. The aliases are what make it work.'],
        code:'SELECT e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.id;',
        note:'<b>LEFT JOIN, not JOIN.</b> An inner join would silently drop everyone without a manager — which here is three of the seven people, including the two most senior.' },
      { h:'UNION and UNION ALL',
        p:['Stack two result sets vertically. Both must have the same number of columns with compatible types.'],
        code:'SELECT dept FROM employees\nUNION\nSELECT region FROM sales;\n\nSELECT dept FROM employees\nUNION ALL\nSELECT region FROM sales;',
        note:'<b><code>UNION</code> removes duplicates, which costs a sort.</b> <code>UNION ALL</code> keeps everything and is faster. If you know there are no duplicates, always use UNION ALL.' },
      { h:'INTERSECT and EXCEPT',
        p:['Rows in both, and rows in the first but not the second. Handy for comparing two datasets — reconciling a report, or finding what changed.'],
        code:'SELECT id FROM employees\nEXCEPT\nSELECT emp_id FROM sales;\n\nSELECT id FROM employees\nINTERSECT\nSELECT emp_id FROM sales;' },
      { h:'JOIN vs UNION, plainly',
        p:['<b>JOIN adds columns</b> — it widens your result by attaching related data side by side. <b>UNION adds rows</b> — it stacks similarly-shaped results on top of each other.',
           'People mix these up constantly. If you want "employees plus their sales details", that is a JOIN. If you want "this year\'s orders and last year\'s orders in one list", that is a UNION.'] }
    ],
    encounters:[
      { t:'mcq', q:'What makes a self-join work?',
        opts:['A special SELFJOIN keyword','Two different aliases for the same table','A subquery','An index'], a:1,
        why:'The aliases let SQL treat one table as two logical copies.' },
      { t:'mcq', q:'Difference between UNION and UNION ALL?',
        opts:['None','UNION removes duplicates (and costs a sort); UNION ALL keeps everything','UNION ALL removes duplicates','UNION only works on two tables'], a:1,
        why:'If duplicates are impossible, UNION ALL is strictly faster.' },
      { t:'mcq', q:'JOIN adds ___ ; UNION adds ___',
        opts:['rows / columns','columns / rows','indexes / rows','nothing / everything'], a:1,
        why:'JOIN widens the result sideways; UNION stacks results vertically.' },
      { t:'sql', task:'Return each employee <code>name</code> and their manager\'s name — including people with no manager.',
        starter:'SELECT ', ordered:false,
        expected:[['Ada','Grace'],['Grace','NULL'],['Linus','Grace'],['Marie','Alan'],['Alan','NULL'],['Katherine','Tim'],['Tim','NULL']],
        hint:'FROM employees e LEFT JOIN employees m ON e.manager_id = m.id',
        solution:'SELECT e.name, m.name\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.id;' },
      { t:'sql', task:'Return one combined list of every distinct <code>dept</code> and every distinct sales <code>region</code>.',
        starter:'SELECT ', ordered:false,
        expected:[['Engineering'],['Sales'],['Design'],['West'],['East'],['North']],
        hint:'SELECT dept FROM employees UNION SELECT region FROM sales;',
        solution:'SELECT dept FROM employees\nUNION\nSELECT region FROM sales;' },
      { t:'sql', task:'Return the <code>id</code> of every employee who appears in employees but never in sales, using <code>EXCEPT</code>.',
        starter:'SELECT ', ordered:false, expected:[['2'],['3'],['6'],['7']],

    ]},

  { title:'Changing Data', mon:'The Missing WHERE', emoji:'\u{1F4A3}',
    taunt:'"UPDATE employees SET salary = 0. No WHERE. Enjoy."',
    lesson:[
      { h:'INSERT, UPDATE, DELETE',
        p:['Reading is most of the job, but you will write too. These three are simple and permanent.'],
        code:"INSERT INTO employees (id, name, dept, salary, years)\nVALUES (8, 'Bob', 'Sales', 50000, 1);\n\nUPDATE employees SET salary = salary + 5000 WHERE dept = 'Design';\n\nDELETE FROM employees WHERE years < 1;",
        note:'<b>In this game the database is rebuilt fresh for every run</b>, so experiment freely. In real life, these are irreversible.' },
      { h:'The WHERE-less catastrophe',
        p:['Omit the WHERE clause and UPDATE or DELETE applies to <b>every row in the table</b>. This has ended real careers and taken down real companies.'],
        code:'-- updates ONE row\nUPDATE employees SET salary = 0 WHERE id = 3;\n\n-- updates ALL SEVEN rows. no confirmation. no undo.\nUPDATE employees SET salary = 0;',
        note:'<b>The professional habit:</b> write it as a SELECT first. Run <code>SELECT * FROM employees WHERE id = 3;</code>, confirm it returns what you expect, <i>then</i> change SELECT * to UPDATE ... SET. Every experienced person does this.' },
      { h:'Transactions',
        p:['A transaction groups several statements so they all succeed or all fail. The classic example is a bank transfer: taking money out of one account and putting it into another must never half-happen.'],
        code:'BEGIN TRANSACTION;\n  UPDATE accounts SET balance = balance - 100 WHERE id = 1;\n  UPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;\n\n-- or, if something looked wrong:\n-- ROLLBACK;',
        note:'<b>ACID</b> is the guarantee set: <b>A</b>tomic (all or nothing), <b>C</b>onsistent (rules never broken), <b>I</b>solated (concurrent transactions do not interfere), <b>D</b>urable (committed means committed, even if the power dies). Expect to be asked what the letters stand for.' },
      { h:'Constraints stop bad data at the door',
        p:['Rules the database enforces itself, so no application bug can violate them.'],
        code:'CREATE TABLE employees (\n  id      INTEGER PRIMARY KEY,\n  name    TEXT NOT NULL,\n  email   TEXT UNIQUE,\n  salary  INTEGER CHECK (salary >= 0),\n  dept_id INTEGER REFERENCES departments(id)\n);',
        note:'<b>PRIMARY KEY</b> = unique row identifier. <b>FOREIGN KEY</b> (REFERENCES) = must point at a real row in another table. Constraints are cheaper than trusting every future developer to remember the rules.' }
    ],
    encounters:[
      { t:'mcq', q:'What does <code>UPDATE employees SET salary = 0;</code> do?',
        opts:['Nothing, it is invalid','Updates the first row','Sets EVERY row to 0','Asks for confirmation'], a:2,
        why:'No WHERE means every row. No confirmation, no undo. This is why you write it as a SELECT first.' },
      { t:'mcq', q:'What is a transaction for?',
        opts:['Speed','Grouping statements so they all succeed or all fail','Sorting','Backups'], a:1,
        why:'Atomicity. A bank transfer must never half-complete.' },
      { t:'mcq', q:'What does the D in ACID stand for?',
        opts:['Distributed','Durable — committed data survives a crash','Deferred','Deleted'], a:1,
        why:'Atomic, Consistent, Isolated, Durable. A standard interview question.' },
      { t:'mcq', q:'What does a FOREIGN KEY guarantee?',
        opts:['The value is unique','The value must match a real row in the referenced table','The column cannot be NULL','The column is indexed'], a:1,
        why:'It enforces referential integrity — no sales row pointing at an employee who does not exist.' },
      { t:'sql', task:'Insert Bob (id 8, Sales, 50000, 1 year, manager 5), then return all Sales employee <code>name</code> values.',
        starter:"INSERT INTO employees VALUES (8, 'Bob', 'Sales', 50000, 1, 5);\nSELECT ", ordered:false,
        expected:[['Marie'],['Alan'],['Bob']],
        hint:"After the INSERT, add: SELECT name FROM employees WHERE dept = 'Sales';",
        solution:"INSERT INTO employees VALUES (8, 'Bob', 'Sales', 50000, 1, 5);\nSELECT name FROM employees WHERE dept = 'Sales';" },
      { t:'sql', task:'Give everyone in Design a 5000 raise, then return their <code>name</code> and new <code>salary</code>.',
        starter:'UPDATE ', ordered:false,
        expected:[['Katherine','84000'],['Tim','110000']],
        hint:"UPDATE employees SET salary = salary + 5000 WHERE dept = 'Design'; then a SELECT.",
        solution:"UPDATE employees SET salary = salary + 5000 WHERE dept = 'Design';\nSELECT name, salary FROM employees WHERE dept = 'Design';" },
      { t:'sql', task:'Delete everyone with fewer than 3 <code>years</code>, then return the remaining row count.',
        starter:'DELETE ', ordered:false, expected:[['6']],

    ]},

  { title:'Performance & Design', mon:'The Full Scan', emoji:'\u{1F40C}',
    taunt:'"Ten million rows. One at a time. I have all day."',
    lesson:[
      { h:'Indexes: the book\'s index, for data',
        p:['Without one, finding a row means reading every row — a <b>full table scan</b>. An index is a sorted structure the database can jump into, turning O(n) into roughly O(log n).'],
        code:"CREATE INDEX idx_emp_dept ON employees(dept);\n\n-- now this can jump straight there\nSELECT * FROM employees WHERE dept = 'Sales';\n\nEXPLAIN QUERY PLAN\nSELECT * FROM employees WHERE dept = 'Sales';",
        note:'<b>Indexes are not free.</b> Every INSERT, UPDATE and DELETE must maintain them, and they take disk space. Index the columns you filter, join and sort on — not everything.' },
      { h:'When an index cannot help',
        p:['Wrapping the indexed column in a function, or a leading wildcard, defeats it entirely. The database can no longer use the sorted order.'],
        code:"-- index unusable\nWHERE LOWER(name) = 'ada'\nWHERE name LIKE '%son'\nWHERE salary + 1000 > 50000\n\n-- index usable\nWHERE name = 'Ada'\nWHERE name LIKE 'Ad%'\nWHERE salary > 49000",
        note:'<b>Keep the column bare on one side of the comparison.</b> Move the arithmetic to the other side. This one habit fixes a surprising number of slow queries.' },
      { h:'Normalisation, briefly',
        p:['Store each fact in exactly one place, and reference it elsewhere by id. If a department name is typed into 500 employee rows, renaming it means 500 updates and one guaranteed inconsistency.'],
        code:'-- denormalised: dept name repeated on every row\nemployees(id, name, dept_name, dept_budget)\n\n-- normalised: stored once, referenced by id\nemployees(id, name, dept_id)\ndepartments(id, name, budget)',
        note:'<b>The tradeoff:</b> normalised data is safe to update but needs joins to read. Analytics warehouses deliberately denormalise for read speed. "It depends on the workload" is the correct interview answer.' },
      { h:'Habits that keep queries fast',
        p:['<b>1.</b> Name your columns instead of <code>SELECT *</code> — less data over the wire, and the query does not change shape when a column is added. <b>2.</b> Filter as early as possible. <b>3.</b> <code>EXISTS</code> over <code>IN</code> for large subqueries. <b>4.</b> <code>UNION ALL</code> over <code>UNION</code> when duplicates are impossible. <b>5.</b> Read the query plan instead of guessing.'] }
    ],
    encounters:[
      { t:'mcq', q:'What is the main cost of adding an index?',
        opts:['Nothing','Writes get slower and it uses disk space','Reads get slower','It locks the table forever'], a:1,
        why:'Every insert and update must maintain it. Index what you filter, join and sort on — not everything.' },
      { t:'mcq', q:'Which of these can still use an index on <code>name</code>?',
        opts:["WHERE LOWER(name) = 'ada'","WHERE name LIKE '%son'","WHERE name LIKE 'Ad%'","WHERE name || '' = 'Ada'"], a:2,
        why:'A trailing wildcard preserves the sorted prefix. Functions and leading wildcards defeat the index.' },
      { t:'mcq', q:'Why avoid <code>SELECT *</code> in production code?',
        opts:['It is invalid','It moves unnecessary data and silently changes shape when columns are added','It is slower to type','It breaks joins'], a:1,
        why:'Naming columns makes the query explicit and stable.' },
      { t:'mcq', q:'What problem does normalisation solve?',
        opts:['Slow reads','The same fact stored in many places, which drifts out of sync','Missing indexes','Large files'], a:1,
        why:'One fact, one place. The cost is more joins when reading — a deliberate tradeoff.' },
      { t:'mcq', q:'A query is slow. What do you do first?',
        opts:['Add indexes to every column','Read the query plan (EXPLAIN) to see what it is actually doing','Rewrite it in Python','Add more RAM'], a:1,
        why:'Measure before optimising. The plan tells you whether it is scanning, and where.' },
      { t:'sql', task:'Return the <code>dept</code> and headcount for departments with more than 2 employees.',
        starter:'SELECT ', ordered:false, expected:[['Engineering','3']],
        hint:'GROUP BY dept, then HAVING COUNT(*) > 2.',
        solution:'SELECT dept, COUNT(*) FROM employees GROUP BY dept HAVING COUNT(*) > 2;' },

CONTENT.cpp = {
  name:'C++', indent:'    ',
  tag:'the machine underneath · course + interview language',
  tagline:'The language most CS degrees teach data structures in, and the one that forces you to understand memory, pointers and cost. Python hides all of it; C++ makes you look. Challenges run in-browser on a C-style subset — floor 1 sets up a real compiler for everything beyond it.',

  /* ---- F1 ---- */
  { title:'Hello, Compiler', mon:'The Linker Error', emoji:'\u{1F517}',
    taunt:'"undefined reference to `main\'. Good luck finding out why."',
    lesson:[
      { h:'C++ is compiled, and that changes everything',
        p:['Python reads your file and runs it line by line. C++ does not run your file at all — it <b>translates</b> it into machine code once, and then the machine runs that.',
           'This is why C++ is fast, why errors appear before you run anything, and why the error messages are so much worse.'],
        code:'main.cpp  →  PREPROCESS  →  COMPILE  →  ASSEMBLE  →  LINK  →  a.exe\n              (#include)     (syntax,     (machine   (join the\n                             types)        code)      pieces)',
        note:'<b>Two error families, and telling them apart saves hours.</b> A <i>compile</i> error means your code is wrong — a typo, a type mismatch. A <i>linker</i> error means the code was fine but something it referred to was never found: a missing definition, a forgotten file, a library you did not link.' },
      { h:'The smallest complete program',
        p:['Here it is in full. It looks like a lot of ceremony for one line of output, and every part of it is explained on the next page — nothing here is assumed.'],
        code:'#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, world!" << endl;\n    return 0;\n}',
        out:'Hello, world!',
        note:'<b>If this looks intimidating, that is a reasonable reaction.</b> Python does the same job in one line. C++ asks you to be explicit about things Python decides for you, and that explicitness is the whole trade: more typing, far more control.' },
      { h:'Every single symbol in that program',
        p:['Nothing skipped. If a word here is new, it is defined as it appears.'],
        code:'#include <iostream>\n│        └── the name of a FILE full of ready-made code.\n│            "iostream" = input/output stream: the tools for\n│            reading and writing text.\n└── "#" starts a PREPROCESSOR line - a step that edits your\n    text before compiling. #include literally pastes that\n    file in, right here, before anything else happens.\n\nusing namespace std;\n      └── a NAMESPACE is a labelled group of names, so two\n          libraries can both have a "sort" without clashing.\n          "std" is the standard library\'s group. This line\n          says "if I use a bare name, look in std too", which\n          lets you write cout instead of std::cout.\n\nint main() {\n│   └── the function every C++ program starts at. The name is\n│       required and the computer looks for it specifically.\n└── the TYPE of value main hands back when it finishes.\n\n    cout << "Hello, world!" << endl;\n    │       │                  └── "end line": a newline.\n    │       └── the text to print. Double quotes = a STRING.\n    └── "character out": the stream connected to your screen.\n        "<<" means "send this to that stream". Chain as many\n        as you like, left to right.\n\n    return 0;\n    └── finish, handing back 0. By universal convention 0 means\n        "worked" and anything else means "something failed".\n        This is how other programs know whether yours succeeded.\n}\n└── the closing brace. Braces mark where a block starts and ends.',
        note:'<b>The semicolons matter.</b> C++ ignores line breaks entirely — a <code>;</code> is how it knows one instruction has ended. Miss one and it reads your next line as a continuation of the previous, which is why one missing semicolon can produce forty confusing errors.' },
      { h:'cout, and the << operator',
        p:['<code>&lt;&lt;</code> is not a shift here — it has been overloaded to mean "send this to the stream". You can chain it as many times as you like.'],
        code:'int score = 42;\ncout << "Score: " << score << endl;\ncout << "no newline here";\ncout << "\\n";',
        note:'<code>endl</code> writes a newline <i>and flushes the buffer</i>. <code>"\\n"</code> just writes the newline. In a tight loop, <code>endl</code> is measurably slower — one of those details that shows up in a code review.' },
      { h:'Semicolons, braces and the compiler\'s bad manners',
        p:['Every statement ends in <code>;</code>. Blocks use <code>{ }</code> — indentation means nothing to the compiler.',
           'And the first error is the only one worth reading. A single missing semicolon can produce forty lines of cascading nonsense, all of it downstream of the real problem.'],
        code:'int x = 5     // MISSING SEMICOLON\ncout << x;\n\n// error: expected \',\' or \';\' before \'cout\'\n// ...followed by 30 lines that are not the problem',
        note:'<b>Always fix the top error first, then recompile.</b> Do not try to fix them all at once — most of them will vanish.' },
      { h:'Building it: two commands, in order',
        key:'You wrote a <b>text file</b>. A computer cannot run a text file. So there are always two steps: <b>build it</b>, then <b>run the thing that was built</b>.',
        p:['<code>g++</code> is the name of the compiler program. You give it your file, and it produces a second file — a real program you can run.'],
        code:'g++ main.cpp        step 1: build it\n\n./a.out             step 2: run it   (Mac / Linux)\na.exe               step 2: run it   (Windows)',
        note:'<b>Change your code and you must build it again.</b> The old program does not update itself. Editing a file, running the old build, and wondering why nothing changed is a rite of passage — it happens to everyone once.' },
      { h:'Your first flag: naming the result',
        key:'A <b>flag</b> is a short instruction to the compiler, written as a dash followed by letters. It changes how the compiler behaves.',
        p:['Left alone, the compiler names its output <code>a.out</code> or <code>a.exe</code>, which becomes useless the moment you have two projects. The <code>-o</code> flag lets you name it. The <b>o</b> is for <b>output</b>.'],
        code:'g++ main.cpp -o game\n           │      │    │\n           │      │    └── the name you want\n           │      └── the flag: "output"\n           └── your source file\n\n./game              now run it by that name',
        note:'<b>Flags always start with a dash.</b> That is how the compiler tells your instructions apart from your filenames. Everything without a dash is treated as a file to compile.' },
      { h:'-Wall: the one flag that finds your bugs',
        key:'If you remember only one flag ever, make it this one. <code>-Wall</code> means <b>"warn all"</b>. It asks the compiler to point out code that is legal but suspicious.',
        p:['First, the distinction nobody explains: <b>an error is not a warning.</b>',
           'An <b>error</b> means the compiler refuses. Nothing is built, and you must fix it. A <b>warning</b> means it built your program anyway, but thinks you have probably made a mistake.',
           'In most languages a warning is a nag. <b>In C++ it is usually a real bug</b>, because C++ will happily compile code that does something undefined rather than stopping you.'],
        code:'int total;                    // never given a starting value\nfor (int i = 0; i < n; i++) {\n    total += arr[i];\n}\nreturn total;                 // returns garbage\n\n\nwithout -Wall:  compiles silently. wrong answers. no clue why.\n\nwith -Wall:     warning: \'total\' is used uninitialized\n                                    ^^^ the bug, named exactly',
        note:'<b>Turn it on and never turn it off.</b> <code>-Wextra</code> adds a second batch of checks on top; there is no reason not to have both. Some teams go further and use <code>-Werror</code>, which turns every warning into a hard error so nobody can ignore one.' },
      { h:'The full command, assembled',
        key:'You have now met each piece separately. Here they are together — this is the line you will use for the rest of the track.',
        p:['Copy it somewhere you can find it. You are not expected to memorise it.'],
        code:'g++ -std=c++17 -Wall -Wextra -g main.cpp -o game\n\ng++             the compiler\n-std=c++17      use the 2017 version of the language,\n                so modern features are available\n-Wall           warn about suspicious code   <-- the important one\n-Wextra         warn about even more\n-g              keep the extra notes a debugger needs\nmain.cpp        your source file\n-o game         call the finished program "game"',
        note:'<b>Nobody types this every time.</b> You put it in a file called a <i>Makefile</i> once and then just type <code>make</code> — which is exactly what the first Workshop project sets up. For now, copy and paste.' }

      { t:'do', task:'Part 1 of 2 — Install the compiler on Windows',

        steps:[

  { title:'Types, Sizes & Truncation', mon:'The Silent Cast', emoji:'\u{2702}️',
    taunt:'"You wanted 3.5. I gave you 3. I did not warn you."',
    lesson:[
      { h:'Types are fixed, and they are the machine\'s types',
        p:['In Python a number is just a number and grows as large as it needs to. In C++ a type is <b>a specific number of bytes with a specific range</b>, and going outside that range is your problem.'],
        code:'int      whole numbers, usually 4 bytes,  about -2.1e9 to 2.1e9\nlong long 8 bytes, when int is not enough\ndouble   decimals, 8 bytes\nfloat    decimals, 4 bytes - rarely worth it\nchar     one byte, holds a character OR a small number\nbool     true / false',
        note:'<b><code>sizeof(int)</code> is not guaranteed to be 4.</b> It is 4 on every machine you will use and 2 on an Arduino. When exact width matters, use <code>&lt;cstdint&gt;</code>: <code>int32_t</code>, <code>uint64_t</code>.' },
      { h:'The integer division trap',
        key:'If <b>both</b> numbers are whole numbers, C++ throws away the remainder. <code>7 / 2</code> gives <code>3</code>, not 3.5 — with no error and no warning.',
        p:['This one catches everyone, and unlike Python it is completely silent.'],
        code:'cout << 7 / 2 << endl;\ncout << 7.0 / 2 << endl;\ncout << (double)7 / 2 << endl;',
        out:'3\n3.5\n3.5',
        note:'<b>If BOTH sides are integers, C++ does integer division and throws away the remainder.</b> No error, no warning. Make one side a double and it behaves. This is the single most common numeric bug for people coming from Python.' },
      { h:'Casting on purpose',

      { h:'Two places memory comes from',
        p:['<b>The stack</b> is automatic: variables live until the enclosing block ends, then vanish. Fast, small, and managed for you.',

        code:'void f() {\n    int a = 5;              // stack - gone when f returns\n    int* b = new int(5);    // heap  - stays until you delete it\n    delete b;               // your job. always.\n}',
        note:'<b>Use the stack whenever you can.</b> New C++ programmers reach for <code>new</code> far too often. If the lifetime matches the scope, a plain local variable is faster and impossible to leak.' },
      { h:'The rules',
        p:['Every <code>new</code> needs exactly one matching <code>delete</code>. Every <code>new[]</code> needs a <code>delete[]</code>.'],
        code:'int* one = new int(42);\ndelete one;                  // single object\n\nint* many = new int[100];\ndelete[] many;               // ARRAY - the brackets matter\n\ndelete one;                  // DOUBLE FREE - undefined behaviour\none = nullptr;               // do this after deleting',
        note:'<b>Mixing them is undefined behaviour.</b> <code>delete</code> on an array allocated with <code>new[]</code> will not run the right destructors and may corrupt the allocator.' },
      { h:'The four ways this goes wrong',
        p:[''],
        code:'LEAK          allocated, never deleted. memory grows forever.\nDANGLING      deleted, then used. reads freed memory.\nDOUBLE FREE   deleted twice. corrupts the allocator.\nWRONG DELETE  delete on new[], or delete on a stack address.',
        note:'<b>A leak in a script is harmless. A leak in a server is an outage.</b> A slow leak takes days to show up, which is what makes it expensive.' },
      { h:'Why dynamic allocation exists at all',

        code:'int n;\ncin >> n;\nint* arr = new int[n];    // size unknown at compile time\n// ... use it ...\ndelete[] arr;\n\n// this is exactly what std::vector does for you,\n// correctly, every time, including when an exception is thrown',
        note:'<b>Modern C++ answer: do not do this.</b> Use <code>std::vector</code>, or a smart pointer. Raw <code>new</code>/<code>delete</code> in new code is a code smell — but you must understand it, because it is what those tools are doing underneath.' },
      { h:'How a vector grows',
        p:['Since it cannot know the final size, it allocates some capacity and <b>doubles</b> when full — copying everything to the new block.'],

  /* ---- F9 ---- */
  { title:'RAII & Smart Pointers', mon:'The Exception Leak', emoji:'\u{1F6E1}️',
    taunt:'"You threw before your delete. I kept the memory."',
    lesson:[
      { h:'The most important idea in C++',
        key:'Give every resource to an <b>object</b>, and let that object clean up when it goes out of scope. You never write the cleanup, so you can never forget it.',
        p:['<b>Resource Acquisition Is Initialisation.</b> Terrible name, simple idea: <i>tie every resource to the lifetime of an object</i>, so the destructor releases it automatically.',
           'Memory, files, locks, sockets, database connections — all the same pattern.'],
        code:'// manual: fragile\nvoid f() {\n    int* p = new int[100];\n    doWork();              // if this THROWS, we never reach delete\n    delete[] p;            // LEAK\n}\n\n// RAII: correct by construction\nvoid f() {\n    vector<int> v(100);\n    doWork();              // throws? v\'s destructor still runs.\n}                          // freed. always.',
        note:'<b>This is why C++ does not need a garbage collector.</b> Destructors run deterministically, including while an exception unwinds the stack — so cleanup happens at a time you can predict.' },
      { h:'unique_ptr — sole ownership',
        p:['A pointer that deletes what it holds when it goes out of scope. Zero runtime overhead compared to a raw pointer.'],
        code:'#include <memory>\n\nunique_ptr<int> p = make_unique<int>(42);\ncout << *p << endl;        // use it like a pointer\n// no delete needed. ever.\n\n// unique_ptr<int> q = p;  // ERROR - cannot copy, only ONE owner\nunique_ptr<int> q = move(p);  // transfer ownership. p is now null.',
        note:'<b>The inability to copy it is the feature.</b> Ownership is explicit in the type, so the compiler enforces that exactly one thing is responsible for the cleanup.' },
      { h:'shared_ptr — shared ownership',
        p:['Keeps a reference count. The last one out deletes the object.'],
        code:'shared_ptr<int> a = make_shared<int>(42);\n{\n    shared_ptr<int> b = a;    // count 2\n}                             // b gone, count 1\n// a goes out of scope -> count 0 -> deleted',
        note:'<b>Prefer <code>unique_ptr</code>.</b> <code>shared_ptr</code> costs an atomic counter and invites unclear ownership. And two objects holding <code>shared_ptr</code>s to each other form a <b>cycle</b> that never reaches zero — use <code>weak_ptr</code> to break it.' },
      { h:'What to reach for, in order',
        p:[''],
        code:'1  a plain value on the stack        int x;  vector<int> v;\n2  a container                        vector, map, string\n3  unique_ptr                         one owner, heap lifetime\n4  shared_ptr                         genuinely shared ownership\n5  raw pointer                        NON-OWNING observation only\n6  new / delete                       almost never in new code',
        note:'<b>A raw pointer in modern C++ means "I am looking at this, I do not own it."</b> That convention makes ownership readable at a glance, which is most of what makes a C++ codebase maintainable.' },

      { t:'code', task:'Write <code>binarySearch(const int* arr, int n, int target)</code> on a sorted array. Return the index or −1.',

        expected:'3\n0\n-1',
        hint:'lo = 0, hi = n - 1, loop while lo <= hi. mid = lo + (hi - lo) / 2 — that form avoids the integer overflow that (lo + hi) / 2 can cause on huge ranges, and interviewers notice it.',
        solution:'#include <iostream>\nusing namespace std;\n\nint binarySearch(const int* arr, int n, int target) {\n    int lo = 0;\n    int hi = n - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (arr[mid] == target) {\n            return mid;\n        }\n        if (arr[mid] < target) {\n            lo = mid + 1;\n        } else {\n            hi = mid - 1;\n        }\n    }\n    return -1;\n}' },

        expected:'3\n1\n1',
        hint:'Handle n == 0 first. Then start count at 1 and add one every time arr[i] != arr[i-1]. Sorted input makes this O(n) instead of needing a set.',
        solution:'#include <iostream>\nusing namespace std;\n\nint countUnique(const int* arr, int n) {\n    if (n == 0) {\n        return 0;\n    }\n    int count = 1;\n    for (int i = 1; i < n; i++) {\n        if (arr[i] != arr[i - 1]) {\n            count++;\n        }\n    }\n    return count;\n}' }

  { title:'BOSS: The C++ Interview', mon:'The Systems Interviewer', emoji:'\u{1F480}', boss:true,
    taunt:'"What is the difference between a pointer and a reference? Take your time."',
    lesson:[
      { h:'The questions that repeat',
        p:['C++ interviews are unusually predictable, because the language has a small set of things that genuinely distinguish people who understand it. Be able to answer all of these out loud.'],
        code:'· pointer vs reference\n· stack vs heap\n· shallow vs deep copy\n· why a base destructor must be virtual\n· what RAII is, with an example\n· Rule of Three / Five / Zero\n· malloc/free vs new/delete\n· vector vs list, and why vector usually wins\n· what undefined behaviour is, and three examples\n· unique_ptr vs shared_ptr\n· pass by value vs const reference\n· what happens when a vector reallocates' },
        { h:'malloc versus new',
        p:['A favourite, because it separates people who learned C++ from people who learned C and kept going.'],
        code:'malloc/free   C. allocates raw bytes. does NOT call\n              constructors or destructors. returns void*.\n              returns null on failure.\n\nnew/delete    C++. allocates AND constructs. delete destructs\n              AND frees. type-safe. THROWS bad_alloc on failure.',
        note:'<b>Never mix them.</b> <code>free</code> on a <code>new</code>ed object skips the destructor; <code>delete</code> on <code>malloc</code>ed memory calls a destructor on something that was never constructed.' },
      { h:'How to answer "what is undefined behaviour?"',
        p:['<b>Not</b> "it crashes". UB means the standard imposes <i>no requirements at all</i> — so the compiler is allowed to assume it never happens and optimise on that basis.',
           'That is why UB can appear to work perfectly for a year and then break when you change an unrelated flag.'],
        code:'· reading an uninitialised variable\n· indexing out of bounds\n· dereferencing null or a dangling pointer\n· signed integer overflow\n· deleting twice, or mismatching new[]/delete\n· modifying a variable twice in one expression: i = i++;' },
      { h:'The behavioural half',
        p:['Systems teams ask the same behavioural questions as everyone else, plus one specific to the language: <i>"tell me about a memory bug you debugged."</i>',
           'If you do not have one, the manual-memory floors of this track plus a deliberate segfault in your local compiler will give you a real one.'] }
    ],
    encounters:[
      { t:'mcq', q:'Pointer versus reference — the sharpest distinction?',
        opts:['References are faster','A reference cannot be null and cannot be rebound after initialisation','Pointers are deprecated','References use less memory'], a:1,
        why:'Which is why references are preferred when the thing definitely exists, and pointers when null is legitimate or you need to reseat it.' },
      { t:'mcq', q:'<code>malloc</code> versus <code>new</code>?',
        opts:['Identical','new also calls constructors and is type-safe; malloc just returns raw bytes','malloc is faster','new is C-only'], a:1,
        why:'And never mix them — free skips the destructor, delete on malloc\'d memory destructs something never constructed.' },
      { t:'mcq', q:'What does "undefined behaviour" mean?',
        opts:['The program crashes','The standard imposes no requirements, so the compiler may assume it never happens','It returns a random value','It is implementation defined'], a:1,
        why:'This is why UB can work for a year and then break when you change an optimisation flag. "It crashes" is the wrong answer.' },
      { t:'mcq', q:'Why does <code>vector</code> usually beat <code>list</code> in practice?',
        opts:['Better algorithms','Contiguous memory is far friendlier to the CPU cache','list is deprecated','vector uses less memory'], a:1,
        why:'Cache locality dominates. vector often wins even at insertion-heavy work, where list looks theoretically better.' },
      { t:'mcq', q:'What is <code>i = i++;</code>?',
        opts:['Increments i','Undefined behaviour — i is modified twice in one expression','Equivalent to i++','A compile error'], a:1,
        why:'Classic UB. The sequencing rules do not define the result.' },
      { t:'code', task:'<b>Two Sum, sorted.</b> Write <code>twoSum(const int* arr, int n, int target)</code> printing the two indexes, or "none".',
        spec:'The array is sorted. Use two pointers — the interviewer will expect O(n) and O(1) extra space, not a nested loop.',
        starter:'#include <iostream>\nusing namespace std;\n\nvoid twoSum(const int* arr, int n, int target) {\n    // one index at each end\n}\n',
        harness:'int main() {\n    int a[4] = {2, 7, 11, 15};\n    twoSum(a, 4, 9);\n    int b[4] = {1, 2, 3, 4};\n    twoSum(b, 4, 7);\n    twoSum(b, 4, 99);\n    return 0;\n}',
        expected:'0 1\n2 3\nnone',
        hint:'left = 0, right = n - 1. Sum too small, move left up; too big, move right down; equal, print "left right" and return. Print "none" after the loop.',
        solution:'#include <iostream>\nusing namespace std;\n\nvoid twoSum(const int* arr, int n, int target) {\n    int left = 0;\n    int right = n - 1;\n    while (left < right) {\n        int sum = arr[left] + arr[right];\n        if (sum == target) {\n            cout << left << " " << right << endl;\n            return;\n        }\n        if (sum < target) {\n            left++;\n        } else {\n            right--;\n        }\n    }\n    cout << "none" << endl;\n}' },
      { t:'code', task:'Write <code>isPalindrome(const char* s)</code> using two pointers.',
        spec:'Remember <code>cout</code> prints a bool as 1 or 0.',
        starter:'#include <iostream>\n#include <cstring>\nusing namespace std;\n\nbool isPalindrome(const char* s) {\n    // two pointers from both ends\n}\n',
        harness:'int main() {\n    cout << isPalindrome("racecar") << endl;\n    cout << isPalindrome("hello") << endl;\n    cout << isPalindrome("") << endl;\n    return 0;\n}',
        expected:'1\n0\n1',
        hint:'strlen(s) gives the length. left = 0, right = len - 1; while left < right, compare and move inward. An empty string works for free because the loop never runs.',
        solution:'#include <iostream>\n#include <cstring>\nusing namespace std;\n\nbool isPalindrome(const char* s) {\n    int left = 0;\n    int right = strlen(s) - 1;\n    while (left < right) {\n        if (s[left] != s[right]) {\n            return false;\n        }\n        left++;\n        right--;\n    }\n    return true;\n}' },
      { t:'code', task:'Write <code>maxSubarray(const int* arr, int n)</code> — Kadane\'s algorithm.',
        spec:'The array may be all negative, in which case the answer is the least-negative element.',
        starter:'#include <iostream>\nusing namespace std;\n\nint maxSubarray(const int* arr, int n) {\n    // extend the run, or start fresh here?\n}\n',
        harness:'int main() {\n    int a[9] = {-2, 1, -3, 4, -1, 2, 1, -5, 4};\n    cout << maxSubarray(a, 9) << endl;\n    int b[1] = {-1};\n    cout << maxSubarray(b, 1) << endl;\n    int c[3] = {-3, -1, -2};\n    cout << maxSubarray(c, 3) << endl;\n    return 0;\n}',
        expected:'6\n-1\n-1',
        hint:'Start current = best = arr[0]. For each later element: current = max(arr[i], current + arr[i]); best = max(best, current). Starting at 0 breaks the all-negative case.',
        solution:'#include <iostream>\nusing namespace std;\n\nint maxSubarray(const int* arr, int n) {\n    int current = arr[0];\n    int best = arr[0];\n    for (int i = 1; i < n; i++) {\n        if (current + arr[i] > arr[i]) {\n            current = current + arr[i];\n        } else {\n            current = arr[i];\n        }\n        if (current > best) {\n            best = current;\n        }\n    }\n    return best;\n}' }
    ]},

  /* ---- F14 ---- */
  { title:'Templates & Generic Code', mon:'The Copy-Paste Twin', emoji:'\u{1F46C}',
    taunt:'"Write it once for int. Again for double. Again for float."',
    lesson:[
      { h:'Why templates exist',
        p:['Without them you would write <code>maxInt</code>, <code>maxDouble</code>, <code>maxFloat</code> — identical code, three times. A template writes it once and lets the compiler generate the versions you actually use.'],
        code:'template <typename T>\nT maxOf(T a, T b) {\n    return (a > b) ? a : b;\n}\n\ncout << maxOf(3, 7) << endl;         // T deduced as int\ncout << maxOf(2.5, 1.5) << endl;     // T deduced as double',
        note:'<b>This happens at compile time.</b> The compiler generates a separate real function for each type you use — so there is <i>no</i> runtime cost, unlike generics in some other languages.' },
      { h:'Class templates',
        p:['This is what the whole STL is. <code>vector&lt;int&gt;</code> and <code>vector&lt;string&gt;</code> are two different classes generated from one template.'],
        code:'template <typename T>\nclass Box {\n    T item;\npublic:\n    Box(T value) : item(value) {}\n    T get() const { return item; }\n};\n\nBox<int> a(42);\nBox<string> b("hello");',
        note:'<b>Templates normally live entirely in header files.</b> The compiler needs the full definition to generate each instantiation, which is why you cannot split a template across .h and .cpp the usual way — and why C++ builds are slow.' },
      { h:'The error messages',
        p:['A single mistake inside a template can produce hundreds of lines of error referencing types you never wrote. It is the language\'s most notorious weakness.'],
        code:'// one wrong type in a sort comparator can produce\n// 200 lines mentioning __normal_iterator and _Rb_tree\n\n// SURVIVAL RULES:\n// 1. read the FIRST error, ignore the rest\n// 2. find the line in YOUR file, not in the header\n// 3. the real message is usually "no match for operator<"\n//    buried in the middle',
        note:'<b>C++20 concepts</b> exist specifically to fix this, by letting you state the requirements up front so the error says "your type has no operator&lt;" instead of vomiting the standard library at you.' },
      { h:'auto, and when to use it',
        p:['<code>auto</code> asks the compiler to work the type out. Essential once template types get long.'],
        code:'auto x = 5;                       // int\nauto it = v.begin();              // saves writing the full type\nfor (const auto& item : v) { }    // the standard idiom\n\n// but be careful:\nauto y = someFunction();          // what type IS this?',
        note:'<b>Use <code>auto</code> when the type is obvious from the right-hand side or too long to be useful.</b> Avoid it when it hides something a reader needs to know.' }
    ],
    encounters:[
      { t:'mcq', q:'When is a template instantiated?',
        opts:['At runtime','At compile time — the compiler generates a real function per type used','When first called','Never'], a:1,
        why:'Which is why templates have no runtime cost, and why they make compilation slow.' },
      { t:'mcq', q:'Why do templates usually live entirely in header files?',
        opts:['Convention','The compiler needs the full definition to generate each instantiation','Headers are faster','They do not'], a:1,
        why:'You cannot split a template across .h and .cpp the usual way — the definition must be visible wherever it is used.' },
      { t:'mcq', q:'What is <code>std::vector</code>?',
        opts:['A built-in type','A class template instantiated for each element type','A macro','A function'], a:1,
        why:'vector<int> and vector<string> are two distinct classes generated from one template. The STL is templates all the way down.' },
      { t:'mcq', q:'You get 200 lines of template error. What do you do?',
        opts:['Read all of it','Read the FIRST error and find the line in your own file','Turn off templates','Rewrite in C'], a:1,
        why:'The real message is usually something like "no match for operator<" buried in the middle. C++20 concepts exist to fix exactly this.' },
      { t:'mcq', q:'When should you avoid <code>auto</code>?',
        opts:['Always','When it hides a type the reader genuinely needs to know','In loops','With templates'], a:1,
        why:'auto is great for iterators and long template types, and bad when it obscures something important.' },
      { t:'code', task:'Write <code>maxOfThree(int a, int b, int c)</code> — the concrete version a template would generalise.',
        starter:'#include <iostream>\nusing namespace std;\n\nint maxOfThree(int a, int b, int c) {\n    // your code here\n}\n',
        harness:'int main() {\n    cout << maxOfThree(1, 9, 4) << endl;\n    cout << maxOfThree(-5, -2, -9) << endl;\n    cout << maxOfThree(3, 3, 3) << endl;\n    return 0;\n}',
        expected:'9\n-2\n3',
        hint:'Track a running biggest, comparing against b then c. Now imagine writing this again for double and float — that is what templates remove.',
        solution:'#include <iostream>\nusing namespace std;\n\nint maxOfThree(int a, int b, int c) {\n    int biggest = a;\n    if (b > biggest) {\n        biggest = b;\n    }\n    if (c > biggest) {\n        biggest = c;\n    }\n    return biggest;\n}' }
    ]},

  /* ---- F15 ---- */
  { title:'Move Semantics & Modern C++', mon:'The Needless Copy', emoji:'\u{1F69A}',
    taunt:'"Ten megabytes. Copied. Then immediately destroyed. Beautiful."',
    lesson:[
      { h:'The problem moves solve',
        p:['Returning a large object used to copy every byte and then destroy the original — pure waste. C++11 added the ability to <b>steal</b> the internals instead.'],
        code:'vector<int> makeBig() {\n    vector<int> v(1000000);\n    return v;              // pre-2011: copy a million ints\n}                          // now: the buffer is MOVED, O(1)\n\n// a move just transfers the internal pointer and\n// leaves the source in a valid, empty state',
        note:'<b>A move is a pointer swap.</b> The moved-from object is left valid but unspecified — you may destroy it or assign to it, but you should not read its value.' },
      { h:'lvalues, rvalues and &&',
        p:['An <b>lvalue</b> has a name and a place you can point at. An <b>rvalue</b> is a temporary about to disappear. <code>T&&</code> binds to rvalues, which is how the compiler knows stealing is safe.'],
        code:'int x = 5;\n\nx        lvalue - has a name and an address\n5        rvalue - a temporary\nx + 1    rvalue\nmakeBig() rvalue - about to be destroyed anyway\n\nvoid take(const T& t);   // binds to anything - copies\nvoid take(T&& t);        // binds to rvalues  - can steal' },
      { h:'std::move does not move anything',
        p:['It is a <b>cast</b>. It says "treat this as a temporary, you may steal from it". The actual moving happens in the move constructor.'],
        code:'vector<int> a = {1, 2, 3};\nvector<int> b = move(a);      // b steals a\'s buffer\n\n// a is now valid but unspecified.\n// a.size() is legal. relying on the value is not.\n\n// DO NOT do this:\nprocess(move(a));\nprocess(move(a));             // a was already gutted',
        note:'<b>Do not <code>move</code> a local you are returning.</b> <code>return move(v);</code> actually <i>prevents</i> the compiler optimisation that would have avoided the move entirely. Just <code>return v;</code>.' },
      { h:'The modern style, in one page',
        p:['If you write C++ like this you will be writing it better than a lot of working code.'],
        code:'auto                   let the compiler deduce obvious types\nnullptr                never NULL or 0\nrange-for              for (const auto& x : v)\nvector / string        never raw arrays or char*\nunique_ptr             never raw new/delete\nconst&                 for anything large you only read\n= default / = delete   be explicit about special members\noverride               on every overridden virtual\nenum class             never plain enum - it leaks its names\nconstexpr              never #define for constants\nstructured bindings    auto [key, value] : myMap' },
      { h:'What to say in an interview',
        p:['"Modern C++" means C++11 and later. If asked what you like about it, the strongest answer is about <b>safety without cost</b>: RAII and smart pointers remove whole categories of bug, move semantics removed a whole category of waste, and none of it costs anything at runtime.'] }
    ],
    encounters:[
      { t:'mcq', q:'What does a move actually do?',
        opts:['Copies then deletes','Transfers the internals — usually a pointer swap — leaving the source valid but empty','Renames the variable','Nothing'], a:1,
        why:'O(1) instead of O(n). The moved-from object is valid but you should not rely on its value.' },
      { t:'mcq', q:'What does <code>std::move</code> do?',
        opts:['Moves the object','Nothing at runtime — it is a cast saying "you may steal from this"','Copies it','Frees memory'], a:1,
        why:'The actual work happens in the move constructor that the cast enables.' },
      { t:'mcq', q:'What is an rvalue?',
        opts:['A variable','A temporary with no name you can take the address of','A reference','A constant'], a:1,
        why:'Temporaries are about to be destroyed anyway, which is why stealing from them is safe. T&& binds to them.' },
      { t:'mcq', q:'Why is <code>return move(v);</code> a mistake?',
        opts:['It does not compile','It prevents the optimisation that would have avoided the move entirely','It copies','move cannot be used on locals'], a:1,
        why:'Just return v. The compiler already handles it better than you can by hand.' },
      { t:'mcq', q:'Why prefer <code>enum class</code> over a plain <code>enum</code>?',
        opts:['Shorter','It is scoped and does not implicitly convert to int, so its names cannot collide','It is faster','Plain enum was removed'], a:1,
        why:'A plain enum leaks its enumerator names into the surrounding scope and silently converts to int.' },
      { t:'code', task:'Write <code>sumRange(const int* begin, const int* end)</code> — the iterator-range style every STL algorithm uses.',
        spec:'The range is half-open: <code>begin</code> is included, <code>end</code> is one past the last element. This is exactly how <code>std::accumulate</code> works.',
        starter:'#include <iostream>\nusing namespace std;\n\nint sumRange(const int* begin, const int* end) {\n    // walk the pointer from begin up to (not including) end\n}\n',
        harness:'int main() {\n    int a[5] = {1, 2, 3, 4, 5};\n    cout << sumRange(a, a + 5) << endl;\n    cout << sumRange(a + 1, a + 3) << endl;\n    cout << sumRange(a, a) << endl;\n    return 0;\n}',
        expected:'15\n5\n0',
        hint:'for (const int* p = begin; p != end; p++) total += *p; — note the empty range works for free, which is exactly why ranges are half-open.',
        solution:'#include <iostream>\nusing namespace std;\n\nint sumRange(const int* begin, const int* end) {\n    int total = 0;\n    for (const int* p = begin; p != end; p++) {\n        total += *p;\n    }\n    return total;\n}' }
    ]},

  /* ---- F16 FINAL BOSS ---- */
  { title:'FINAL BOSS: Undefined Behaviour', mon:'The Segfault', emoji:'\u{1F480}', boss:true,
    taunt:'"It worked on your machine. It worked for a year. Then I changed -O2 to -O3."',
    lesson:[
      { h:'Why C++ crashes are different',
        p:['In Python an error stops the program and tells you the line. In C++ a memory bug may not crash at all — it may quietly corrupt something and surface a thousand lines later, in code that is completely correct.',
           'That gap between <i>where the bug is</i> and <i>where it shows up</i> is the whole difficulty of debugging C++.'] },
      { h:'The UB catalogue',
        p:['Learn to recognise these on sight. Every one is something a compiler is allowed to assume never happens.'],
        code:'· reading an uninitialised variable\n· indexing out of bounds\n· dereferencing null or a dangling pointer\n· use after free / use after delete\n· double delete, or new[] paired with delete\n· signed integer overflow\n· dividing by zero\n· returning a reference or pointer to a local\n· modifying a variable twice in one expression\n· forgetting a return in a non-void function' },
      { h:'The tools that find them for you',
        p:['<b>Sanitizers are the single biggest upgrade to your debugging.</b> They turn silent corruption into an immediate, precise error with a stack trace, at the cost of running slower.'],
        code:'g++ -fsanitize=address,undefined -g main.cpp -o main\n./main\n\n// prints things like:\n//   ERROR: AddressSanitizer: heap-buffer-overflow\n//   READ of size 4 at 0x... \n//   #0 in sumArray(int*, int) main.cpp:12\n\nvalgrind ./main          // finds leaks (Linux/Mac)\ngdb ./main               // step through a crash',
        note:'<b>Run your assignments with sanitizers on.</b> They will find bugs that pass every test you wrote, and they name the exact line.' },
      { h:'Reading a segfault',
        p:['A segmentation fault means you touched memory you do not own. In practice it is nearly always one of four things.'],
        code:'1  dereferencing a null pointer\n2  dereferencing a dangling pointer (used after free)\n3  writing past the end of an array\n4  infinite recursion overflowing the stack\n\n// under gdb:  run, then when it crashes:  bt\n// that prints the call stack. the top frame is where it died.' },
      { h:'The habits that prevent all of it',
        p:[''],
        code:'· compile with -Wall -Wextra and treat warnings as errors\n· initialise EVERY variable at declaration\n· use vector and string, never raw arrays and char*\n· use smart pointers, never raw new/delete\n· set pointers to nullptr after deleting\n· use .at() when the index came from outside\n· run with sanitizers during development',
        note:'<b>Nearly every item is "use the modern tool instead of the raw one".</b> That is the real lesson of this track: C++ gives you the low-level machinery so you understand what is happening, and then gives you safe abstractions so you do not have to hand-manage it.' }
    ],
    encounters:[
      { t:'mcq', q:'A memory bug in C++ often surfaces:',
        opts:['Immediately at the bug','Far from where the bug actually is, sometimes much later','Only in release builds','Never'], a:1,
        why:'That gap between cause and symptom is the entire difficulty of debugging C++, and why sanitizers are so valuable.' },
      { t:'mcq', q:'What does <code>-fsanitize=address</code> do?',
        opts:['Encrypts memory','Turns silent memory corruption into an immediate error with a stack trace','Makes it faster','Removes bounds checks'], a:1,
        why:'It finds bugs that pass every test you wrote, and names the exact line. Use it on your coursework.' },
      { t:'mcq', q:'Most common cause of a segmentation fault?',
        opts:['Slow code','Dereferencing a null or dangling pointer, or writing past an array','Too many variables','A missing header'], a:1,
        why:'Infinite recursion overflowing the stack is the fourth common cause.' },
      { t:'mcq', q:'Your code works in debug and breaks with <code>-O2</code>. Most likely cause?',
        opts:['A compiler bug','Undefined behaviour the optimiser is now assuming cannot happen','A missing library','Bad luck'], a:1,
        why:'This is the signature of UB. The optimiser is entitled to assume it never occurs, and reasons from there.' },
      { t:'mcq', q:'Best single habit for avoiding UB?',
        opts:['Write more comments','Use vector, string and smart pointers instead of raw arrays and new/delete','Avoid functions','Use more casts'], a:1,
        why:'Almost every prevention rule reduces to "use the safe abstraction". That is the whole point of modern C++.' },
      { t:'code', task:'<b>Fix the off-by-one.</b> This writes one element past the end of the array.',
        spec:'A 5-element array has valid indexes 0 to 4. Find the wrong comparison.',
        starter:'#include <iostream>\nusing namespace std;\n\nvoid fill(int* arr, int n) {\n    for (int i = 0; i <= n; i++) {\n        arr[i] = i * 10;\n    }\n}\n',
        harness:'int main() {\n    int a[5] = {0, 0, 0, 0, 0};\n    fill(a, 5);\n    for (int i = 0; i < 5; i++) {\n        cout << a[i] << endl;\n    }\n    return 0;\n}',
        expected:'0\n10\n20\n30\n40',
        hint:'i <= n runs with i equal to n, which is one past the last valid index. Use i < n. This exact bug is behind a large share of historic security vulnerabilities.',
        solution:'#include <iostream>\nusing namespace std;\n\nvoid fill(int* arr, int n) {\n    for (int i = 0; i < n; i++) {\n        arr[i] = i * 10;\n    }\n}' },
      { t:'code', task:'<b>Fix the uninitialised variable.</b> This returns garbage.',
        spec:'A local variable in C++ is not zero-initialised. It contains whatever was in that memory.',
        starter:'#include <iostream>\nusing namespace std;\n\nint sumAll(const int* arr, int n) {\n    int total;\n    for (int i = 0; i < n; i++) {\n        total += arr[i];\n    }\n    return total;\n}\n',
        harness:'int main() {\n    int a[4] = {1, 2, 3, 4};\n    cout << sumAll(a, 4) << endl;\n    return 0;\n}',
        expected:'10',
        hint:'int total = 0; — the fix is one character. -Wall warns about this, which is why you always compile with it.',
        solution:'#include <iostream>\nusing namespace std;\n\nint sumAll(const int* arr, int n) {\n    int total = 0;\n    for (int i = 0; i < n; i++) {\n        total += arr[i];\n    }\n    return total;\n}' },
      { t:'code', task:'<b>Fix the silent wrong answer.</b> This should return the average as a decimal.',
        spec:'No crash, no warning, wrong result. Work through the types by hand.',
        starter:'#include <iostream>\nusing namespace std;\n\ndouble average(const int* arr, int n) {\n    int total = 0;\n    for (int i = 0; i < n; i++) {\n        total += arr[i];\n    }\n    return total / n;\n}\n',
        harness:'int main() {\n    int a[4] = {1, 2, 3, 4};\n    cout << average(a, 4) << endl;\n    int b[3] = {1, 2, 2};\n    cout << average(b, 3) << endl;\n    return 0;\n}',
        expected:'2.5\n1.66667',
        hint:'total and n are both ints, so the division truncates BEFORE the double return type ever applies. Cast: (double)total / n. Note cout prints 6 significant digits, hence 1.66667.',
        solution:'#include <iostream>\nusing namespace std;\n\ndouble average(const int* arr, int n) {\n    int total = 0;\n    for (int i = 0; i < n; i++) {\n        total += arr[i];\n    }\n    return (double)total / n;\n}' },
      { t:'code', task:'<b>Final strike.</b> Write <code>safeGet(const int* arr, int n, int index, int fallback)</code> — bounds-checked access.',
        spec:'Return the element if the index is valid, otherwise the fallback. This is <code>.at()</code>, by hand.',
        starter:'#include <iostream>\nusing namespace std;\n\nint safeGet(const int* arr, int n, int index, int fallback) {\n    // guard BOTH ends\n}\n',
        harness:'int main() {\n    int a[3] = {10, 20, 30};\n    cout << safeGet(a, 3, 1, -1) << endl;\n    cout << safeGet(a, 3, 5, -1) << endl;\n    cout << safeGet(a, 3, -2, -1) << endl;\n    cout << safeGet(a, 3, 0, -1) << endl;\n    return 0;\n}',
        expected:'20\n-1\n-1\n10',
        hint:'if (index < 0 || index >= n) return fallback; — the negative case is the one people forget, and it is just as much a buffer overrun.',
        solution:'#include <iostream>\nusing namespace std;\n\nint safeGet(const int* arr, int n, int index, int fallback) {\n    if (index < 0 || index >= n) {\n        return fallback;\n    }\n    return arr[index];\n}' }
    ]}
  ]};

  { title:'GitHub & The Team Workflow', mon:'The Merge Conflict', emoji:'\u{1F500}',

      { h:'Local and remote',

        note:'<b>Authentication:</b> GitHub stopped accepting passwords in 2021. The easiest route now is the GitHub CLI: install <code>gh</code> from <code>cli.github.com</code>, run <code>gh auth login</code>, follow the browser prompt, done. It handles credentials for you.' },
      { h:'Branches: work without breaking main',

        code:'1  git checkout -b fix/empty-list-crash\n2  ...make your change, commit it...\n3  git push -u origin fix/empty-list-crash\n4  gh pr create --fill        (or click the link GitHub prints)\n5  reviewer comments; you push more commits to the same branch\n6  merge on GitHub\n7  git checkout main && git pull\n8  git branch -d fix/empty-list-crash',
        note:'<b>The <code>-u</code> in step 3</b> links your local branch to the remote one, so future pushes are just <code>git push</code>. GitHub prints a clickable URL to open the PR — you rarely need step 4\'s command.' },
      { h:'Merge conflicts, and why they are not scary',
        p:['A conflict happens when two branches changed the <b>same lines</b>. Git cannot guess which version wins, so it stops and asks. It marks the file like this:'],
        code:'<<<<<<< HEAD\nprint("hello from main")\n=======\nprint("hello from my branch")\n>>>>>>> feature/greeting',
        note:'<b>To resolve:</b> delete the three marker lines and leave the code you want — which may be one side, the other, or a combination. Then <code>git add</code> the file and <code>git commit</code>. That is the entire process. It looks alarming and it is genuinely simple.' },

    ],
    encounters:[
      { t:'mcq', q:'What is a pull request?',
        opts:['A request to download code','A proposal to merge your branch, opened for review','A way to delete a branch','A Git command'], a:1,

      { t:'fill', q:'Create a new branch and switch to it in one command.',
        code:'git checkout ___ feature/login', answers:['-b'],
        why:'-b creates the branch first. Without it, checkout only switches to a branch that already exists.' },
      { t:'mcq', q:'You see <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> in your file. What happened?',
        opts:['The file is corrupted','A merge conflict — two branches changed the same lines','Git crashed','You need to reinstall Git'], a:1,

      { t:'mcq', q:'Why is <code>git push --force</code> dangerous on a shared branch?',

      { t:'do', task:'Put a repository on GitHub with a real README',

  { title:'Reading Code You Did Not Write', mon:'The Legacy Codebase', emoji:'\u{1F4DA}',
