{
  title:"CAPSTONE: The Game's Data Layer", emoji:'\u{1F3C6}', need:13, capstone:true,
  blurb:'Design and query the database behind Debug Dungeon: players, questions, and every attempt. Then answer the questions a real product team would ask of it.',
  why:'Every app you have used runs on a schema like this. Designing one — and then extracting insight from it — is the difference between writing queries and understanding data.',
  brief:'<b>The schema is provided at the top of every step</b>, because each run rebuilds the database from scratch. Your job is the query underneath. Read the tables carefully before you start: <code>attempts</code> is the interesting one, because it records the <i>events</i>, and everything worth knowing is derived from it.',
  done:'<b>You just built the analytics layer of the game you are playing.</b><br><br>Look at what your last three queries answer: who is winning, who is struggling, and which content is too hard. That is a product dashboard. Every game, app and service you use runs queries like these constantly.<br><br>Notice the design too: <code>attempts</code> stores individual <i>events</i>, not summaries. Scores and accuracy are <b>derived</b>, never stored. That means you can ask a question next month that nobody thought of today — which is the single most important idea in data modelling.<br><br><b>Extend it:</b> add a timestamp to attempts and chart accuracy over time, add a floors table with unlock rules, and build a "recommended next floor" query per player.',
  steps:[
    { label:'1. Read the schema',
      brief:'<p>Start by understanding the shape. Three tables: who plays, what they answer, and every attempt that links the two. Confirm you can navigate it before you analyse it.</p><p>Note the <code>correct</code> column is <code>0</code> or <code>1</code> — SQLite has no boolean type, and storing it as an integer means <code>SUM(correct)</code> counts successes for free.</p>',
      task:'Return player <code>name</code> and <code>xp</code>, highest XP first.',
      starter:"CREATE TABLE players (id INTEGER PRIMARY KEY, name TEXT, xp INTEGER, level INTEGER);\nINSERT INTO players VALUES (1,'Taj',450,5),(2,'Ada',780,8),(3,'Grace',120,2);\n\nCREATE TABLE questions (id INTEGER PRIMARY KEY, prompt TEXT, floor INTEGER, topic TEXT);\nINSERT INTO questions VALUES\n (1,'What does print do?',1,'basics'),\n (2,'First index of a list?',9,'lists'),\n (3,'Big-O of one loop?',12,'complexity');\n\nCREATE TABLE attempts (id INTEGER PRIMARY KEY, player_id INTEGER, question_id INTEGER, correct INTEGER, hints_used INTEGER);\nINSERT INTO attempts VALUES\n (1,1,1,1,0),(2,1,2,0,1),(3,1,2,1,1),\n (4,2,1,1,0),(5,2,2,1,0),(6,2,3,0,0),\n (7,3,1,0,2),(8,3,1,1,2),(9,3,3,0,0);\n\nSELECT ",
      ordered:true, expected:[['Ada','780'],['Taj','450'],['Grace','120']],
      hint:'SELECT name, xp FROM players ORDER BY xp DESC;',
      solution:'SELECT name, xp FROM players ORDER BY xp DESC;' },

    { label:'2. The leaderboard',
      brief:'<p>A ranked board is a window function, not a sort. The rank has to be a real column so the interface can display "#2" next to a name — sorting alone does not give you that number.</p>',
      task:'Return <code>name</code>, <code>xp</code>, <code>level</code> and rank (1 = highest XP).',
      starter:"CREATE TABLE players (id INTEGER PRIMARY KEY, name TEXT, xp INTEGER, level INTEGER);\nINSERT INTO players VALUES (1,'Taj',450,5),(2,'Ada',780,8),(3,'Grace',120,2);\n\nSELECT ",
      ordered:true,
      expected:[['Ada','780','8','1'],['Taj','450','5','2'],['Grace','120','2','3']],
      hint:'RANK() OVER (ORDER BY xp DESC) as a fourth column, then ORDER BY xp DESC.',
      solution:'SELECT name, xp, level,\n       RANK() OVER (ORDER BY xp DESC)\nFROM players\nORDER BY xp DESC;' },

    { label:'3. Who is struggling?',
      brief:'<p>Now the derived data. Nobody stores "accuracy" — you calculate it from the attempt log. Because <code>correct</code> is 0 or 1, <code>SUM(correct)</code> gives you the number right without needing a CASE.</p>',
      task:'Return each player <code>name</code>, their number of attempts, and how many were correct.',
      starter:"CREATE TABLE players (id INTEGER PRIMARY KEY, name TEXT, xp INTEGER, level INTEGER);\nINSERT INTO players VALUES (1,'Taj',450,5),(2,'Ada',780,8),(3,'Grace',120,2);\n\nCREATE TABLE attempts (id INTEGER PRIMARY KEY, player_id INTEGER, question_id INTEGER, correct INTEGER, hints_used INTEGER);\nINSERT INTO attempts VALUES\n (1,1,1,1,0),(2,1,2,0,1),(3,1,2,1,1),\n (4,2,1,1,0),(5,2,2,1,0),(6,2,3,0,0),\n (7,3,1,0,2),(8,3,1,1,2),(9,3,3,0,0);\n\nSELECT ",
      ordered:false,
      expected:[['Taj','3','2'],['Ada','3','2'],['Grace','3','1']],
      hint:'JOIN attempts to players, GROUP BY p.name, then COUNT(*) and SUM(a.correct).',
      solution:'SELECT p.name, COUNT(*), SUM(a.correct)\nFROM players p\nJOIN attempts a ON p.id = a.player_id\nGROUP BY p.name;' },

    { label:'4. Which content is too hard?',
      brief:'<p>The question a game designer asks. Flip the grouping from players to questions and the same table answers a completely different question — which is exactly why you store events rather than summaries.</p>',
      task:'Return each question <code>prompt</code>, attempts, and correct answers — worst-performing first.',
      starter:"CREATE TABLE questions (id INTEGER PRIMARY KEY, prompt TEXT, floor INTEGER, topic TEXT);\nINSERT INTO questions VALUES\n (1,'What does print do?',1,'basics'),\n (2,'First index of a list?',9,'lists'),\n (3,'Big-O of one loop?',12,'complexity');\n\nCREATE TABLE attempts (id INTEGER PRIMARY KEY, player_id INTEGER, question_id INTEGER, correct INTEGER, hints_used INTEGER);\nINSERT INTO attempts VALUES\n (1,1,1,1,0),(2,1,2,0,1),(3,1,2,1,1),\n (4,2,1,1,0),(5,2,2,1,0),(6,2,3,0,0),\n (7,3,1,0,2),(8,3,1,1,2),(9,3,3,0,0);\n\nSELECT ",
      ordered:true,
      expected:[['Big-O of one loop?','2','0'],['First index of a list?','3','2'],['What does print do?','4','3']],
      hint:'JOIN attempts to questions, GROUP BY q.prompt, then ORDER BY SUM(a.correct) ASC.',
      solution:'SELECT q.prompt, COUNT(*), SUM(a.correct)\nFROM questions q\nJOIN attempts a ON q.id = a.question_id\nGROUP BY q.prompt\nORDER BY SUM(a.correct) ASC;' },

    { label:'5. The full dashboard',
      brief:'<p><b>Final strike.</b> One query, everything a product team wants on one screen: activity, success, and how much help each player needed. Hint usage is a signal in its own right — Grace used four hints across three attempts and still scored lowest, which tells you something no XP number would.</p>',
      task:'Return every player <code>name</code>, total attempts, correct answers, and total hints used.',
      starter:"CREATE TABLE players (id INTEGER PRIMARY KEY, name TEXT, xp INTEGER, level INTEGER);\nINSERT INTO players VALUES (1,'Taj',450,5),(2,'Ada',780,8),(3,'Grace',120,2);\n\nCREATE TABLE attempts (id INTEGER PRIMARY KEY, player_id INTEGER, question_id INTEGER, correct INTEGER, hints_used INTEGER);\nINSERT INTO attempts VALUES\n (1,1,1,1,0),(2,1,2,0,1),(3,1,2,1,1),\n (4,2,1,1,0),(5,2,2,1,0),(6,2,3,0,0),\n (7,3,1,0,2),(8,3,1,1,2),(9,3,3,0,0);\n\nSELECT ",
      ordered:false,
      expected:[['Taj','3','2','2'],['Ada','3','2','0'],['Grace','3','1','4']],
      hint:'Same JOIN and GROUP BY as step 3, with SUM(a.hints_used) as a fourth column.',
      solution:'SELECT p.name,\n       COUNT(*),\n       SUM(a.correct),\n       SUM(a.hints_used)\nFROM players p\nJOIN attempts a ON p.id = a.player_id\nGROUP BY p.name;' }
  ]
}];

        ['git push -u origin fix/issue-123','push your branch'],
        ['gh pr create --fill','open the pull request'],
        ['git commit --amend','tidy a commit before pushing']
      ],
      steps:[
        'Push the branch, then open the PR. In the description: what it does, why, which issue it closes (<code>Closes #123</code>), and how you tested it.',
        'Check their PR template if one appears and fill in every section.',
        'Wait patiently. Days is normal. <b>Do not bump the thread after 24 hours.</b>',
        'When review comes, <b>reply to every comment</b>, even just "done" or "good catch".',
        'Accept nearly all feedback without argument. You are the guest and they know the codebase.',
        'If you genuinely disagree, say so with reasoning and a question: "I chose X because Y — would Z be better here?" Never defensive.',
        'Push follow-up commits to the same branch; the PR updates automatically.',
        'When it merges, <b>say thank you.</b> Then note the PR link — that is now a portfolio item and a ready-made interview story.'
      ],
      trap:'<b>If it gets rejected, that is not failure.</b> Ask what would have made it mergeable, thank them, and apply it next time. Plenty of experienced engineers have had PRs closed.',
      proof:'A public pull request link — merged, or with review feedback you responded to properly.' }

{
  title:'The Portfolio Project That Gets Read', emoji:'\u{1F4BC}', need:10,
  blurb:'One substantial project built the way a real one is built: designed first, tested, documented, deployed, monitored, and written up as a case study you can talk through for twenty minutes.',
  why:'Three to five documented projects is the stated bar, and recruiters want scalability and personalisation rather than another CRUD app. This is the one that anchors your résumé.',
  brief:'<b>The difference between a project and a portfolio project is everything around the code:</b> the decisions you can defend, the tradeoffs you can name, and the write-up that lets someone understand it without running it.',
  done:'You have the project you will talk about in every interview for the next two years — and, more importantly, the ability to talk about it in terms of <b>decisions and tradeoffs</b> rather than a feature list. That is the difference between a candidate and a hire.<br><br><b>Now reuse it.</b> It is story 1 and story 6 in your bank, the top item on your résumé, and your answer to "what have you built?"',
  steps:[
    { t:'do', label:'1. Design it before you build it',
      task:'Write the one-pager first',
      why:'Interviewers ask "why did you build it that way?". If the answer is "I did not think about it", the project stops being an asset. Twenty minutes of design gives you twenty minutes of interview material.',
      setup:'One page. Written before any code. This document becomes the case study later.',
      steps:[
        '<b>The problem</b>, in two sentences. Who has it, and why current options are annoying.',
        '<b>Who it is for.</b> "Students at NC A&T who..." beats "users".',
        '<b>The core feature</b> — singular. What must work for this to be worth existing.',
        '<b>The data model.</b> What things exist, what fields they have, how they relate. Sketch the tables.',
        '<b>The stack, with reasons.</b> Not "Python because I know it" — "Postgres because the data is relational and I need transactions."',
        '<b>Three tradeoffs you are consciously making</b>, and what you would do differently at 100× the scale. <b>This is the section interviewers care about most.</b>',
        '<b>Out of scope.</b> Written down, so you can stop yourself later.'
      ],
      trap:'<b>Do not build another to-do app, weather app or Netflix clone.</b> They signal that you followed a tutorial. Something tied to a real problem — even a small one — is instantly more interesting to discuss.',
      proof:'A one-page design doc written before any code, including three named tradeoffs.' },

    { t:'do', label:'2. Build it with tests from the start',
      task:'Implement the core feature, with a test suite growing alongside it',
      why:'Tests added at the end are always thin. Tests written alongside shape the design — and a tested repo is one of the cheapest professionalism signals you can send.',
      cmds:[
        ['pytest','run the suite'],
        ['pytest -v','see each test by name'],
        ['pip freeze > requirements.txt','keep dependencies recorded']
      ],
      steps:[
        'Build the <b>core feature only</b>, end to end, before anything else. A thin slice that works beats three half-features.',
        'Write a test for each piece of real logic as you finish it. Cover the boundaries from floor 6: empty, one, the threshold, negative, duplicate.',
        'Keep functions small enough to test. <b>If something is hard to test, that is a design signal</b>, not a testing problem.',
        'Handle errors deliberately: what happens on bad input, a missing file, a failed network call? Decide, do not discover.',
        'Never hardcode a secret. Environment variables from day one.',
        'Commit on branches, one logical change at a time, with real messages.',
        'Once the core works, add features one at a time — each on its own branch, each with tests.',
        'Stop when your definition of done is met. <b>Ship it. Version two can come later.</b>'
      ],
      proof:'A working core feature, a passing test suite covering the real logic, and a clean commit history.' },

    { t:'do', label:'3. Deploy it and watch it break',
      task:'Get it live, then find out what production teaches you',
      why:'"Works on my machine" is the oldest joke in software because deployment always surfaces something. Having felt that once is a real differentiator at junior level.',
      steps:[
        'Deploy to Render, Railway, Vercel or Streamlit Cloud — whichever fits. Set every secret in their dashboard.',
        'Open the live URL on your phone. Find what is broken there.',
        'Deliberately feed it bad input: empty forms, absurd numbers, emoji, a 10MB file. <b>Fix whatever crashes.</b>',
        'Add basic logging so you can see what happened when something fails. <code>print</code> is a start; the <code>logging</code> module is the real answer.',
        'Add a health check or status page — even a route that returns "ok".',
        'Give the link to three people with <b>no instructions</b> and watch. Where they hesitate is a bug.',
        'Fix the top three things you observed. Not the ones you imagined — the ones you saw.',
        'Note down every difference between local and production. That list is an interview answer to "what did you learn?"'
      ],
      trap:'<b>Watching someone use it without helping them is uncomfortable and irreplaceable.</b> Do not explain. Just watch where they pause.',
      proof:'A live URL that survives bad input, works on a phone, and has been used by someone who is not you.' },

    { t:'do', label:'4. Write the case study',
      task:'Turn the project into something a stranger can evaluate in two minutes',
      why:'Most people never run your code. The write-up <i>is</i> the project as far as a recruiter is concerned — and it proves you can communicate technical decisions, which is repeatedly named as the junior differentiator.',
      setup:'This goes in the README, and again as a post on your blog, LinkedIn or dev.to. Same content, two homes.',
      steps:[
        'Open with the problem and a screenshot. Not the tech stack — <b>nobody cares about the stack until they care about the problem.</b>',
        'Live link, immediately below.',
        'Write "How it works" with a small architecture sketch. A hand-drawn box diagram photographed with your phone is completely acceptable.',
        'Write <b>"Decisions and tradeoffs"</b> — the section that matters. Three choices, why you made each, and what you gave up.',
        'Write "What I would do at 100× the traffic". Even if speculative, it shows you think past today.',
        'Write "What went wrong" honestly — the bug that took a day, the thing you rebuilt. <b>This reads as maturity and gives you a failure story for your bank.</b>',
        'Add exact local setup steps, then test them in a fresh clone.',
        'Post it publicly and link it from your GitHub profile README.'
      ],
      proof:'A README with screenshot, live link, architecture sketch, and a decisions-and-tradeoffs section — plus one public post.' },

    { t:'do', label:'5. Rehearse talking about it',
      task:'Be able to walk through it for twenty minutes without notes',
      why:'"Tell me about a project you built" is asked in nearly every interview. Most candidates list features for ninety seconds and stop. Walking through decisions for twenty minutes is what separates them.',
      steps:[
        'Prepare a <b>60-second version</b>: problem, what you built, one interesting technical decision. This is your default answer.',
        'Prepare a <b>five-minute version</b> adding architecture and one hard bug you solved.',
        'Prepare a <b>twenty-minute version</b> where you could whiteboard the data model and defend every choice.',
        'Write out the answers to: Why that database? Why that framework? What was the hardest part? What would you change? How did you test it? What happens if it gets 1,000 users at once?',
        'Record yourself giving the five-minute version. Watch it back. <b>Cut every sentence that lists a feature instead of explaining a decision.</b>',
        'Practise saying "I do not know, but here is how I would find out" for at least one question. You will need it.',
        'Add the 60-second version to <code>story-bank.md</code> as stories 1 and 6.'
      ],
      trap:'<b>The failure mode is listing features.</b> "It has login, and a dashboard, and export" tells an interviewer nothing. "I chose sessions over JWTs because I needed instant revocation" tells them everything.',
      proof:'Three rehearsed versions, one recorded and watched back, and prepared answers to the six standard follow-ups.' }
  ]
},
{
  title:'CAPSTONE: The Hire-Me Package', emoji:'\u{1F3C6}', need:14, capstone:true,
  blurb:'Assemble the whole thing: a one-page résumé, a GitHub profile that reads well cold, a LinkedIn that gets found, a tracked application pipeline, and the weekly habit that keeps it running.',
  why:'You now have skills and artefacts. This turns them into applications, interviews and offers. Most people who fail here do not fail on ability — they fail on not having a system.',
  brief:'<b>This is a machine, not a task.</b> The goal is not "apply to some jobs" — it is a repeatable weekly loop that keeps running when you are busy and discouraged, because that is when it matters.',
  done:'<b>You have the whole package.</b> Skills, artefacts, and a system that runs weekly.<br><br>Now the honest part: the market is hard right now. CS grads are at roughly 7% unemployment against 4.2% for graduates overall, junior postings are down around a quarter from their peak, and new grads are a small share of big-tech hiring. <b>None of that is about you</b>, and it means volume and persistence matter more than they used to.<br><br>The two things most correlated with an offer are an <b>internship</b> and a <b>referral</b>. Point most of your energy there. And keep the weekly slot in your calendar — the people who get offers in month five are the ones still running the loop in month four.',
  steps:[
    { t:'do', label:'1. The one-page résumé',
      task:'Build a résumé that survives six seconds and an automated filter',
      why:'It gets roughly six seconds of human attention and often passes through keyword screening first. Both are beatable with structure.',
      setup:'One page. No exceptions at your stage. Plain, single-column, PDF.',
      steps:[
        'Use a plain single-column layout. <b>No columns, no tables, no photo, no icons</b> — parsers mangle them and drop your content.',
        'Order: Name and contacts (with GitHub and LinkedIn as live links) · Skills · <b>Projects</b> · Education · Experience. <b>Projects go above education</b> until you have an internship.',
        'Each project: name, live link, one line on what it does, then 2–3 bullets. Every bullet is <b>what you built, with what, and the outcome</b>.',
        'Use numbers wherever they are honest: "cut lookup from O(n²) to O(n), 3s → 40ms on 10k rows" beats "improved performance".',
        'Mirror the language of the job posting for real skills you have — many filters are literal keyword matches. Never claim something you cannot discuss.',
        'Cut every soft-skill adjective. "Hard-working team player" is invisible; a merged PR on someone else\'s repo is evidence.',
        'Export as PDF named <code>Taj-Chaplain-Resume.pdf</code>. Not <code>resume_final_v3.pdf</code>.',
        'Have two people read it, one non-technical. If they cannot tell what you built in ten seconds, rewrite the top third.'
      ],
      trap:'<b>Never send a Word document</b> and never let it run to two pages. Both signal inexperience before anyone reads a word.',
      proof:'A one-page PDF where the top third makes someone want to click a link.' },

    { t:'do', label:'2. The GitHub profile',
      task:'Make your profile readable by someone who arrives cold',
      why:'It gets checked, and it is the one place where your claims are verifiable. A tidy profile with three pinned, documented repos does more than a fourth project.',
      steps:[
        'Create a profile README: make a repo named <b>exactly your username</b>, add a README.md, and it renders on your profile page.',
        'Keep it short: who you are, what you are working on, three pinned projects with one line each, and how to contact you.',
        '<b>Pin your three best repos.</b> Not the most recent — the best. Everything else can stay unpinned.',
        'Each pinned repo needs a screenshot, a live link in the sidebar "Website" field, and a README a stranger can follow.',
        'Delete or archive abandoned tutorial repos. <b>A profile of half-finished clones is worse than a profile with three finished things.</b>',
        'Add a short description and topic tags to every pinned repo.',
        'Make sure your contribution graph is public and shows activity. Steady small commits read better than one heroic week.',
        'Open your own profile in a private browser window and read it as a stranger would. Fix whatever is confusing.'
      ],
      proof:'A profile README, three pinned repos each with screenshot and live link, and no abandoned clones on the front page.' },

    { t:'do', label:'3. LinkedIn, and the referral habit',
      task:'Set up a findable profile and start the outreach that actually converts',
      why:'Referrals convert dramatically better than cold applications, and the single most reliable route into a new-grad role is converting an internship. Both start here.',
      steps:[
        'Headline: not "Student". Something like "CS student at NC A&T · Python, SQL, React · building [your project]".',
        'About section: three short paragraphs — what you build, what you are looking for, how to reach you.',
        'Add every project with its live link. Add the skills that match your target roles.',
        'Turn on "Open to work" for recruiters only, and set the roles and locations you actually want.',
        'Search LinkedIn for <b>NC A&T alumni</b> at companies you are targeting. Filter by school. This is your warmest possible list.',
        'Write a reusable outreach template, then personalise it every time: two sentences on you, one specific thing about their work or team, one clear ask. <b>Under 100 words.</b>',
        'Send three this week. Expect most not to reply — that is normal and not personal.',
        'When someone does reply, ask for a 15-minute chat rather than a referral outright. <b>The referral usually follows the conversation.</b>'
      ],
      trap:'<b>Never send a wall of text or a bare "can you refer me".</b> Specific, short and easy to say yes to is what gets answered.',
      proof:'A complete profile and three personalised outreach messages sent to real people.' },

    { t:'do', label:'4. The pipeline and the weekly loop',
      task:'Build the tracker and put the recurring slot in your calendar',
      why:'This is the step that decides the outcome. Nearly everyone applies hard for two weeks and stops. The system is what carries you to month four, which is where offers usually happen.',
      setup:'A spreadsheet is fine. The tool does not matter; the recurring slot does.',
      steps:[
        'Create a sheet with columns: Company · Role · Date applied · Referral? · Source · Status · Next action · Notes.',
        'Add a second tab for outreach: Person · Company · Date · Replied? · Outcome.',
        'Set up your sources: Simplify, LinkedIn, Handshake, your university career portal, and the community-maintained GitHub new-grad and internship listing repos, which update daily.',
        '<b>Put a recurring 90-minute block in your calendar</b>, same day and time each week. Treat it like a class you cannot skip.',
        'Define the weekly quota: <b>10 applications and 2 outreach messages.</b> Small enough to sustain, large enough to work.',
        'Apply to 20 this week to seed the pipeline. Prioritise anything where you found a possible referral.',
        'For internships specifically: applications open far earlier than feels sensible — many summer programmes open the previous autumn. <b>Check target companies now regardless of the month.</b>',
        'After every interview, whatever the result, write three lines: what they asked, what you fumbled, what to fix. <b>That log is the fastest study guide you will ever have.</b>',
        'Every rejection: one line on what you would change, then move on the same day. Do not re-read it.'
      ],
      trap:'<b>The failure mode is stopping.</b> Motivation will run out — that is what the calendar block is for. Ten applications on a bad week beats zero, and beats forty on one good week followed by nothing.',
      proof:'A populated tracker, 20 applications logged, and a recurring weekly block that already exists in your calendar.' },

    { t:'do', label:'5. Aim at the part of the market that is hiring',
      task:'Point your next project at where the demand actually is',
      why:'The market has split. Entry-level generalist roles contracted sharply while AI and ML roles report a talent shortage in the hundreds of thousands. The people getting hired fastest added LLM integration, cloud or security to an otherwise normal background.',
      setup:'This is also where your Solucro income work and your employability point in the same direction — which is rare and worth exploiting.',
      steps:[
        'Pick <b>one</b> specialisation to go deeper on: LLM/AI integration, cloud and DevOps, or data engineering. One, not three.',
        'If it is AI: build something that calls a real model API and handles the hard parts — cost, latency, rate limits, retries, bad output, prompt injection. <b>Anyone can call an API; handling the failure modes is the actual skill.</b>',
        'If it is cloud: containerise a project with Docker, deploy it, add a GitHub Actions pipeline that runs tests on every push. <b>CI on a personal project is a strong signal.</b>',
        'Whichever you pick, ship one project in it and write the case study using the previous project\'s format.',
        'Add the specialisation to your headline, résumé skills, and profile README.',
        'Note the overlap with Solucro: an AI system that produces income for the brand <b>is</b> an AI portfolio project. Build it once, use it twice.',
        'Redo your job search with the specialisation in the query. The postings look different, and there are more of them.'
      ],
      proof:'One specialisation chosen, one project shipped in it, and your résumé and profiles updated to say so.' },

    { t:'do', label:'6. Close the loop and keep it running',
      task:'Set up the review habit that turns rejections into a curriculum',
      why:'Every interview is free information about exactly what you are missing. Most people waste it because it stings. Systematically harvesting it is the highest-return habit in the whole search.',
      steps:[
        'Create <code>interview-log.md</code> in a private repo.',
        'After every interview, write: date, company, stage, every question you can recall, what you fumbled, and what you will do about it. <b>Do it within an hour</b>, while it is fresh.',
        'Once a month, reread the whole log and look for the repeat. If SQL joins came up three times and went badly twice, <b>that is your next week of study</b> — not whatever felt most interesting.',
        'Feed it back into this game: the floor that matches your weak spot is the one to replay.',
        'Ask for feedback on every rejection. Most will not answer. The ones who do are worth ten tutorials.',
        'Keep the weekly block running even during interview rounds. <b>Never stop applying because one process looks promising</b> — it is the most common and most costly mistake.',
        'Track your own numbers: applications, screens, onsites, offers. Where the funnel narrows tells you what to fix. Few screens means the résumé; screens but no onsites means the coding; onsites but no offers means the behavioural or the communication.',
        'When you get an offer: <b>ask if there is flexibility before accepting.</b> Politely, once. It is expected, and the worst realistic answer is no.'
      ],
      trap:'<b>Do not skip the log because a rejection stings.</b> The information is most valuable exactly when it is least pleasant to write down.',
      proof:'An interview log with at least one entry, funnel numbers you are tracking, and a weekly block that is still in your calendar.' }
  ]
}];

{
  title:'Your First Real C++ Project', emoji:'\u{1F528}', need:4,
  blurb:'Move off the browser interpreter and build a proper multi-file C++ project locally: headers, source files, a Makefile, and a debugger session.',
  why:'Everything past floor 10 — vector, string, classes, templates — needs a real compiler. And a multi-file build with a Makefile is what your coursework will actually require.',
  brief:'<b>These steps happen on your machine, not in this box.</b> Floor 1 installed the compiler; this is where you use it properly.',
  done:'You can now build any C++ project you meet, split code across files, and step through it in a debugger. That last one is the differentiator — almost no junior uses a debugger, and it is dramatically faster than adding print statements.<br><br><b>Next:</b> put this repo on GitHub using the Job Track workshop. A C++ repo with a Makefile and a README reads as serious.',
  steps:[
    { t:'do', label:'1. Split it across files',
      task:'Build a program from a header and two source files',
      why:'One giant main.cpp is fine for an exercise and unacceptable for a project. The header/source split is how every real C++ codebase is organised, and it is what the linker exists to join back together.',
      cmds:[
        ['g++ -std=c++17 -Wall -Wextra -g main.cpp mathutil.cpp -o app','compile both files together'],
        ['g++ -c mathutil.cpp','compile one file to an object file'],
        ['./app','run it']
      ],
      steps:[
        'Make a folder <code>cpp-practice</code> and open it in VS Code.',
        'Create <code>mathutil.h</code> containing include guards and two <b>declarations</b>: <code>int add(int a, int b);</code> and <code>double average(const int* arr, int n);</code>',
        'Include guards go at the top and bottom: <code>#ifndef MATHUTIL_H</code>, <code>#define MATHUTIL_H</code>, then your declarations, then <code>#endif</code>. <b>Without them, including the header twice is a redefinition error.</b>',
        'Create <code>mathutil.cpp</code> that <code>#include "mathutil.h"</code> and <b>defines</b> both functions.',
        'Create <code>main.cpp</code> that includes the header and calls both.',
        'Compile <b>both</b> source files: <code>g++ -std=c++17 -Wall -Wextra -g main.cpp mathutil.cpp -o app</code>.',
        'Now compile only <code>main.cpp</code> on its own. <b>Read the linker error.</b> That is what "undefined reference" means — the declaration was found, the definition was not.',
        'Add <code>#pragma once</code> to a second header instead of include guards, and note that it does the same job in one line (non-standard, but universally supported).'
      ],
      trap:'<b>Never <code>#include</code> a .cpp file.</b> It compiles, then produces baffling duplicate-symbol errors at link time. Include headers only.',
      proof:'A program built from three files, and a linker error you produced and understood on purpose.' },

    { t:'do', label:'2. Add a Makefile',
      task:'Automate the build so you stop retyping compiler commands',
      why:'Retyping a g++ line with six flags is how you end up silently dropping <code>-Wall</code>. A Makefile also only rebuilds what changed, which matters once C++ compile times bite.',
      cmds:[
        ['make','build using the Makefile'],
        ['make clean','remove build artefacts'],
        ['make -B','force a full rebuild']
      ],
      steps:[
        'Create a file named exactly <code>Makefile</code> (no extension) in the project folder.',
        'Add the variables:<br><code>CXX = g++</code><br><code>CXXFLAGS = -std=c++17 -Wall -Wextra -g</code>',
        'Add the main rule:<br><code>app: main.cpp mathutil.cpp</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;$(CXX) $(CXXFLAGS) main.cpp mathutil.cpp -o app</code>',
        '<b>The indent must be a real TAB character, not spaces.</b> This is the single most common Makefile error and the message is unhelpful.',
        'Add a clean rule:<br><code>clean:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;rm -f app *.o</code>',
        'Run <code>make</code>. Then run it again without changing anything — it should say the target is up to date.',
        'Change one file and run <code>make</code> again. Watch it rebuild.',
        'Add <code>.gitignore</code> with <code>app</code>, <code>*.o</code> and <code>*.exe</code>. <b>Never commit compiled binaries.</b>'
      ],
      trap:'<b>"Makefile:4: *** missing separator. Stop."</b> means you used spaces where a tab was required. Turn on "render whitespace" in VS Code to see it.',
      proof:'<code>make</code> builds the project, <code>make clean</code> removes the artefacts, and binaries are gitignored.' },

    { t:'do', label:'3. Use the debugger and the sanitizers',
      task:'Step through a crash instead of guessing at it',
      why:'This is the step that separates you. Most juniors debug C++ with print statements. A debugger plus sanitizers finds memory bugs in seconds that printing would never reveal.',
      cmds:[
        ['g++ -fsanitize=address,undefined -g main.cpp -o app','build with runtime checks'],
        ['gdb ./app','start the debugger'],
        ['run','run inside gdb'],
        ['bt','backtrace after a crash']
      ],
      steps:[
        'Write a function that deliberately reads past the end of an array — a 5-element array and a loop using <code>i &lt;= n</code>.',
        'Compile it normally and run it. <b>Note that it probably does not crash</b>, and may print something plausible. That is the danger.',
        'Now rebuild with <code>-fsanitize=address,undefined -g</code> and run it again. Read the report: it names the file, the line and the exact kind of overflow.',
        'Fix the bug and confirm the report disappears.',
        'Now the debugger. In VS Code, click to the left of a line number to set a red breakpoint, then press <b>F5</b>.',
        'Use <b>F10</b> to step over and <b>F11</b> to step into a function. Watch the VARIABLES panel change as you go.',
        'Hover over a pointer while paused and look at the address. Then look at what it points to. <b>Seeing this makes pointers click properly.</b>',
        'Cause a segfault on purpose — dereference a null pointer — and use the debugger to find the exact line.'
      ],
      trap:'<b>You must compile with <code>-g</code></b> or the debugger has no line numbers and shows you assembly. Sanitizers also need it for useful output.',
      proof:'A sanitizer report you produced and fixed, and a debugging session where you stepped through code and inspected a pointer.' }
  ]

{
  title:'Build Your Own Vector', emoji:'\u{1F4E6}', need:11,
  blurb:'Implement a dynamic array from scratch — allocation, doubling growth, copy constructor, destructor — then prove it does not leak.',
  why:'The classic C++ exercise, and a genuinely good interview answer. Once you have written the Rule of Three yourself, shallow versus deep copy stops being trivia and becomes something you have felt.',
  brief:'<b>Build it locally with your real compiler.</b> Classes and templates are past what the browser interpreter handles — which is exactly why floor 1 set up g++.',
  done:'You have implemented the container the whole language is built around, including the ownership semantics people fail interviews on.<br><br><b>Keep it.</b> "I implemented a dynamic array with the Rule of Five and verified it leak-free with ASan" is a genuinely strong sentence, and it is now true.<br><br><b>Extend it:</b> template it on the element type, add iterators so range-for works, then implement a linked list and a hash map the same way.',
  steps:[
    { t:'do', label:'1. The core: data, size, capacity',
      task:'Write a class holding a heap array with push_back and doubling growth',
      why:'Three members and one growth rule is the entire idea behind std::vector. Writing it makes the amortised-O(1) explanation something you understand rather than recite.',
      steps:[
        'Create <code>IntVector.h</code> and <code>IntVector.cpp</code>, plus a <code>main.cpp</code> to test.',
        'The class needs three private members: <code>int* data;</code>, <code>int size;</code>, <code>int capacity;</code>.',
        'Constructor: start with a small capacity (say 1), <code>data = new int[capacity];</code>, size 0.',
        'Destructor: <code>delete[] data;</code>. <b>Note the brackets</b> — new[] must pair with delete[].',
        'Write <code>push_back(int value)</code>: if <code>size == capacity</code>, grow first, then store and increment size.',
        'Write the private <code>grow()</code>: double the capacity, allocate a new array, copy every element, <code>delete[]</code> the old, point <code>data</code> at the new.',
        'Add <code>int getSize() const</code> and <code>int at(int i) const</code> — and have <code>at</code> check bounds.',
        'Test it: push 20 values and print them back. Print the capacity as you go and <b>watch it double</b>: 1, 2, 4, 8, 16, 32.'
      ],
      trap:'<b>In grow(), copy before you delete.</b> Deleting the old array first and then copying from it is a use-after-free, and it will sometimes appear to work.',
      proof:'A working push_back with visible doubling growth, and bounds-checked access.' },

    { t:'do', label:'2. The Rule of Three',
      task:'Add a copy constructor and copy assignment, and prove the default ones were broken',
      why:'This is the interview question. Doing it yourself, and watching the double-free happen first, makes the answer permanent.',
      steps:[
        '<b>First, see the bug.</b> In main, create a vector, push some values, then write <code>IntVector b = a;</code> and let both go out of scope.',
        'Run it with <code>-fsanitize=address</code>. You should get a <b>double free</b> — both objects deleted the same pointer. <b>Read that report properly.</b>',
        'Now write the copy constructor: <code>IntVector(const IntVector& other)</code>. Allocate a <i>new</i> array of the same capacity and copy the elements across.',
        'Write copy assignment: <code>IntVector& operator=(const IntVector& other)</code>.',
        '<b>Guard against self-assignment</b> at the top: <code>if (this == &other) return *this;</code>. Without it, <code>a = a;</code> deletes the data then copies from the freed pointer.',
        'In assignment, delete the existing data before allocating the new — otherwise you leak the old array.',
        'Return <code>*this</code> so chaining works: <code>a = b = c;</code>',
        'Rerun with the sanitizer. Both the double free and the leak should be gone.',
        'Prove it is a deep copy: copy the vector, modify the copy, and confirm the original is unchanged.'
      ],
      trap:'<b>Self-assignment is the step everyone skips</b>, and it is exactly what an interviewer probes. <code>a = a;</code> must not destroy the object.',
      proof:'A sanitizer-clean build, a demonstrated deep copy, and self-assignment that does not corrupt anything.' },

    { t:'do', label:'3. Make it modern',
      task:'Add move semantics, template it, and make range-for work',
      why:'This takes it from a C exercise to modern C++, and each piece maps directly to a floor you have cleared.',
      steps:[
        'Add a <b>move constructor</b>: <code>IntVector(IntVector&& other) noexcept</code>. Steal <code>other.data</code>, then set <code>other.data = nullptr</code> and its size and capacity to 0.',
        '<b>Nulling the source matters</b> — otherwise its destructor frees the buffer you just stole.',
        'Add move assignment with the same pattern, plus the self-assignment guard.',
        'Test it: return an IntVector by value from a function and confirm no copy happens. Add a print in the copy constructor to prove it.',
        'Now template it: change the class to <code>template &lt;typename T&gt; class Vector</code> and replace every <code>int</code> element type with <code>T</code>.',
        '<b>Move everything into the header.</b> Templates cannot be split across .h and .cpp the usual way — the compiler needs the full definition.',
        'Add <code>T* begin() { return data; }</code> and <code>T* end() { return data + size; }</code>. <b>That is all range-for needs</b> — now <code>for (const auto&amp; x : v)</code> works on your own class.',
        'Test with <code>Vector&lt;int&gt;</code> and <code>Vector&lt;std::string&gt;</code>.',
        'Run everything one last time under <code>-fsanitize=address,undefined</code> and confirm it is clean.'
      ],
      trap:'<b>Forgetting to null the moved-from pointer</b> gives you a double free that only appears sometimes. If moves work in a test and crash in real use, check that first.',
      proof:'A templated container that works with two different types, supports range-for, moves without copying, and is sanitizer-clean.' }
  ]
},

function addXP(n){
  S.streak++;
  const mult = S.streak>=6?2 : (S.streak>=3?1.5:1);
  const gain = Math.round(n*mult);
  const before = level();
  S.xp += gain; if(S.streak>S.best) S.best=S.streak;
  save(); renderHUD();
  if(level()>before){ sfx.lvl(); setTimeout(()=>toast('⬆ LEVEL '+level()+' — '+rank()),700); }
  return {gain, mult};
}
function addCoins(n){ S.coins+=n; sfx.coin(); save(); renderHUD(); }
function hurt(){
  if(S.inv.ward){ S.inv.ward--; save(); renderHUD(); toast('\u{1F6E1}️ Your ward absorbed the hit.'); return; }
  S.streak=0; S.hearts--; sfx.hurt();
  const f=el('div','flashred'); document.body.appendChild(f); setTimeout(()=>f.remove(),450);
  if(S.hearts<=0){ S.hearts=5; S.coins=Math.max(0,S.coins-10); save(); renderHUD(); toast('\u{1F480} You fell. Hearts restored, 10 coins lost.'); }
  else { save(); renderHUD(); }
}

function fmtJS(v){
  if(typeof v==='string') return v;
  if(v===null) return 'null';
  if(typeof v==='object'){ try{ return JSON.stringify(v); }catch(e){ return String(v); } }
  return String(v);
}
const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
async function runJS(code){
  const logs=[];
  const push=(...a)=>logs.push(a.map(fmtJS).join(' '));
  const fake={log:push,error:push,warn:push,info:push};
  // a real but detached document, so the DOM floor and the capstone can run for real
  const sandboxDoc = document.implementation.createHTMLDocument('sandbox');
  const fn = new AsyncFunction('console','document','"use strict";\n'+code);
  await fn(fake, sandboxDoc);
  await new Promise(r=>setTimeout(r,80));   // let short timers and microtasks land
  return logs.join('\n');
}

/* --- Python: Pyodide --- */
let pyodide=null, pyLoad=null;
function getPy(){
  if(pyodide) return Promise.resolve(pyodide);
  if(pyLoad) return pyLoad;
  pyLoad=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    s.onload=async()=>{ try{ pyodide=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'}); res(pyodide);}catch(e){rej(e);} };
    s.onerror=()=>rej(new Error('Could not download the Python engine. It needs internet the first time.'));
    document.head.appendChild(s);
  });
  return pyLoad;
}
async function runPY(code, keep){
  const py=await getPy();
  let out='';
  py.setStdout({batched:t=>{out+=t+'\n';}});
  py.setStderr({batched:t=>{out+=t+'\n';}});
  if(!keep) py.runPython('for __k in list(globals()):\n    if not __k.startswith("__"):\n        del globals()[__k]');
  py.runPython(code);
  return out.replace(/\n+$/,'');
}

/* --- R: WebR --- */
let webR=null, rLoad=null;
function getR(){
  if(webR) return Promise.resolve(webR);
  if(rLoad) return rLoad;
  rLoad=(async()=>{
    let mod;
    try{ mod=await import('https://webr.r-wasm.org/latest/webr.mjs'); }
    catch(e){ throw new Error('Could not load the R engine. It needs internet, and some browsers block it when the file is opened directly from disk — see the note under the editor.'); }
    // PostMessage channel: the one that works without cross-origin isolation.
    const w=new mod.WebR({ channelType: (mod.ChannelType&&mod.ChannelType.PostMessage!==undefined)?mod.ChannelType.PostMessage:3 });
    await w.init();
    webR=w; return w;
  })();
  return rLoad;
}
async function runR(code, keep){
  const w=await getR();
  const shelter=await new w.Shelter();
  try{
    const full=(keep?'':'rm(list = ls())\n')+code;
    const res=await shelter.captureR(full,{withAutoprint:true,captureStreams:true,captureConditions:false});
    return res.output.filter(o=>o.type==='stdout'||o.type==='stderr').map(o=>o.data).join('\n').replace(/\n+$/,'');
  } finally { await shelter.purge(); }
}

/* --- C++: JSCPP interpreter (a C-style subset; see the note in renderCode) --- */
let jscpp=null, cppLoad=null;
/* several mirrors, tried in order — CDNs move things and this one is a small project */
const CPP_SOURCES=[
  'https://cdn.jsdelivr.net/gh/felixhao28/JSCPP@gh-pages/dist/JSCPP.es5.min.js',
  'https://cdn.jsdelivr.net/npm/jscpp/dist/JSCPP.es5.min.js',
  'https://unpkg.com/jscpp/dist/JSCPP.es5.min.js',
  'https://cdn.jsdelivr.net/npm/JSCPP@2.0.10/dist/JSCPP.es5.min.js',
  'https://felixhao28.github.io/JSCPP/dist/JSCPP.es5.min.js'
];
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error('could not load '+src));
    document.head.appendChild(s);
  });
}
function cppOfflineError(){
  const e=new Error('The in-browser C++ interpreter is unavailable.');
  e.cppOffline=true;
  return e;
}
function getCPP(){
  if(jscpp) return Promise.resolve(jscpp);
  if(cppLoad) return cppLoad;
  cppLoad=(async()=>{
    for(const src of CPP_SOURCES){
      try{
        await loadScript(src);
        if(window.JSCPP){ jscpp=window.JSCPP; return jscpp; }
      }catch(e){ /* try the next mirror */ }
    }
    cppLoad=null;              // allow a later retry
    throw cppOfflineError();
  })();
  return cppLoad;
}
const CPP_SUBSET_NOTE='\n\n— This in-browser interpreter runs a C-style subset: iostream (cout/cin/endl), primitive types, arrays, pointers, functions, cmath and cstring. std::vector, std::string, classes and templates need a real compiler. Every challenge here is written to stay inside the subset, so if you hit this, it is usually a syntax error rather than a missing feature.';
async function runCPP(code){
  const J=await getCPP();
  let out='';
  const config={ stdio:{ write:s=>{ out+=s; } }, unsigned_overflow:'warn', maxTimeout:5000 };
  try{ J.run(code, '', config); }
  catch(e){ throw new Error(String((e&&e.message)||e)+CPP_SUBSET_NOTE); }
  return out.replace(/\n+$/,'');
}

let SQLMOD=null, sqlLoad=null;
const SCHEMA=`
CREATE TABLE employees (id INTEGER, name TEXT, dept TEXT, salary INTEGER, years INTEGER, manager_id INTEGER);
INSERT INTO employees VALUES (1,'Ada','Engineering',120000,5,2),(2,'Grace','Engineering',135000,8,NULL),
 (3,'Linus','Engineering',98000,2,2),(4,'Marie','Sales',87000,4,5),(5,'Alan','Sales',91000,6,NULL),
 (6,'Katherine','Design',79000,3,7),(7,'Tim','Design',105000,9,NULL);
CREATE TABLE sales (id INTEGER, emp_id INTEGER, amount INTEGER, region TEXT, bonus INTEGER);
INSERT INTO sales VALUES (1,4,5000,'West',NULL),(2,4,7000,'East',500),(3,5,12000,'West',1000),
 (4,5,3000,'North',NULL),(5,1,2000,'West',200);
`;
function getSQL(){
  if(SQLMOD) return Promise.resolve(SQLMOD);
  if(sqlLoad) return sqlLoad;
  sqlLoad=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js';
    s.onload=async()=>{ try{ SQLMOD=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f}); res(SQLMOD);}catch(e){rej(e);} };
    s.onerror=()=>rej(new Error('Could not download the SQL engine. It needs internet the first time.'));
    document.head.appendChild(s);
  });
  return sqlLoad;
}
async function runSQL(q){
  const SQL=await getSQL();
  const db=new SQL.Database(); db.run(SCHEMA);
  let out;
  try{
    const r=db.exec(q);
    out = r.length ? {cols:r[r.length-1].columns, rows:r[r.length-1].values.map(row=>row.map(v=>v===null?'NULL':String(v)))} : {cols:[],rows:[]};
  } finally { db.close(); }
  return out;
}
function sameRows(got,want,ordered){
  const n=rs=>{ const c=rs.map(r=>r.join('')); return ordered?c:c.slice().sort(); };
  const a=n(got), b=n(want);
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}
function tableHTML(cols,rows){
  let h='<table style="border-collapse:collapse;font-family:var(--mono);font-size:13px">';
  if(cols.length) h+='<tr>'+cols.map(c=>'<th style="text-align:left;padding:4px 14px 4px 0;color:#8598b3;border-bottom:1px solid #26334a">'+esc(c)+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ h+='<tr>'+r.map(v=>'<td style="padding:3px 14px 3px 0">'+esc(v)+'</td>').join('')+'</tr>'; });
  return h+'</table>';
}
/* one entry point for every language */

    '<p class="sub">Five languages picked from what US employers hire for and what CS courses teach, plus <b>The Job Track</b> — everything between "knows a language" and "gets hired", which is the part nobody teaches. Progress saves separately for each.</p>'+
    '<div class="note"><b>Never written code before?</b> Pick any track and it opens with a <b>Start Here</b> primer that assumes you know nothing at all — what code even is, before any floor asks you to write some. And throughout the game, any word with a dotted underline can be clicked for a plain-English definition. You are never expected to already know a term.</div>'));
  const g=el('div','lang');
  ['career','python','cpp','r','javascript','sql'].forEach(k=>{
    const c=CONTENT[k]; if(!c) return;
    const n=c.zones.reduce((a,z)=>a+z.encounters.length,0);
    const np=(PROJECTS[k]||[]).length;
    const card=el('div','card','<span class="tag">'+c.tag+'</span><h2 style="margin-top:11px">'+c.name+'</h2>'+
      '<p class="sub">'+c.tagline+'</p><p class="sub">'+c.zones.length+' floors &middot; '+n+' challenges &middot; '+np+' build projects</p>');
    card.onclick=()=>{
      S.lang=k; sfx.page();
      if(!S.primed[k]){ S.view='primer'; S.ppage=0; save(); render(); window.scrollTo(0,0); }
      else goMap();
    };

  });
  v.appendChild(g);
  v.appendChild(el('div','card',
    '<p class="sub"><b>Not sure? Start with Python</b> — gentlest syntax, most job listings, and the language most interviews let you pick. <b>R</b> is the one for a statistics or data class. Once you have cleared Python floor 12, <b>switch to The Job Track</b>: that is where the actual hiring gap is.</p>'+
    '<p class="sub" style="margin-bottom:0"><b>Engines:</b> JavaScript runs instantly and offline. Python and SQL download a real engine on first run. R downloads actual R compiled to WebAssembly — the biggest download, give it a moment. <b>C++</b> uses a small third-party interpreter that is occasionally unavailable; if it fails, every challenge falls back to building locally with <code>g++</code>, which is how C++ works in real life anyway.</p>'));
}

  const shop=el('button','gold','\u{1F3EA} Shop  (\u{1FA99} '+S.coins+')'); shop.onclick=()=>{S.view='shop';save();render();};
  const yard=el('button','ghost','\u{1F3AF} Practice Yard'); yard.onclick=()=>{S.view='yard';save();render();};

/* ---------- lesson (Codex) ---------- */

function codexHTML(Z){

function openCodex(){
  const Z=L().zones[S.zone];
  $('#ovl').innerHTML='<div class="inner"><div class="row" style="justify-content:flex-end">'+
    '<button class="ghost" onclick="closeOvl()">✕ Close</button></div>'+

function closeOvl(){ $('#ovl').innerHTML=''; }

/* ---------- battle ---------- */
let arenaEl=null;
function renderBattle(v){
  const Z=L().zones[S.zone];
  if(S.enc>Z.encounters.length-1) S.enc=0;
  const e=Z.encounters[S.enc];
  const totalHP=Z.encounters.length*10;
  const hp=totalHP-clearedIn(S.zone)*10;
  const a=el('div','arena',
    '<div class="mon"><div class="face">'+Z.emoji+'</div><div class="info">'+
    '<div class="nm">'+(Z.boss?'☠ ':'')+Z.mon+'</div>'+
    '<div class="hpbar"><i style="width:'+Math.max(0,hp/totalHP*100)+'%"></i></div>'+
    '<div class="sub" style="margin-top:4px">'+Math.max(0,hp)+' / '+totalHP+' HP &middot; challenge '+(S.enc+1)+' of '+Z.encounters.length+'</div>'+
    '</div></div><div class="taunt">'+Z.taunt+'</div>');
  arenaEl=a; v.appendChild(a);

  const bar=el('div','row');
  const cx=el('button','ghost','\u{1F4D6} Codex'); cx.onclick=openCodex; bar.appendChild(cx);
  const pv=el('button','ghost','&larr; Prev'); pv.disabled=S.enc===0; pv.onclick=()=>{S.enc--;save();render();};
  const nx=el('button','ghost','Next &rarr;'); nx.disabled=S.enc>=Z.encounters.length-1; nx.onclick=()=>{S.enc++;save();render();};
  bar.append(pv,nx);
  const mp=el('button','ghost','Map'); mp.onclick=goMap; bar.appendChild(mp);
  v.appendChild(bar);

  if(e.t==='mcq') renderMCQ(v,e);
  else if(e.t==='fill') renderFill(v,e);
  else if(e.t==='do') renderDo(v,e,null);
  else renderCode(v,e,null);
}

/* real-world tasks: things you do on your own machine, not in this box.
   ctx === null -> dungeon encounter · ctx = {p,s} -> workshop project step  */
function renderDo(v,e,ctx){
  const already = ctx ? pDone(ctx.p,ctx.s) : isDone(S.zone,S.enc);
  const c=el('div','card',
    '<div class="sub">\u{1F6E0}️ REAL TASK — leave the game and do this on your computer</div>'+
    '<h2 style="margin-top:6px">'+(ctx?'Step '+(ctx.s+1)+' — ':'')+e.task+'</h2>'+
    (e.why?'<p class="sub">'+e.why+'</p>':'')+
    (e.setup?'<div class="note">'+e.setup+'</div>':''));
  if(e.cmds){
    c.appendChild(el('div','outlbl','commands you will use'));
    c.insertAdjacentHTML('beforeend','<table class="cmds">'+
      e.cmds.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="sub">'+r[1]+'</td></tr>').join('')+'</table>');
  }
  const boxes=[];
  e.steps.forEach((s,i)=>{
    const row=el('label','chk');
    const cb=el('input'); cb.type='checkbox';
    cb.onchange=()=>{ row.classList.toggle('on',cb.checked); if(cb.checked) sfx.page(); };
    row.appendChild(cb);
    row.insertAdjacentHTML('beforeend','<span class="n">'+(i+1)+'</span><div>'+s+'</div>');
    boxes.push(cb); c.appendChild(row);
  });
  if(e.trap) c.insertAdjacentHTML('beforeend','<div class="warn">'+e.trap+'</div>');
  if(e.proof) c.insertAdjacentHTML('beforeend','<div class="note"><b>Proof it worked:</b> '+e.proof+'</div>');

  const res=el('div');
  const r=el('div','row');
  const go=el('button','primary','✓ I did all of this');
  go.onclick=()=>{
    if(!boxes.every(b=>b.checked)){
      toast('Tick every step first. Nobody is watching — but this one only counts if you actually did it.');
      return;
    }
    go.disabled=true;
    res.innerHTML='<p class="ok">✓ Done. That is a real skill now, not a fact you read.</p>';
    if(ctx){
      if(!pDone(ctx.p,ctx.s)){ S.pdone[pk(ctx.p,ctx.s)]=1; save(); addXP(80); addCoins(25);
        toast('Step shipped  +80 XP  +25 \u{1FA99}'); }
      const last = ctx.s >= P()[ctx.p].steps.length-1;
      const n=el('button','primary', last?'\u{1F3C1} Finish project':'Next step →');
      n.onclick=()=>{ if(last) shipProject(ctx.p); else { S.pstep=ctx.s+1; save(); render(); window.scrollTo(0,0); } };
      res.appendChild(n);
    } else {
      if(isDone(S.zone,S.enc)){ sfx.hit(); }
      else { S.done[dk(S.zone,S.enc)]=1; save(); strike(15,true); addXP(60); addCoins(20);
             toast('Real task cleared  +60 XP  +20 \u{1FA99}'); }
      const n=el('button','primary','Continue →'); n.onclick=advance; res.appendChild(n);
    }
  };
  r.appendChild(go);
  if(!ctx){ const skip=el('button','ghost','Skip for now'); skip.onclick=advance; r.appendChild(skip); }
  c.appendChild(r); c.appendChild(res);
  v.appendChild(c);
  if(already) c.appendChild(el('p','sub','(already cleared)'));
}
function strike(dmg,crit){
  if(!arenaEl) return;
  arenaEl.classList.add('hit'); setTimeout(()=>arenaEl.classList.remove('hit'),360);
  const d=el('div','dmg',(crit?'CRIT ':'')+'-'+dmg); arenaEl.appendChild(d); setTimeout(()=>d.remove(),1000);
  const bar=arenaEl.querySelector('.hpbar i');
  const Z=L().zones[S.zone], total=Z.encounters.length*10;
  if(bar) bar.style.width=Math.max(0,(total-clearedIn(S.zone)*10)/total*100)+'%';
  crit?sfx.crit():sfx.hit();
}
function win(clean){
  const first=!isDone(S.zone,S.enc);
  if(first){
    S.done[dk(S.zone,S.enc)]=1; save();
    strike(clean?15:10, clean);
    const r=addXP(clean?45:25);
    addCoins(clean?12:8);
    toast('+'+r.gain+' XP'+(r.mult>1?'  \u{1F525}×'+r.mult:'')+'   +'+(clean?12:8)+' \u{1FA99}');
  } else { sfx.hit(); }
}
function advance(){
  const Z=L().zones[S.zone];
  if(S.enc<Z.encounters.length-1){ S.enc++; save(); render(); window.scrollTo(0,0); return; }
  if(!zoneDone(S.zone)){ S.enc=firstUndone(S.zone); save(); render(); toast('Still challenges left on this floor.'); return; }
  victory();
}
function victory(){
  sfx.win();
  const Z=L().zones[S.zone];
  const bkey=S.lang+':'+S.zone;
  const firstClear=!S.boss[bkey];
  const bonus=firstClear?(40+S.zone*8):0;
  if(firstClear){ S.boss[bkey]=1; S.coins+=bonus; }
  save();
  const v=$('#view'); v.innerHTML='';
  const newProj=P().map((p,i)=>({p,i})).filter(x=>x.p.need===floorsCleared());
  v.appendChild(el('div','card',
    '<div style="font-size:52px;text-align:center">'+Z.emoji+'</div>'+
    '<h2 style="text-align:center">'+Z.mon+' defeated</h2>'+
    '<p class="sub" style="text-align:center">Floor '+(S.zone+1)+' — '+Z.title+' cleared.'+
      (firstClear?'<br>Loot: <b>+'+bonus+' \u{1FA99} coins</b>':'<br>(replay — no loot)')+'</p>'+
    (newProj.length?'<p class="sub" style="text-align:center;color:var(--pur)">\u{1F528} Workshop unlocked: <b>'+newProj.map(x=>x.p.title).join(', ')+'</b></p>':'')+
    '<p class="sub" style="text-align:center">'+(S.zone+1<L().zones.length
      ? 'The stairs down have opened.'
      : 'You have cleared the entire '+L().name+' dungeon. Go build something in the Workshop.')+'</p>'));
  const r=el('div','row'); r.style.justifyContent='center';
  if(S.zone+1<L().zones.length){
    const b=el('button','primary','⬇ Descend to Floor '+(S.zone+2));
    b.onclick=()=>{ sfx.page(); enterZone(S.zone+1); };
    r.appendChild(b);
  }
  const w=el('button','pur','\u{1F528} Workshop'); w.onclick=()=>{S.view='shed';save();render();window.scrollTo(0,0);}; r.appendChild(w);
  const sh=el('button','gold','\u{1F3EA} Shop'); sh.onclick=()=>{S.view='shop';save();render();}; r.appendChild(sh);
  const m=el('button','ghost','Map'); m.onclick=goMap; r.appendChild(m);
  v.appendChild(r);
  window.scrollTo(0,0);
}

function renderMCQ(v,e){
  const c=el('div','card','<h2>⚔ '+e.q+'</h2>'+(e.code?'<pre><code>'+esc(e.code)+'</code></pre>':''));
  const box=el('div');
  let clean=true, locked=false;
  e.opts.forEach((o,i)=>{
    const b=el('button','opt','<code>'+o+'</code>');
    b.onclick=()=>{
      if(locked||b.classList.contains('gone')) return;
      locked=true;
      if(i===e.a){
        b.classList.add('correct'); win(clean);
        c.appendChild(el('p','ok','✓ Correct. <span style="color:var(--dim)">'+e.why+'</span>'));
        const n=el('button','primary','Continue →'); n.onclick=advance; c.appendChild(n);
      } else {
        b.classList.add('wrong'); box.children[e.a].classList.add('correct'); hurt(); clean=false;
        c.appendChild(el('p','no','✗ Not quite — the green one is right. <span style="color:var(--dim)">'+e.why+'</span>'));
        const r=el('div','row');
        const ag=el('button','primary','Try again'); ag.onclick=()=>render();
        const n=el('button','ghost','Continue →'); n.onclick=advance;
        r.append(ag,n); c.appendChild(r);
      }
    };
    box.appendChild(b);
  });
  c.appendChild(box);
  if(S.inv.scan){
    const sc=el('button','gold','\u{1F441}️ Use True Sight (removes 2 wrong)');
    sc.onclick=()=>{
      S.inv.scan--; save(); renderHUD(); sc.remove();
      let rm=0; e.opts.forEach((_,i)=>{ if(i!==e.a && rm<2){ box.children[i].classList.add('gone'); rm++; } });
      clean=false;
    };
    c.appendChild(sc);
  }
  if(isDone(S.zone,S.enc)) c.appendChild(el('p','sub','(already cleared — no XP for a replay)'));
  v.appendChild(c);
}

function renderFill(v,e){
  const parts=e.code.split('___');
  const c=el('div','card','<h2>⚔ '+e.q+'</h2>');
  const pre=el('pre'); pre.appendChild(document.createTextNode(parts[0]));
  const inp=noAutoFix(el('input')); inp.className='blank'; inp.placeholder='?';
  pre.appendChild(inp); pre.appendChild(document.createTextNode(parts[1]||''));
  c.appendChild(pre);
  const res=el('div');
  const go=el('button','primary','⚔ Strike');
  const check=()=>{
    const val=inp.value.trim().toLowerCase();
    if(!val) return;
    if(e.answers.map(a=>a.toLowerCase()).includes(val)){
      win(true); res.innerHTML='<p class="ok">✓ Correct. <span style="color:var(--dim)">'+e.why+'</span></p>';
      const n=el('button','primary','Continue →'); n.onclick=advance; res.appendChild(n);
      go.disabled=true; inp.disabled=true;
    } else {
      hurt(); res.innerHTML='<p class="no">✗ Not it. Try again — the Codex button has the answer.</p>';
    }
  };
  go.onclick=check;
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') check(); });
  const r=el('div','row'); r.appendChild(go);
  const cx=el('button','ghost','\u{1F4D6} Codex'); cx.onclick=openCodex; r.appendChild(cx);
  c.appendChild(r); c.appendChild(res);
  v.appendChild(c);
  setTimeout(()=>inp.focus(),50);
}

/* renderCode powers both dungeon challenges and workshop project steps.
   ctx === null  -> dungeon encounter
   ctx = {p,s}   -> project p, step s                                        */
function renderCode(v,e,ctx){
  const isSQL=(e.t==='sql')||(S.lang==='sql');
  const already = ctx ? pDone(ctx.p,ctx.s) : isDone(S.zone,S.enc);
  const c=el('div','card','<h2>'+(ctx?'\u{1F528} Step '+(ctx.s+1):'⚔ Challenge')+'</h2><p>'+e.task+'</p>'+
    (e.spec?'<div class="note">'+e.spec+'</div>':''));
  const ta=el('textarea'); ta.value=e.starter||''; ta.spellcheck=false;
  if(ctx) ta.style.minHeight='260px';
  ta.addEventListener('keydown',ev=>{
    if(ev.key==='Tab'){ ev.preventDefault();
      const s=ta.selectionStart, ind=isSQL?'  ':(L().indent||'  ');
      ta.value=ta.value.slice(0,s)+ind+ta.value.slice(ta.selectionEnd);
      ta.selectionStart=ta.selectionEnd=s+ind.length;
    }
    if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){ ev.preventDefault(); run.click(); }
  });
  c.appendChild(ta);
  attachCodeBar(ta, S.lang, c);
  if(isSQL) c.appendChild(el('p','sub','Tables: <code>employees(id, name, dept, salary, years, manager_id)</code> &middot; <code>sales(id, emp_id, amount, region, bonus)</code>'));
  else if(e.harness) c.appendChild(el('p','sub','Your code will be tested with:<br><code>'+esc(e.harness).replace(/\n/g,'<br>')+'</code>'));
  else c.appendChild(el('p','sub','Whatever your code prints is what gets checked.'));
  if(S.lang==='r') c.appendChild(el('p','sub','R prints vectors with an <code>[1]</code> index marker — that is expected, match it exactly.'));
  if(S.lang==='cpp') c.appendChild(el('p','sub','Runs on an in-browser interpreter covering a <b>C-style subset</b>: iostream, primitives, arrays, pointers, functions, cmath, cstring. Every challenge stays inside it. For <code>vector</code>, <code>string</code>, classes and templates, compile locally with <code>g++</code> — floor 1 sets that up.'));

  const out=el('div','card'); out.style.display='none';
  const row=el('div','row');
  const run=el('button','primary','▶ Run &amp; check');
  const hint=el('button','ghost','\u{1F4A1} Hint (−5 XP)');
  const sol=el('button','ghost','Show solution');
  const rst=el('button','ghost','Reset');
  row.append(run,hint,sol,rst);
  if(!ctx){ const cx=el('button','ghost','\u{1F4D6} Codex'); cx.onclick=openCodex; row.appendChild(cx); }
  c.appendChild(row); c.appendChild(out);
  c.appendChild(el('p','sub','<span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to run'));

  let clean=true;
  hint.onclick=()=>{
    if(S.inv.oracle){ S.inv.oracle--; save(); renderHUD(); toast('\u{1F52E} The Oracle answers freely.'); }
    else if(clean){ S.xp=Math.max(0,S.xp-5); save(); renderHUD(); }
    clean=false;
    out.style.display='block'; out.innerHTML='<span class="wa">\u{1F4A1} '+e.hint+'</span>';
  };
  sol.onclick=()=>{ clean=false; out.style.display='block';
    out.innerHTML='<span class="wa">One clean solution — read it, close it, then type it yourself from memory:</span><pre><code>'+esc(e.solution)+'</code></pre>'; };
  rst.onclick=()=>{ ta.value=e.starter||''; };

  const succeed=()=>{
    if(ctx){
      if(!pDone(ctx.p,ctx.s)){ S.pdone[pk(ctx.p,ctx.s)]=1; save();
        const r=addXP(clean?60:35); addCoins(clean?18:10);
        toast('Step complete  +'+r.gain+' XP  +'+(clean?18:10)+' \u{1FA99}'); }
      const n=el('button','primary', (ctx.s<P()[ctx.p].steps.length-1)?'Next step →':'\u{1F3C1} Finish project');
      n.onclick=()=>{ if(ctx.s<P()[ctx.p].steps.length-1){ S.pstep=ctx.s+1; save(); render(); window.scrollTo(0,0); } else shipProject(ctx.p); };
      out.appendChild(n);
    } else {
      win(clean);
      const n=el('button','primary','Continue →'); n.onclick=advance; out.appendChild(n);
    }
    if(clean&&e.solution){
      const d=el('details'); d.innerHTML='<summary class="sub" style="margin-top:12px">Compare with one clean solution</summary><pre><code>'+esc(e.solution)+'</code></pre>';
      out.appendChild(d);
    }
  };

  run.onclick=async()=>{
    run.disabled=true; run.textContent='Running...';
    out.style.display='block'; out.innerHTML='<span class="sub">Running your code'+engineWarming()+'...</span>';
    try{
      let pass;
      if(isSQL){
        const r=await runSQL(ta.value);
        pass=sameRows(r.rows,e.expected,e.ordered);
        out.innerHTML='<div class="outlbl">your result</div>'+tableHTML(r.cols,r.rows);
      } else {
        const code=(ta.value)+'\n'+(e.harness||'');
        const got=(await runCode(code)).trim();
        pass = e.match ? new RegExp(e.match,'m').test(got) : (got===String(e.expected).trim());
        out.innerHTML='<div class="split"><div><div class="outlbl">your output</div><pre'+(pass?' class="out"':'')+'><code>'+
          (esc(got)||'<i style="color:#8598b3">(nothing printed)</i>')+'</code></pre></div><div><div class="outlbl">expected</div><pre><code>'+
          esc(e.expected)+'</code></pre></div></div>';
      }
      if(pass){
        out.insertAdjacentHTML('afterbegin','<p class="ok" style="font-size:18px;margin-top:0">✓ '+(ctx?'Step passed.':'Hit! Test passed.')+'</p>');
        succeed();
      } else {
        out.insertAdjacentHTML('afterbegin','<p class="no" style="margin-top:0">✗ '+(ctx?'Not there yet':'Missed')+' — compare the two panels and adjust.</p>');
        S.streak=0; clean=false; save(); renderHUD();
      }
    }catch(err){
      const msg=String(err&&err.message||err);
      if(err&&err.cppOffline){
        /* the interpreter is a third-party library and sometimes just is not there.
           C++ is compiled anyway, so fall back to the honest workflow: build it locally. */
        out.innerHTML=
          '<div class="warn"><b>The in-browser C++ interpreter could not load.</b> That is a third-party library being unavailable — not your code, and not your connection. Everything else in the game still works.</div>'+
          '<p class="sub">C++ is a <b>compiled</b> language, so the real workflow is to build it on your own machine regardless. Floor 1 sets that up in about ten minutes, and every floor past 10 needs it anyway.</p>'+
          '<div class="outlbl">what your program should print</div>'+
          '<pre class="out"><code>'+esc(String(e.expected))+'</code></pre>'+
          '<p class="sub">Save your answer as <code>main.cpp</code>, then run:<br>'+
          '<code>g++ -std=c++17 -Wall -Wextra main.cpp -o main</code><br>'+
          'then <code>./main</code> (or <code>main.exe</code> on Windows). If the output matches, mark it below.</p>';
        const r2=el('div','row');
        const ok=el('button','primary','✓ I built it locally and it matched');
        ok.onclick=()=>{ r2.remove(); succeed(); };
        const rt=el('button','ghost','↻ Retry the engine');
        rt.onclick=()=>{ cppLoad=null; jscpp=null; run.click(); };
        r2.append(ok,rt); out.appendChild(r2);
      } else {
        out.innerHTML='<p class="no" style="margin-top:0">\u{1F4A5} '+esc(msg)+'</p>'+
          '<p class="sub">Read the error slowly — that IS the job. It usually names the exact problem and the line. No damage taken for an error.</p>'+
          (S.lang==='r'&&/engine/i.test(msg)?'<div class="note"><b>R engine blocked?</b> Some browsers refuse to load it when the page is opened straight from disk. Fix: open a terminal in this folder and run <code>python -m http.server 8000</code>, then visit <code>http://localhost:8000/debug-dungeon.html</code>. Everything else in the game works either way.</div>':'');
      }
      S.streak=0; clean=false; save(); renderHUD();
    }
    run.disabled=false; run.innerHTML='▶ Run &amp; check';
  };
  v.appendChild(c);
  if(already) c.appendChild(el('p','sub','(already cleared — no XP for a replay)'));
}
